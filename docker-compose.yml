# Local dev stack: the 3 ProxCloud images + PostgreSQL + RabbitMQ.
#   docker compose up --build
# API  -> http://localhost:8080 (mgmt http://localhost:8081)
# Web  -> http://localhost:8082   Admin -> http://localhost:8083
#
# Keycloak is bundled (http://localhost:8090, realm `proxcloud`); cloud providers
# (Proxmox, Ceph S3) are registered from the admin console. Overrides go in .env.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: proxcloud
      POSTGRES_PASSWORD: proxcloud
      POSTGRES_DB: proxcloud
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

  # Dev identity provider. Realm `proxcloud` (deploy/dev/keycloak-realm.json) ships two
  # public clients — proxcloud-ui (customer console) and proxcloud-admin (operator console)
  # — and two users: demo/demo and admin/admin (emails pre-verified).
  # verifyEmail is on: org add-member and project invites only match verified emails.
  # No SMTP is configured, so a self-registered dev user cannot get past Keycloak's
  # verify-email step: tick "Email verified" for them in the Keycloak admin console.
  # The browser reaches it at localhost:8090 (that URL becomes the token's `iss`), the
  # api reaches the SAME realm at keycloak:8080 inside the compose network — hence the
  # *_DISCOVERY_URI vars below.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://${PROXCLOUD_HOST:-localhost}:8090
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/dev/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8090:8080"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: ghcr.io/mutex-solutions/proxcloud-api:dev
    restart: unless-stopped
    depends_on:
      - postgres
      - rabbitmq
      - keycloak
    environment:
      PROXCLOUD_DB_URL: postgres://proxcloud:proxcloud@postgres:5432/proxcloud?sslmode=disable
      PROXCLOUD_RABBITMQ_HOST: rabbitmq
      PROXCLOUD_RABBITMQ_PORT: "5672"
      PROXCLOUD_RABBITMQ_USERNAME: guest
      PROXCLOUD_RABBITMQ_PASSWORD: guest
      PROXCLOUD_ENCRYPTION_DEFAULT_KEY: dev-encryption-key-change-me
      PROXCLOUD_SELF_API_BASE_URL: http://${PROXCLOUD_HOST:-localhost}:8080
      PROXCLOUD_SELF_UI_BASE_URL: http://${PROXCLOUD_HOST:-localhost}:8082
      PROXCLOUD_SELF_ADMIN_BASE_URL: http://${PROXCLOUD_HOST:-localhost}:8083
      PROXCLOUD_JOBS_DEBUG_TRIGGERS: "true"
      # Both entry points stay usable (LAN IP for other machines, localhost on this box).
      PROXCLOUD_CORS_ALLOWED_ORIGINS: "http://${PROXCLOUD_HOST:-localhost}:8082,http://${PROXCLOUD_HOST:-localhost}:8083,http://localhost:8082,http://localhost:8083"
      # OIDC realms the API validates tokens against — same issuer/client vars the
      # SPAs read (below), so one .env drives login + API. Empty issuer ⇒ realm off ⇒
      # its tokens 401. Issuer = browser-facing Keycloak URL, reachable from here.
      AUTH_MAIN_OAUTH2_ISSUER_URI: ${PROXCLOUD_OAUTH2_ISSUER:-http://${PROXCLOUD_HOST:-localhost}:8090/realms/proxcloud}
      AUTH_MAIN_OAUTH2_CLIENT_ID: ${PROXCLOUD_OAUTH2_CLIENT_ID:-proxcloud-ui}
      AUTH_MAIN_OAUTH2_DISCOVERY_URI: ${PROXCLOUD_OAUTH2_DISCOVERY:-http://keycloak:8080/realms/proxcloud}
      AUTH_ADMIN_OAUTH2_ISSUER_URI: ${PROXCLOUD_ADMIN_OAUTH2_ISSUER:-http://${PROXCLOUD_HOST:-localhost}:8090/realms/proxcloud}
      AUTH_ADMIN_OAUTH2_CLIENT_ID: ${PROXCLOUD_ADMIN_OAUTH2_CLIENT_ID:-proxcloud-admin}
      AUTH_ADMIN_OAUTH2_DISCOVERY_URI: ${PROXCLOUD_ADMIN_OAUTH2_DISCOVERY:-http://keycloak:8080/realms/proxcloud}
      # admin-api shares the operator (master) realm; defaults to the admin issuer.
      AUTH_ADMIN_API_OAUTH2_ISSUER_URI: ${PROXCLOUD_ADMIN_API_OAUTH2_ISSUER:-${PROXCLOUD_ADMIN_OAUTH2_ISSUER:-http://${PROXCLOUD_HOST:-localhost}:8090/realms/proxcloud}}
      AUTH_ADMIN_API_OAUTH2_DISCOVERY_URI: ${PROXCLOUD_ADMIN_API_OAUTH2_DISCOVERY:-http://keycloak:8080/realms/proxcloud}
      AUTH_ADMIN_API_OAUTH2_CLIENT_ID: ${PROXCLOUD_ADMIN_API_OAUTH2_CLIENT_ID:-proxcloud-admin-api}
      PROXCLOUD_DEFAULT_REGION: ${PROXCLOUD_DEFAULT_REGION:-}
    ports:
      - "8080:8080"
      - "8081:8081"

  web:
    build:
      context: web
      dockerfile: Dockerfile
      args:
        APP: client
    image: ghcr.io/mutex-solutions/proxcloud-web:dev
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PROXCLOUD_API_URL: http://${PROXCLOUD_HOST:-localhost}:8080/api/v1
      PROXCLOUD_OAUTH2_ISSUER: ${PROXCLOUD_OAUTH2_ISSUER:-http://${PROXCLOUD_HOST:-localhost}:8090/realms/proxcloud}
      PROXCLOUD_OAUTH2_CLIENT_ID: ${PROXCLOUD_OAUTH2_CLIENT_ID:-proxcloud-ui}
    ports:
      - "8082:80"

  admin:
    build:
      context: web
      dockerfile: Dockerfile
      args:
        APP: admin
    image: ghcr.io/mutex-solutions/proxcloud-admin:dev
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PROXCLOUD_API_URL: http://${PROXCLOUD_HOST:-localhost}:8080/api/v1
      PROXCLOUD_OAUTH2_ISSUER: ${PROXCLOUD_ADMIN_OAUTH2_ISSUER:-http://${PROXCLOUD_HOST:-localhost}:8090/realms/proxcloud}
      PROXCLOUD_OAUTH2_CLIENT_ID: ${PROXCLOUD_ADMIN_OAUTH2_CLIENT_ID:-proxcloud-admin}
    ports:
      - "8083:80"

volumes:
  postgres-data:
