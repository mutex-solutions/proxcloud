# Every installer option with its easiest default. Override any of them under `proxcloud:` in the
# site's group_vars; the two are deep-merged into `pc` (computed.yml).
pc_defaults:
  mode: allinone                 # allinone | split (adds the services cluster for managed K8s and DBaaS)
  namespace: proxcloud

  pve:
    api_url: ""                  # as the installer reaches it
    portal_api_url: ""           # as the portal (mgmt cluster) reaches it; default: api_url
    min_version: "9.2"
    fingerprint: ""              # default: pinned on first contact (generated/pve-fingerprint)
    pool_prefix: pc-             # one pool per project; must not match the system pool
    system_pool: proxcloud-system

  preflight:
    firewall: fail               # fail | warn: datacenter firewall on, nftables on every node
    fio: auto                    # auto = when the inventory group `pve` has hosts | false
    fio_runtime: 20              # seconds per fio job
    # Class suggestion thresholds (calibration knobs): p99 sync-write latency in ms, randread IOPS.
    fio_performance_ms: 1
    fio_standard_ms: 5
    fio_capacity_iops: 2000

  mgmt:
    placement: ssh               # ssh = hosts in the inventory group mgmt | pve-vm = VMs created here
    k3s_extra_args: ""
    # For the VMs the installer creates (mgmt with pve-vm, the RustFS VM):
    ssh_public_key: ""           # default ~/.ssh/id_rsa.pub, else id_ed25519.pub
    ssh_common_args: ""          # e.g. -o ProxyJump=root@bastion.example.com
    vm:                          # placement: pve-vm
      servers: 1                 # 1 or 3
      os: debian-13
      user: debian
      cores: 4
      memory: 8192
      disk: 60
      storage: ""                # default: the default profile's storage
      bridge: vmbr0
      vlan: 0
      vmid_base: 9001
      nodes: []                  # default: every node, in order
      ips: []                    # one CIDR per server, e.g. [192.0.2.30/24]
      gateway: ""
      nameserver: ""

  ingress:
    domain: ""                   # default: <first mgmt ip>.sslip.io
    tls: none                    # none | acme (cert-manager, needs public DNS) | a TLS Secret name
    acme_email: ""

  images:
    # true (default, until there is a published release) = build the three images and the chart from
    # this checkout on the installer host (needs docker and helm there) and push them to a registry on
    # the mgmt cluster. false = pull versions.yml's `proxcloud` release from the registry below.
    build: true
    registry: ghcr.io/mutex-solutions
    chart_repo: ghcr.io/mutex-solutions/charts
    # Private registry credentials (optional): {username, password}.
    pull_secret: {}

  keycloak:
    main_realm: proxcloud
    admin_realm: proxcloud-admin
    operator:                    # first operator login; the password lands in generated/
      username: admin
      email: admin@example.com
    tenant_users: []             # optional seed logins: [{username, email, password}]; customers log in with the email

  # Tenant networks. Default: one EVPN zone over all nodes, first node as exit node.
  # Needs frr-pythontools on the nodes; on one node use kind: simple.
  network:
    default_zone: overlay        # at most 8 characters
    kind: evpn                   # evpn | simple | vlan
    bridge: ""                   # vlan only
    vlan_min: 100                # vlan only
    vlan_max: 199                # vlan only
    controller: proxcloud
    asn: 65000
    vrf_vxlan: 10000
    exit_nodes: []               # default: the first node
    cidr_pool: 10.100.0.0/16
    isolation: shared            # shared | evpn (a zone per project)
    blocked_cidrs: []            # networks tenants must not reach, beyond the node management networks
    public: {}                   # {id, name, cidr, gateway, ranges}

  # Provider registration. storage_profiles empty = what preflight detected.
  provider:
    name: Proxmox
    region: pve
    region_name: Default
    default_profile: ""          # default: on the first run the fastest detected (ceph, std, local-lvm); a re-run keeps the provider's
    # Display names for the discovered templates (config.templates overlay).
    templates:
      debian-13: {name: Debian 13, osDistro: debian}
      ubuntu-2404: {name: Ubuntu 24.04, osDistro: ubuntu}
    quota: {servers: 20, vcpus: 80, ramMb: 102400, diskGb: 2000, networks: 10, floatingIps: 5}
  storage_profiles: {}           # {slug: {storages: {"*": id}, snapshots: bool, ...}}
  storage_classes: {}            # {storage: performance|standard|capacity}: confirm a suggestion
  flavors: []                    # beyond deploy/seed/flavors.json: [{slug, name, vcpus, ramMb, diskGb}]

  templates:
    os: [debian-13, ubuntu-2404]  # catalog slugs; a slug lands in a tag, so no dots
    storage: ""                  # default: shared `images` store on a NAS, else the local profile storage
    import_storage: ""           # default: the first store with `import` content
    bridge: vmbr0
    vlan: 0
    build_ip: ""                 # CIDR, required to build
    build_gateway: ""
    nameserver: ""
    # auto = one copy per node unless the default profile is on shared storage. PVE clones to
    # another node only from shared to shared storage, so local VM disks need a copy on each node.
    per_node: auto
    keep: 2                      # versions kept per OS and node

  # mode=split: the services cluster stage 50 builds. Node templates come from images/k8s-node-template.sh.
  services:
    k8s_version: 1.35.10
    templates: {}                # {pve node: template vmid}, what the script prints
    storage: local-zfs           # boot disks and the databases' StorageClass
    iso_storage: local           # bootstrap ISOs (kubeadm join tokens): node-local only, never shared (docs/managed-k8s.md)
    pool: proxcloud-system
    capi_token_id: capmox@pve!capi
    capi_token_file: token-capi   # in generated/
    csi_token_id: csi@pve!csi
    csi_token_file: token-csi     # in generated/
    api_extra_sans: []           # more names or addresses on the services API certificate
    chart_repo: pc-registry.proxcloud-registry.svc.cluster.local:5000/charts
    # A subnet tenants can reach (over their normal egress) and that reaches the PVE API.
    network:
      bridge: ""
      gateway: ""
      prefix: 24
      dns: [1.1.1.1, 8.8.8.8]
      endpoint: ""               # kube-vip: the services API
      nodes: []                  # node addresses, e.g. [192.0.2.201-192.0.2.209]
      metallb: ""                # kamaji-api + DBaaS pool, e.g. 192.0.2.210-192.0.2.229
    control_plane: {node: "", cores: 2, memory: 4096, disk: 30}
    workers: []                  # [{node, cores, memory, disk}]: one per PVE node you want a zone on
    # Kamaji provider defaults: read once, when stage 60 first registers the provider. Later: docs/managed-k8s.md.
    kamaji:
      version_images: {}         # {k8s version: "pve1=9210,pve2=9211"}
      root_volume_gib: 30
      worker_mtu: 1450
      rwx_gib: 0                 # NAS dataset per cluster and its RWX class; 0 = none

  # mode=split: the platform's sandbox cluster (gVisor), stage 55. Not reachable by tenants yet: docs/managed-sandbox.md.
  sandbox:
    enabled: false
    pool: proxcloud-sandbox
    token: sandbox               # capmox@pve!<token>, the cluster's CAPMOX credential; secret in generated/token-<token>
    runtime_image: ""            # envd + sandbox-init for node-setup; default <images.registry>/proxcloud-sandbox-runtime:<release>
    storage: ""                  # boot disks; default: services.storage
    iso_storage: ""              # bootstrap ISOs, node-local only; default: services.iso_storage
    network:
      zone: ""                   # an existing EVPN zone; default: network.default_zone
      vnet: pcsbx
      tag: 100900                # VNI; tenant vnets take the next free one above the highest
      subnet: ""                 # required, e.g. 192.0.2.0/24: outside network.cidr_pool, nothing else in it
      gateway: ""                # required, inside subnet
      nodes: ""                  # worker addresses, e.g. 192.0.2.10-192.0.2.29
      metallb: ""                # LoadBalancer addresses inside the cluster, e.g. 192.0.2.200-192.0.2.209
      dns: [1.1.1.1, 8.8.8.8]    # never on the management network: the isolation rules drop it
      mtu: 1450
      # required: the sandbox's own egress address (D14), so abuse reports and blocklists hit it and not the nodes,
      # the portal or tenants. An IPv4 address on the exit node's uplink network that the uplink routes to that node
      # and nothing else uses; stage 55 puts it on the exit node (root ssh, inventory group pve). "node" shares the
      # exit node's own address instead (PVE's SNAT), for a site with one public address that accepts the risk.
      snat: ""
    nodes: {count: 2, cores: 4, memory: 8192, disk: 40}
    # With a domain (stage 56): the node group sandbox-proxy runs on, apart from tenant code. Its workers take addresses
    # from network.nodes too. 2 keeps the proxy up while one node rolls.
    system_nodes: {count: 2, cores: 2, memory: 2048, disk: 30}
    unsecured_min_age_minutes: 20  # a new worker takes tenant pods no earlier: CABPK's bootstrap token TTL (15) + margin
    # Stage 56, the public entry: https://<port>-<id>.<domain> -> entry appliance (TCP 443) -> sandbox-proxy, where TLS
    # ends (docs/managed-sandbox.md §4).
    domain: ""                   # required, e.g. sbx.example.org: its own DNS zone; the wildcard certificate covers it
    proxy:
      address: ""                # required: sandbox-proxy's MetalLB address, inside network.metallb
      image: ""                  # default <images.registry>/proxcloud-sandbox-proxy:<release>
    tls:
      issuer: acme               # acme (DNS-01 through PowerDNS with RFC2136) | secret (yours) | selfsigned (test sites)
      secret: ""                 # issuer secret: a kubernetes.io/tls Secret for *.<domain> in pc-sandbox, services cluster
      acme: {server: https://acme-v02.api.letsencrypt.org/directory, email: "", ca_bundle: ""}  # ca_bundle: PEM of a private ACME server's CA
    # The zone <domain> on PowerDNS (it must exist): stage 56 writes the wildcard record and, for acme, a TSIG key that may
    # update this zone alone. Needs `dnsupdate=yes` in pdns.conf and vault pdns_api_key. Empty api_url: you write the
    # record (*.<domain> A the entry's public address) and pick issuer secret or selfsigned.
    powerdns:
      api_url: ""                # e.g. http://192.0.2.53:8081
      server: localhost
      nameserver: ""             # host:port cert-manager on the services cluster sends RFC2136 updates to
    # The platform HAProxy appliance in front of sandbox-proxy (a VM in the system pool). Empty public.bridge: no
    # appliance, forward TCP 443 to proxy.address yourself.
    entry:
      pool: proxcloud-sandbox-entry  # its own pool: the portal gets firewall and guest-agent rights there alone (stage 10)
      vmid: 9110
      node: ""                   # default: first node
      os: debian-13
      cores: 1
      memory: 1024
      disk: 10
      address: ""                # its address on the sandbox vnet, outside the gateway, network.nodes and network.metallb
      public: {bridge: "", vlan: 0, address: "", gateway: ""}  # address as CIDR; the record and the internet side
    # The sandbox registry (stage 55, docs/managed-sandbox.md §6): Zot on the services cluster, its blobs in a bucket
    # of the object store (RustFS on Standard, RGW on Full). The sandbox nodes pull the built-in templates and
    # sandbox-proxy from it, each project with an account of its own (the envd runtime image: runtime_image above). Empty address: no registry, the nodes pull
    # from the images' own registries.
    registry:
      address: ""                # a MetalLB address inside services.network.metallb, e.g. 192.0.2.226
      namespace: proxcloud-sandbox-registry  # on the services cluster
      bucket: pc-sandbox-registry
      adoption: "on"             # on | dry-run | off: built-in templates follow a new pinned digest once every node has it
    # The sandbox provider stage 60 registers (first run only; the console owns it afterwards). Templates are the only
    # images offered; a site's templates replace this list instead of merging into it. "pin:<name>" is an image of
    # deploy/templates/images.yaml (the registry's copy, or the pinned source without a registry). limits empty = the
    # portal's defaults (internal/cloud/sandbox/config.go). With a domain the provider runs envd and offers the E2B API;
    # the E2B SDKs start `base` and `code-interpreter-v1` (images from deploy/templates/build.sh, docs/managed-sandbox.md
    # §5.4).
    templates:
      python: {image: "pin:python", cpu: 1, memoryGiB: 2, description: Python 3.12}
    limits: {}

  nas:
    host: ""                     # TrueNAS address; empty = no NAS stage
    pool: ""                     # truenas-app: the pool Docker apps run on
    exports: {}                  # {templates: path, capacity: path, backup: path}
    names: {templates: nas-templates, capacity: nas-capacity, backup: nas-backup}
    api_url: ""                  # default https://<host>; object_store.mode=truenas-app needs vault truenas_api_key

  object_store:
    mode: vm                     # vm | truenas-app | external | ceph-rgw
    vm:
      vmid: 9100
      name: pc-rustfs
      os: debian-13
      user: debian
      node: ""                   # default: first node
      cores: 2
      memory: 4096
      disk: 20
      data_disk: 200             # GiB, XFS in the guest
      data_storage: ""           # default: nas-capacity when present, else the default profile storage
      storage: ""                # boot disk; default: the default profile's storage
      bridge: vmbr0
      vlan: 0
      ip: ""                     # CIDR
      gateway: ""
      nameserver: ""
    truenas_app:
      name: rustfs
      train: community
      s3_port: 30900
      console_port: 30901
    # mode external / ceph-rgw: an existing S3 endpoint. ceph-rgw also registers the ceph-s3 provider
    # (preflight requires all four) and tenants see region as the store's region: the zonegroup's api_name,
    # or us-east-1, which AWS clients send no location constraint for.
    endpoint: ""
    access_key: ""
    secret_key: ""
    region: us-east-1
