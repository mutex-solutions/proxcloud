# Stage 55 (registry), mode=split with sandbox.registry.address: the sandbox registry (docs/managed-sandbox.md §6).
# Zot on the services cluster behind one MetalLB address, its blobs in a bucket of the object store (RustFS on
# Standard, RGW on Full), one account per project kept by the account sync next to it. Then the sandbox cluster's
# side: the nodes trust the registry's CA, the built-in images (deploy/templates/images.yaml, plus the release's
# sandbox-proxy) are copied in under the same digests and pre-pulled on every node. Stage 56 runs sandbox-proxy from
# the copy and stage 60 points the templates and the workers' firewall at it. Every step is idempotent.
- name: Check the sandbox registry settings
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Skip unless the registry is on
      ansible.builtin.meta: end_play
      when: not pc_sandbox_registry_on
    - name: Check the address and the object store
      vars:
        problem: "{{ pc.sandbox | pc_sandbox_registry_problem(pc.services.network.metallb, pc.object_store.mode) }}"
      ansible.builtin.assert: {that: problem == '', fail_msg: "{{ problem }}", quiet: true}
    - name: Check the pinned images
      ansible.builtin.set_fact:
        pc_sbx_images: "{{ pc_sandbox_pins | pc_sandbox_images(pc_sandbox_registry_host) }}"

- name: Build the sandbox registry
  hosts: mgmt[0]
  become: true
  gather_facts: false
  vars:
    kc: k3s kubectl --kubeconfig /root/services.kubeconfig
    pc_sbx_kubeconfig: /root/sandbox.kubeconfig  # stage 55 writes it
    pc_sbx_reg_ns: "{{ pc.sandbox.registry.namespace }}"
    pc_sbx_reg_system_ns: sandbox-system
    host: "{{ pc_sandbox_registry_host }}"
    store: "{{ lookup('ansible.builtin.file', pc_gen ~ '/object-store.json') | from_json }}"
    own_store: "{{ pc.object_store.mode in ['vm', 'truenas-app'] }}"
    bucket_secret: "{{ lookup('ansible.builtin.password', pc_gen ~ '/sandbox-registry-s3-secret ' ~ pc_alnum) }}"
    pc_sbx_reg_s3:
      endpoint: "{{ store.internalEndpoint if own_store else pc.object_store.endpoint }}"
      region: "{{ 'us-east-1' if own_store else pc.object_store.region }}"
      bucket: "{{ pc.sandbox.registry.bucket }}"
      # rustfs and rgw: a service user of its own that reaches this bucket alone; external: the store's key
      access: "{{ (pc.sandbox.registry.bucket ~ '-svc') if pc.object_store.mode != 'external' else pc.object_store.access_key }}"
      secret: "{{ bucket_secret if pc.object_store.mode != 'external' else pc.object_store.secret_key }}"
    pc_sbx_reg_users:
      admin: "{{ lookup('ansible.builtin.password', pc_gen ~ '/sandbox-registry-admin ' ~ pc_alnum) }}"
      # the portal's pruning of unreferenced template images (read and delete on t/** only); stage 60 hands it over
      gc: "{{ lookup('ansible.builtin.password', pc_gen ~ '/sandbox-registry-gc ' ~ pc_alnum) }}"
      # the portal's sandbox mirror (read and create on library/sandbox-* only, docs/template-updates.md §4); stage 60
      # hands it over as the sandbox provider's secret.registryMirror
      mirror: "{{ lookup('ansible.builtin.password', pc_gen ~ '/sandbox-registry-mirror ' ~ pc_alnum) }}"
      pull-nodes: "{{ lookup('ansible.builtin.password', pc_gen ~ '/sandbox-registry-pull-nodes ' ~ pc_alnum) }}"
      key: "{{ lookup('ansible.builtin.password', pc_gen ~ '/sandbox-registry-key ' ~ pc_alnum) }}"
    # The template build bucket: its own service user, which stage 60 gives the sandbox provider.
    builds_secret: "{{ lookup('ansible.builtin.password', pc_gen ~ '/sandbox-builds-s3-secret ' ~ pc_alnum) }}"
    pc_sbx_build_s3_host: "{{ pc_sbx_reg_s3.endpoint | urlsplit('hostname') }}"
    pc_sbx_build_s3_port: "{{ pc_sbx_reg_s3.endpoint | urlsplit('port') or (443 if pc_sbx_reg_s3.endpoint.startswith('https://') else 80) }}"
    pc_sbx_proxy_source: "{{ pc.sandbox.proxy.image or (pc.images.registry ~ '/proxcloud-sandbox-proxy:' ~ pc_ver.proxcloud) }}"
    pc_sbx_reg_sync_image: "{{ pc_sbx_proxy_source }}"
    # images.yaml merged with the portal's sandboxBuiltinPin records (read below): never older than the portal pinned.
    images: "{{ pc_sbx_pins_merged.pins | pc_sandbox_images(host) }}"
    ca_dir: /root/sandbox-registry-certs
    key_file: "{{ pc_gen }}/admin-api-key.json"
  tasks:
    - name: Skip unless the registry is on
      ansible.builtin.meta: end_play
      when: not pc_sandbox_registry_on
    - name: Look for the sandbox cluster's kubeconfig
      ansible.builtin.stat: {path: "{{ pc_sbx_kubeconfig }}"}
      register: pc_sbx_kc
    - name: Skip until stage 55 built the cluster
      ansible.builtin.meta: end_play
      when: not pc_sbx_kc.stat.exists
    # The portal may have mirrored a newer built-in image and pointed the prepull at it (Template updates, docs/
    # template-updates.md §4). Rendering images.yaml alone would silently roll that back, so the pins are read first,
    # with the installer's admin API key (stage 60 mints it) from the read-only, secret-free pin list: no database
    # credential, and the same identity stage 60 already uses. No key yet = first install: the portal has never run a
    # mirror. A key and no answer stops here.
    - name: Is there an admin key
      ansible.builtin.stat: {path: "{{ key_file }}"}
      delegate_to: localhost
      become: false
      register: pc_sbx_key
    - name: Read the portal's sandbox image pins
      when: pc_sbx_key.stat.exists
      block:
        - name: Find the portal's API
          ansible.builtin.command: k3s kubectl -n {{ pc.namespace }} get svc proxcloud-api -o jsonpath={.spec.clusterIP}
          changed_when: false
          register: pc_sbx_api_ip
        - name: Read the pins
          proxcloud_api:
            access_key: "{{ (lookup('ansible.builtin.file', key_file) | from_json).id }}"
            secret_key: "{{ (lookup('ansible.builtin.file', key_file) | from_json).secretKey }}"
            url: "http://{{ pc_sbx_api_ip.stdout }}:8080/api/v1/admin/template-updates/sandbox/pins?registry={{ host | urlencode }}"
          register: pc_sbx_portal_pins
          # an API that is starting answers in a while; an answer that refuses (401/403/404) will not change
          retries: 10
          delay: 10
          until: pc_sbx_portal_pins is succeeded or (pc_sbx_portal_pins.status | default(0)) in [400, 401, 403, 404]
      rescue:
        - name: Stop instead of rolling a portal pin back
          when: not (pc_sandbox_portal_pins_unavailable_ok | default(false) | bool)
          ansible.builtin.fail:
            msg: >-
              The portal's sandbox image pins could not be read (GET /api/v1/admin/template-updates/sandbox/pins with
              {{ key_file }}: {{ (pc_sbx_portal_pins | default({})).msg | default((pc_sbx_api_ip | default({})).stderr | default('no answer')) }}).
              Rendering deploy/templates/images.yaml alone could roll back an image the portal mirrored, so the upgrade
              stops here. Bring the portal's API back and run make upgrade again. Only if you know no sandbox image was
              mirrored from the portal (Template updates), run it with -e pc_sandbox_portal_pins_unavailable_ok=true.
        - name: Say that the pins were skipped on request
          ansible.builtin.debug:
            msg: the portal's sandbox image pins were NOT read (pc_sandbox_portal_pins_unavailable_ok); images.yaml is rendered as is
    - name: Merge the pins with images.yaml
      ansible.builtin.set_fact:
        pc_sbx_pins_merged: >-
          {{ pc_sandbox_pins | pc_sandbox_portal_pins((pc_sbx_portal_pins.json.data.pins | default([]))
             if pc_sbx_portal_pins is defined and pc_sbx_portal_pins is succeeded and pc_sbx_portal_pins.json is defined else [], host) }}
    - name: Say which portal pins win over images.yaml
      when: pc_sbx_pins_merged.notes | length > 0
      ansible.builtin.debug:
        msg: "{{ pc_sbx_pins_merged.notes + (['Commit these lines to deploy/templates/images.yaml:'] + pc_sbx_pins_merged.commit
                 if pc_sbx_pins_merged.commit else []) }}"
    - name: Check the build bucket's endpoint
      ansible.builtin.assert:
        that: pc_sbx_build_s3_host is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
        fail_msg: >-
          the object store endpoint {{ pc_sbx_reg_s3.endpoint }} must be an IPv4 address: build pods fetch their
          contexts from it, and the workers' fence and the build namespace's policy open exactly that address
        quiet: true
    # Plain buckets (no Object Lock): Zot's garbage collection deletes blobs nothing references any more, and a deleted
    # template's contexts are deleted with it.
    - name: Create the buckets and their users
      ansible.builtin.script: files/rustfs-bootstrap.py
      environment:
        S3_URL: "{{ pc_sbx_reg_s3.endpoint }}"
        REGION: "{{ pc_sbx_reg_s3.region }}"
        FLAVOR: "{{ {'vm': 'rustfs', 'truenas-app': 'rustfs', 'ceph-rgw': 'rgw', 'external': 'external'}[pc.object_store.mode] }}"
        ROOT_ACCESS: "{{ pc_rustfs_access_key if own_store else pc.object_store.access_key }}"
        ROOT_SECRET: "{{ pc_rustfs_secret_key if own_store else pc.object_store.secret_key }}"
        BUCKETS: >-
          {{ {pc.sandbox.registry.bucket: {'secret': bucket_secret, 'lock': false},
              pc.sandbox.registry.builds_bucket: {'secret': builds_secret, 'lock': false}} | to_json }}
      args: {executable: python3}
      register: pc_sbx_bucket
      changed_when: (pc_sbx_bucket.stdout | from_json).changed
      no_log: true
    - name: Copy the cluster manifests
      ansible.builtin.copy:
        src: "{{ pc_repo_root }}/deploy/sandbox-cluster/"
        dest: /root/sandbox-bundle/
        mode: preserve
    - name: Apply the account sync's identity and the CA trust on the sandbox cluster
      ansible.builtin.command: kubectl apply -f /root/sandbox-bundle/registry.yaml
      environment: {KUBECONFIG: "{{ pc_sbx_kubeconfig }}"}
      register: pc_sbx_reg_rbac
      changed_when: pc_sbx_reg_rbac.stdout_lines | reject('search', ' unchanged$') | list | length > 0
    - name: Build the account sync's kubeconfig
      ansible.builtin.shell: |
        set -euo pipefail
        for i in $(seq 30); do
          t=$(kubectl -n sandbox-system get secret sandbox-registry-users-token -o jsonpath='{.data.token}' | base64 -d)
          [ -n "$t" ] && break; sleep 2
        done
        [ -n "$t" ]
        kubectl config view --raw --minify -o json | T="$t" python3 -c '
        import json, os, sys
        c = json.load(sys.stdin)["clusters"][0]
        print(json.dumps({"apiVersion": "v1", "kind": "Config", "current-context": "sync",
          "clusters": [{"name": "sandbox", "cluster": c["cluster"]}],
          "users": [{"name": "sync", "user": {"token": os.environ["T"]}}],
          "contexts": [{"name": "sync", "context": {"cluster": "sandbox", "user": "sync"}}]}))'
      args: {executable: /bin/bash}
      environment: {KUBECONFIG: "{{ pc_sbx_kubeconfig }}"}
      register: pc_sbx_reg_kc
      changed_when: false
      no_log: true
    - name: Apply the registry on the services cluster
      vars:
        pc_sbx_reg_kubeconfig: "{{ pc_sbx_reg_kc.stdout }}"
      ansible.builtin.command:
        cmd: "{{ kc }} apply -f -"
        stdin: "{{ lookup('ansible.builtin.template', 'templates/sandbox-registry.yml.j2') }}"
      register: pc_sbx_reg_applied
      # a Secret written from stringData reads "configured" on every apply
      changed_when: pc_sbx_reg_applied.stdout_lines | reject('search', ' unchanged$') | reject('search', '^secret/') | list | length > 0
      no_log: true
    - name: Wait for its certificate
      ansible.builtin.command: "{{ kc }} -n {{ pc_sbx_reg_ns }} wait certificate/sandbox-registry --for=condition=Ready --timeout=10m"
      changed_when: false
    - name: Wait for the registry
      ansible.builtin.command: "{{ kc }} -n {{ pc_sbx_reg_ns }} rollout status deploy/sandbox-registry --timeout=10m"
      changed_when: false
    - name: Read the CA
      ansible.builtin.command: "{{ kc }} -n {{ pc_sbx_reg_ns }} get secret sandbox-registry-ca -o 'jsonpath={.data.ca\\.crt}'"
      register: pc_sbx_reg_ca_b64
      failed_when: pc_sbx_reg_ca_b64.rc != 0 or pc_sbx_reg_ca_b64.stdout == ''
      changed_when: false
    - name: Make a directory for it
      ansible.builtin.file: {path: "{{ ca_dir }}", state: directory, mode: "0755"}
    - name: Trust the CA here for the copies
      ansible.builtin.copy:
        dest: "{{ ca_dir }}/ca.crt"
        content: "{{ pc_sbx_reg_ca_b64.stdout | b64decode }}"
        mode: "0644"
    - name: Wait for the registry's address
      ansible.builtin.uri: {url: "https://{{ host }}/v2/", ca_path: "{{ ca_dir }}/ca.crt", status_code: [401]}
      register: pc_sbx_reg_up
      retries: 30
      delay: 5
      until: pc_sbx_reg_up is succeeded
    # skopeo comes with stage 35 on images.build sites; the others get it here.
    - name: Install skopeo
      ansible.builtin.apt: {name: skopeo, update_cache: true, cache_valid_time: 86400}
    # Same digest, so a pinned reference means the same image on both sides (--preserve-digests refuses otherwise).
    - name: Copy the pinned images in
      ansible.builtin.shell: |
        set -euo pipefail
        if skopeo inspect --raw --cert-dir "$CERTS" --creds "admin:$ADMIN" "docker://$TARGET" >/dev/null 2>&1; then echo present; exit 0; fi
        skopeo copy --all --preserve-digests --retry-times 3 --dest-cert-dir "$CERTS" --dest-creds "admin:$ADMIN" \
          ${SRC_CREDS:+--src-creds "$SRC_CREDS"} "docker://$SOURCE" "docker://$TAGGED"
        skopeo inspect --raw --cert-dir "$CERTS" --creds "admin:$ADMIN" "docker://$TARGET" >/dev/null
        echo copied
      args: {executable: /bin/bash}
      environment:
        SOURCE: "{{ item.source_ref }}"
        TARGET: "{{ item.target_ref }}"
        TAGGED: "{{ item.target_tagged }}"
        CERTS: "{{ ca_dir }}"
        ADMIN: "{{ pc_sbx_reg_users.admin }}"
        SRC_CREDS: "{{ (pc.images.pull_secret.username ~ ':' ~ pc.images.pull_secret.password) if pc.images.pull_secret.username | default('') else '' }}"
      loop: "{{ images }}"
      loop_control: {label: "{{ item.name }}"}
      register: pc_sbx_copied
      changed_when: "'copied' in pc_sbx_copied.stdout"
    # sandbox-proxy follows the release tag; the copy is recorded by digest, so the nodes run exactly what was copied.
    - name: Copy the release's sandbox-proxy in
      ansible.builtin.shell: |
        set -euo pipefail
        dst="$HOST/library/proxcloud-sandbox-proxy:${SOURCE##*:}"
        skopeo copy --all --retry-times 3 --dest-cert-dir "$CERTS" --dest-creds "admin:$ADMIN" \
          ${SRC_CREDS:+--src-creds "$SRC_CREDS"} "docker://$SOURCE" "docker://$dst" >&2
        echo "$dst@$(skopeo inspect --raw --cert-dir "$CERTS" --creds "admin:$ADMIN" "docker://$dst" | sha256sum | cut -d' ' -f1 | sed 's/^/sha256:/')"
      args: {executable: /bin/bash}
      environment:
        SOURCE: "{{ pc_sbx_proxy_source }}"
        HOST: "{{ host }}"
        CERTS: "{{ ca_dir }}"
        ADMIN: "{{ pc_sbx_reg_users.admin }}"
        SRC_CREDS: "{{ (pc.images.pull_secret.username ~ ':' ~ pc.images.pull_secret.password) if pc.images.pull_secret.username | default('') else '' }}"
      when: pc_sandbox_edge_on
      register: pc_sbx_proxy_copy
      changed_when: false
    # Template builds (docs/managed-sandbox.md §7): the namespace, its fence, the portal's and the sync's rights there,
    # and the registry's CA for crane.
    - name: Apply the build namespace on the sandbox cluster
      vars:
        pc_sbx_reg_ca: "{{ pc_sbx_reg_ca_b64.stdout | b64decode }}"
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: "{{ lookup('ansible.builtin.template', 'templates/sandbox-builds.yml.j2') }}"
      environment: {KUBECONFIG: "{{ pc_sbx_kubeconfig }}"}
      register: pc_sbx_builds_ns
      changed_when: pc_sbx_builds_ns.stdout_lines | reject('search', ' unchanged$') | list | length > 0
    - name: Apply the prepull and the registry's address on the sandbox cluster
      vars:
        pc_sbx_images: "{{ images }}"
        pc_sbx_reg_ca: "{{ pc_sbx_reg_ca_b64.stdout | b64decode }}"
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: "{{ lookup('ansible.builtin.template', 'templates/sandbox-prepull.yml.j2') }}"
      environment: {KUBECONFIG: "{{ pc_sbx_kubeconfig }}"}
      register: pc_sbx_prepull
      changed_when: pc_sbx_prepull.stdout_lines | reject('search', ' unchanged$') | list | length > 0
    - name: Record the registry for stages 56 and 60
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        dest: "{{ pc_gen }}/sandbox-registry.json"
        mode: "0600"
        content: >-
          {{ {'host': host, 'templateRegistry': host ~ '/t', 'ca': pc_sbx_reg_ca_b64.stdout | b64decode,
              'buildStorage': {'endpoint': pc_sbx_reg_s3.endpoint, 'region': pc_sbx_reg_s3.region,
                               'bucket': pc.sandbox.registry.builds_bucket,
                               'address': pc_sbx_build_s3_host, 'port': pc_sbx_build_s3_port | int},
              'proxyImage': (pc_sbx_proxy_copy.stdout | default('')) if pc_sandbox_edge_on else ''} | to_nice_json }}
    # The workers reach the registry once stage 60 gave the Proxmox provider its address (config.sandbox.registry)
    # and the sync fenced them with it: on a first install the prepull waits for that, and a re-run checks it.
    - name: Count the prepull pods that pulled everything
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl -n sandbox-system get pods -l app=template-prepull -o json | python3 -c '
        import json, sys
        p = json.load(sys.stdin)["items"]
        print("%d/%d" % (sum(1 for x in p if x["status"].get("phase") == "Running"), len(p)))'
      args: {executable: /bin/bash}
      environment: {KUBECONFIG: "{{ pc_sbx_kubeconfig }}"}
      register: pc_sbx_prepulled
      changed_when: false
    - name: Say how far the prepull is
      ansible.builtin.debug:
        msg: "template prepull running on {{ pc_sbx_prepulled.stdout }} nodes (the rest pull once the sync fenced them with the registry rule, after stage 60)"
