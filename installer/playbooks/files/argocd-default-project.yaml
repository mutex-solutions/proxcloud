# ArgoCD's built-in `default` project on the services cluster, locked: no source, no destination, no cluster-scoped
# kind. ArgoCD creates it open (every repo, every cluster and namespace, every kind) only when it is missing, so this
# apply (services-platform.sh, guardrails) wins and a re-run of stage 50 puts it back. Neither the installer nor the
# console picks it here: tenant clusters and pc-sandbox are in proxcloud-k8s, databases in proxcloud-dbaas
# (installer/tests/test_services_argocd.py, web/admin/e2e/provider-connection.spec.ts); a provider can still name it
# (typed in, or through the API). An Application left in `default` stops syncing; move it to a named project.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  description: Locked by the ProxCloud installer. Use a named project.
  sourceRepos: []
  destinations: []
  clusterResourceWhitelist: []
