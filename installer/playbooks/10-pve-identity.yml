# Stage 10: roles, users, tokens, ACLs and pools from docs/proxmox-permissions.md. GET, then write only
# the difference. A token secret is shown once, on creation: it goes to generated/ and is never rotated
# here. When a token exists but its secret is unknown, the vault must supply it.
- name: Set up the Proxmox identity
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    ansible.builtin.uri: {validate_certs: false, headers: "{{ pc_pve_headers | default({}) }}", return_content: true, timeout: 60}
  vars:
    vm_config: "VM.Config.CDROM VM.Config.CPU VM.Config.Cloudinit VM.Config.Disk VM.Config.HWType VM.Config.Memory VM.Config.Network VM.Config.Options"
    roles:
      ProxCloudPlatform: "Sys.Audit Sys.Console Sys.Modify Pool.Allocate Pool.Audit VM.Allocate VM.Audit VM.Backup VM.Clone {{ vm_config }} VM.Console VM.GuestAgent.Audit VM.GuestAgent.Unrestricted VM.Migrate VM.PowerMgmt VM.Replicate VM.Snapshot VM.Snapshot.Rollback SDN.Allocate SDN.Audit SDN.Use Datastore.AllocateSpace Datastore.AllocateTemplate Datastore.Audit Mapping.Audit Mapping.Use"
      ProxCloudCAPI: "Sys.Audit Pool.Audit VM.Allocate VM.Audit VM.Clone {{ vm_config }} VM.GuestAgent.Audit VM.Migrate VM.PowerMgmt Datastore.AllocateSpace Datastore.Audit SDN.Use"
      ProxCloudCSI: "VM.Audit VM.Config.Disk Datastore.Allocate Datastore.AllocateSpace Datastore.Audit"
      ProxCloudSandboxGuard: "Pool.Audit VM.Audit VM.Config.Network"
      ProxCloudImages: "Sys.Audit Sys.AccessNetwork Pool.Allocate Pool.Audit VM.Allocate VM.Audit VM.Clone {{ vm_config }} VM.Console VM.GuestAgent.Audit VM.PowerMgmt Datastore.Allocate Datastore.AllocateSpace Datastore.AllocateTemplate Datastore.Audit SDN.Use"
    users:
      proxcloud@pve: {comment: ProxCloud portal, token: platform}
      capmox@pve: {comment: ProxCloud CAPI, token: capi}
      csi@pve: {comment: ProxCloud CSI, token: csi}
      images@pve: {comment: ProxCloud image pipeline, token: packer}
    pools:
      pc-templates: ProxCloud templates
      "{{ pc.pve.system_pool }}": ProxCloud management (not tenant)
    acls:
      # platform
      - {path: /, role: ProxCloudPlatform, propagate: 0, user: proxcloud@pve, token: proxcloud@pve!platform}
      - {path: /nodes, role: PVEAuditor, propagate: 1, user: proxcloud@pve, token: proxcloud@pve!platform}
      - {path: /pool, role: ProxCloudPlatform, propagate: 1, user: proxcloud@pve, token: proxcloud@pve!platform}
      - {path: "/pool/{{ pc.pve.system_pool }}", role: NoAccess, propagate: 1, user: proxcloud@pve, token: proxcloud@pve!platform}
      - {path: /sdn, role: ProxCloudPlatform, propagate: 1, user: proxcloud@pve, token: proxcloud@pve!platform}
      - {path: /storage, role: ProxCloudPlatform, propagate: 1, user: proxcloud@pve, token: proxcloud@pve!platform}
      - {path: /mapping/pci, role: ProxCloudPlatform, propagate: 1, user: proxcloud@pve, token: proxcloud@pve!platform}
      # image pipeline: builds in the template pool only
      - {path: /pool/pc-templates, role: ProxCloudImages, propagate: 1, user: images@pve, token: images@pve!packer}
      - {path: /nodes, role: ProxCloudImages, propagate: 1, user: images@pve, token: images@pve!packer}
      - {path: /storage, role: ProxCloudImages, propagate: 1, user: images@pve, token: images@pve!packer}
      - {path: /sdn/zones/localnetwork, role: ProxCloudImages, propagate: 1, user: images@pve, token: images@pve!packer}
    # Image import deletes what it downloaded, and deleting a file takes Datastore.Allocate. Only on this store.
    nas_acls: "{{ [{'path': '/storage/' ~ pc.nas.names.templates, 'role': 'PVEDatastoreAdmin', 'propagate': 0, 'user': 'proxcloud@pve', 'token': 'proxcloud@pve!platform'}] if pc.nas.host | length > 0 and 'templates' in pc.nas.exports else [] }}"
    # That ACL shadows /storage for the token, so mode=split repeats the mint role there: clusters made before bootstrap
    # ISOs moved to node-local storage hold an ACL on this store, and taking it back takes Permissions.Modify on the path.
    nas_mint_acls: "{{ [{'path': '/storage/' ~ pc.nas.names.templates, 'role': 'ProxCloudKubeMint', 'propagate': 0, 'user': 'proxcloud@pve', 'token': 'proxcloud@pve!platform'}] if nas_acls | length > 0 else [] }}"
    # mode=split: what the services cluster and the per-cluster tokens of tenant clusters hang off.
    # Unexercised on a lab so far: see "Managed Kubernetes" in docs/proxmox-permissions.md.
    split_roles:
      ProxCloudKubeMint: "User.Modify Permissions.Modify"
    split_acls:
      - {path: /, role: ProxCloudCAPI, propagate: 0, user: capmox@pve, token: capmox@pve!capi}
      - {path: /nodes, role: ProxCloudCAPI, propagate: 1, user: capmox@pve, token: capmox@pve!capi}
      - {path: /pool, role: ProxCloudCAPI, propagate: 1, user: capmox@pve, token: capmox@pve!capi}
      - {path: /pool/pc-templates, role: PVETemplateUser, propagate: 1, user: capmox@pve, token: capmox@pve!capi}
      - {path: /sdn/zones, role: ProxCloudCAPI, propagate: 1, user: capmox@pve, token: capmox@pve!capi}
      # CAPMOX puts a bootstrap ISO (kubeadm join token) on the first iso store its token sees, in no fixed order: the
      # services token sees its boot store and the node-local ISO store only. The user keeps /storage for the boot
      # stores of tenant clusters' tokens, which the portal grants one by one.
      - {path: /storage, role: ProxCloudCAPI, propagate: 1, user: capmox@pve, token: ""}
      - {path: "/storage/{{ pc.services.storage }}", role: ProxCloudCAPI, propagate: 0, user: "", token: capmox@pve!capi}
      - {path: "/storage/{{ pc.services.iso_storage }}", role: PVEDatastoreAdmin, propagate: 0, user: capmox@pve, token: capmox@pve!capi}
      - {path: /pool, role: ProxCloudCSI, propagate: 1, user: csi@pve, token: csi@pve!csi}
      - {path: /storage, role: ProxCloudCSI, propagate: 1, user: csi@pve, token: csi@pve!csi}
      # The CSI gateway (portal API) calls PVE for every tenant cluster's proxmox-csi with this one token and checks
      # ownership itself; the same role and paths as the services cluster's own CSI token.
      - {path: /pool, role: ProxCloudCSI, propagate: 1, user: csi@pve, token: csi@pve!gateway}
      - {path: /storage, role: ProxCloudCSI, propagate: 1, user: csi@pve, token: csi@pve!gateway}
      - {path: /access/groups, role: ProxCloudKubeMint, propagate: 1, user: proxcloud@pve, token: proxcloud@pve!platform}
      - {path: /pool, role: ProxCloudKubeMint, propagate: 1, user: proxcloud@pve, token: proxcloud@pve!platform}
      - {path: /storage, role: ProxCloudKubeMint, propagate: 1, user: proxcloud@pve, token: proxcloud@pve!platform}
      - {path: /sdn/zones, role: ProxCloudKubeMint, propagate: 1, user: proxcloud@pve, token: proxcloud@pve!platform}
      # An ACL on a path replaces what its parent passes down, so the mint grant alone takes SDN.* away from /sdn/zones.
      - {path: /sdn/zones, role: ProxCloudPlatform, propagate: 1, user: proxcloud@pve, token: proxcloud@pve!platform}
      - {path: /nodes, role: ProxCloudKubeMint, propagate: 0, user: proxcloud@pve, token: proxcloud@pve!platform}
    # sandbox.enabled: the sandbox cluster's CAPMOX token, with the grants the portal gives a tenant cluster's token
    # (MintClusterTokens, internal/cloud/pve/access.go). Token rows only for it: capmox@pve already holds these paths
    # through split_acls, and a user row on a child path would replace what the user inherits there. The last two rows
    # narrow the portal and the CSI tokens on the sandbox pool, which is why they carry user rows.
    sandbox_acls:
      - {path: "/pool/{{ pc.sandbox.pool }}", role: ProxCloudCAPI, propagate: 1, user: "", token: "{{ pc_sandbox_token_id }}"}
      - {path: "/storage/{{ pc_sandbox_storage }}", role: ProxCloudCAPI, propagate: 1, user: "", token: "{{ pc_sandbox_token_id }}"}
      - {path: /pool/pc-templates, role: PVETemplateUser, propagate: 1, user: "", token: "{{ pc_sandbox_token_id }}"}
      - {path: /nodes, role: ProxCloudCAPI, propagate: 1, user: "", token: "{{ pc_sandbox_token_id }}"}
      - {path: /sdn/zones/localnetwork, role: ProxCloudCAPI, propagate: 1, user: "", token: "{{ pc_sandbox_token_id }}"}
      - {path: "/storage/{{ pc_sandbox_iso_storage }}", role: PVEDatastoreAdmin, propagate: 1, user: "", token: "{{ pc_sandbox_token_id }}"}
      - {path: "/sdn/zones/{{ pc_sandbox_zone }}/{{ pc.sandbox.network.vnet }}", role: ProxCloudCAPI, propagate: 1, user: "", token: "{{ pc_sandbox_token_id }}"}
      # The portal's sync only reads the workers and sets their firewall there (docs/managed-sandbox.md §2). This row
      # replaces, on the sandbox pool alone, what the portal inherits from /pool (ProxCloudPlatform, ProxCloudKubeMint):
      # no guest agent, console, disk, power or ACL rights on a VM that runs tenant code.
      - {path: "/pool/{{ pc.sandbox.pool }}", role: ProxCloudSandboxGuard, propagate: 1, user: proxcloud@pve, token: proxcloud@pve!platform}
      # The CSI tokens hold ProxCloudCSI on /pool for tenant clusters; nothing of theirs is in the sandbox pool.
      - {path: "/pool/{{ pc.sandbox.pool }}", role: NoAccess, propagate: 1, user: csi@pve, token: ""}
    # On its own ISO store the user holds only ProxCloudCAPI (from /storage), which lacks Datastore.AllocateTemplate,
    # so the token could not upload the bootstrap ISO. The capi token has no row there, so it still sees one ISO store.
    sandbox_iso_user_acls: "{{ [{'path': '/storage/' ~ pc_sandbox_iso_storage, 'role': 'PVEDatastoreAdmin', 'propagate': 0, 'user': 'capmox@pve', 'token': ''}] if pc_sandbox_iso_storage != pc.services.iso_storage else [] }}"
  tasks:
    - name: Log in
      ansible.builtin.include_tasks: tasks/pve-login.yml

    - name: Read what exists
      check_mode: false
      ansible.builtin.uri: {url: "{{ pc_api }}/{{ item }}"}
      loop: [access/roles, access/users?full=1, pools, access/acl]
      register: pc_id

    - name: Index what exists
      ansible.builtin.set_fact:
        have_roles: "{{ pc_id.results[0].json.data | items2dict(key_name='roleid', value_name='privs') }}"
        have_users: "{{ pc_id.results[1].json.data | items2dict(key_name='userid', value_name='tokens') }}"
        have_pools: "{{ pc_id.results[2].json.data | map(attribute='poolid') | list }}"

    - name: Create a role
      when: item.key not in have_roles
      ansible.builtin.uri:
        url: "{{ pc_api }}/access/roles"
        method: POST
        body_format: form-urlencoded
        body: {roleid: "{{ item.key }}", privs: "{{ item.value | split | join(',') }}"}
      changed_when: true
      loop: "{{ (roles | combine(split_roles if pc.mode == 'split' else {})) | dict2items }}"
      loop_control: {label: "{{ item.key }}"}

    - name: Align a role's privileges
      when:
        - item.key in have_roles
        - (have_roles[item.key] | split(',') | sort) != (item.value | split | sort)
      ansible.builtin.uri:
        url: "{{ pc_api }}/access/roles/{{ item.key }}"
        method: PUT
        body_format: form-urlencoded
        body: {privs: "{{ item.value | split | join(',') }}"}
      changed_when: true
      loop: "{{ (roles | combine(split_roles if pc.mode == 'split' else {})) | dict2items }}"
      loop_control: {label: "{{ item.key }}"}

    - name: Create a pool
      when: item.key not in have_pools
      ansible.builtin.uri:
        url: "{{ pc_api }}/pools"
        method: POST
        body_format: form-urlencoded
        body: {poolid: "{{ item.key }}", comment: "{{ item.value }}"}
      changed_when: true
      loop: "{{ (pools | combine({pc.sandbox.pool: 'ProxCloud sandbox cluster (not tenant)'} if pc_sandbox_on else {})) | dict2items }}"
      loop_control: {label: "{{ item.key }}"}

    - name: Create a user
      when: item.key not in have_users
      ansible.builtin.uri:
        url: "{{ pc_api }}/access/users"
        method: POST
        body_format: form-urlencoded
        body: {userid: "{{ item.key }}", comment: "{{ item.value.comment }}"}
      changed_when: true
      loop: "{{ users | dict2items }}"
      loop_control: {label: "{{ item.key }}"}

    - name: Create a token
      when: item.value.token not in (have_users[item.key] | default([], true) | map(attribute='tokenid') | list)
      ansible.builtin.uri:
        url: "{{ pc_api }}/access/users/{{ item.key }}/token/{{ item.value.token }}"
        method: POST
        body_format: form-urlencoded
        body: {privsep: 1, comment: ProxCloud installer}
      changed_when: true
      no_log: true
      register: pc_new_tokens
      loop: "{{ users | dict2items }}"
      loop_control: {label: "{{ item.key }}"}

    - name: Keep the new token secrets
      when: item.json is defined
      ansible.builtin.copy:
        dest: "{{ pc_gen }}/token-{{ item.item.value.token }}"
        content: "{{ item.json.data.value }}\n"
        mode: "0600"
      no_log: true
      loop: "{{ pc_new_tokens.results }}"

    - name: Create the CSI gateway token
      when:
        - pc.mode == 'split'
        - "'gateway' not in (have_users['csi@pve'] | default([], true) | map(attribute='tokenid') | list)"
      ansible.builtin.uri:
        url: "{{ pc_api }}/access/users/csi@pve/token/gateway"
        method: POST
        body_format: form-urlencoded
        body: {privsep: 1, comment: ProxCloud CSI gateway}
      changed_when: true
      no_log: true
      register: pc_gateway_token

    - name: Keep the CSI gateway token secret
      when: pc_gateway_token.json is defined
      ansible.builtin.copy:
        dest: "{{ pc_gen }}/token-gateway"
        content: "{{ pc_gateway_token.json.data.value }}\n"
        mode: "0600"
      no_log: true

    - name: Create the sandbox cluster token
      when:
        - pc_sandbox_on
        - pc.sandbox.token not in (have_users['capmox@pve'] | default([], true) | map(attribute='tokenid') | list)
      ansible.builtin.uri:
        url: "{{ pc_api }}/access/users/capmox@pve/token/{{ pc.sandbox.token }}"
        method: POST
        body_format: form-urlencoded
        body: {privsep: 1, comment: ProxCloud sandbox cluster}
      changed_when: true
      no_log: true
      register: pc_sandbox_token

    - name: Keep the sandbox cluster token secret
      when: pc_sandbox_token.json is defined
      ansible.builtin.copy:
        dest: "{{ pc_gen }}/token-{{ pc.sandbox.token }}"
        content: "{{ pc_sandbox_token.json.data.value }}\n"
        mode: "0600"
      no_log: true

    - name: Copy token secrets given in the vault
      when: pc_vault[item.key] is defined
      ansible.builtin.copy:
        dest: "{{ pc_gen }}/token-{{ item.value }}"
        content: "{{ pc_vault[item.key] }}\n"
        mode: "0600"
      no_log: true
      loop: "{{ {'platform_token_secret': 'platform', 'images_token_secret': 'packer', 'capi_token_secret': 'capi', 'csi_token_secret': 'csi', 'csi_gateway_token_secret': 'gateway', 'sandbox_token_secret': pc.sandbox.token} | dict2items }}"

    - name: Check the tokens the installer needs are known
      ansible.builtin.stat: {path: "{{ pc_gen }}/token-{{ item }}"}
      register: pc_tokens
      failed_when: not pc_tokens.stat.exists
      loop: "{{ ['platform', 'packer'] + (['capi', 'csi', 'gateway'] if pc.mode == 'split' else []) + ([pc.sandbox.token] if pc_sandbox_on else []) }}"

    - name: Grant the missing ACLs
      ansible.builtin.uri:
        url: "{{ pc_api }}/access/acl"
        method: PUT
        body_format: form-urlencoded
        body: "{{ item }}"
      changed_when: true
      loop: "{{ pc_id.results[3].json.data | pc_acl_missing(acls + nas_acls + (split_acls + nas_mint_acls if pc.mode == 'split' else []) + (sandbox_acls + sandbox_iso_user_acls if pc_sandbox_on else [])) }}"
      loop_control: {label: "{{ item.path }} {{ item.roles }}"}

    # Older installs gave the services token /storage (propagate) and the ISO role on the NAS template store, so it
    # saw every iso store. Taken off after the grants above, so the token never lacks its boot or ISO store.
    - name: Narrow the services cluster token to its own stores
      when:
        - pc.mode == 'split'
        - (item.path == '/storage' and item.roleid == 'ProxCloudCAPI') or
          (item.path == '/storage/' ~ pc.nas.names.templates and item.roleid == 'PVEDatastoreAdmin' and pc.nas.names.templates != pc.services.iso_storage)
      ansible.builtin.uri:
        url: "{{ pc_api }}/access/acl"
        method: PUT
        body_format: form-urlencoded
        body: {path: "{{ item.path }}", roles: "{{ item.roleid }}", tokens: capmox@pve!capi, delete: 1}
      changed_when: true
      loop: "{{ pc_id.results[3].json.data | selectattr('type', 'eq', 'token') | selectattr('ugid', 'eq', 'capmox@pve!capi') | list }}"
      loop_control: {label: "{{ item.path }} {{ item.roleid }}"}

    # CAPMOX puts each join token on the first iso store the services token sees, in no fixed order, so it must see
    # the bootstrap store alone. Asked of PVE (user ∩ token, inheritance, groups), not worked out from the rows above.
    - name: Read what the services cluster token may do on each ISO store
      when: pc.mode == 'split'
      check_mode: false
      ansible.builtin.uri:
        url: "{{ pc_api }}/access/permissions?{{ {'userid': pc.services.capi_token_id, 'path': '/storage/' ~ item} | urlencode }}"
      loop: "{{ pc_storage_rows | pc_iso_stores }}"
      register: pc_capi_iso

    - name: Check the services cluster token sees one ISO store, the bootstrap one
      when: pc.mode == 'split'
      vars:
        seen: "{{ pc_capi_iso.results | pc_visible_stores }}"
      ansible.builtin.assert:
        that: seen == [pc.services.iso_storage] or ansible_check_mode
        fail_msg: >-
          {{ pc.services.capi_token_id }} sees the ISO stores {{ seen }}; CAPMOX would put the services cluster's join tokens
          on any of them. It must see {{ pc.services.iso_storage }} alone: look for other ACLs on those stores for the
          token or capmox@pve (docs/proxmox-permissions.md).
        success_msg: "{{ pc.services.capi_token_id }} sees the ISO stores {{ seen }}{{ ' (before the changes above: --check writes nothing)' if ansible_check_mode else '' }}"

    # The same for the sandbox cluster's token: its join tokens must land on the node-local store only.
    - name: Read what the sandbox cluster token may do on each ISO store
      when: pc_sandbox_on
      check_mode: false
      ansible.builtin.uri:
        url: "{{ pc_api }}/access/permissions?{{ {'userid': pc_sandbox_token_id, 'path': '/storage/' ~ item} | urlencode }}"
      loop: "{{ pc_storage_rows | pc_iso_stores }}"
      register: pc_sandbox_iso

    - name: Check the sandbox cluster token sees one ISO store, the bootstrap one
      when: pc_sandbox_on
      vars:
        seen: "{{ pc_sandbox_iso.results | pc_visible_stores }}"
      ansible.builtin.assert:
        that: seen == [pc_sandbox_iso_storage] or ansible_check_mode
        fail_msg: "{{ pc_sandbox_token_id }} sees the ISO stores {{ seen }}; it must see {{ pc_sandbox_iso_storage }} alone (docs/proxmox-permissions.md)."
        success_msg: "{{ pc_sandbox_token_id }} sees the ISO stores {{ seen }}"

    # What the portal may do to a sandbox worker, as PVE computes it: an extra row on /pool/<pool> (a group, a role
    # added by hand) would hand back guest agent, console or disk rights on VMs that run tenant code.
    - name: Read what the portal token may do on the sandbox pool
      when: pc_sandbox_on
      check_mode: false
      ansible.builtin.uri:
        url: "{{ pc_api }}/access/permissions?{{ {'userid': 'proxcloud@pve!platform', 'path': '/pool/' ~ pc.sandbox.pool} | urlencode }}"
      register: pc_sandbox_guard
    - name: Check the portal token holds the guard role alone there
      when: pc_sandbox_on
      vars:
        privs: "{{ (pc_sandbox_guard.json.data.values() | first | default({})).keys() | sort }}"
      ansible.builtin.assert:
        that: privs == (roles.ProxCloudSandboxGuard | split | sort) or ansible_check_mode
        fail_msg: "proxcloud@pve!platform holds {{ privs }} on /pool/{{ pc.sandbox.pool }}; it must hold ProxCloudSandboxGuard alone (docs/proxmox-permissions.md)."
        success_msg: "proxcloud@pve!platform on /pool/{{ pc.sandbox.pool }}: {{ privs }}"
