# Encrypt with `ansible-vault encrypt`, then pass ARGS=--ask-vault-pass.
proxcloud_vault:
  # A root-equivalent Proxmox credential for the install: a token (preferred) or user + password.
  # The portal itself runs on the least-privilege token the installer creates.
  pve_token_id: root@pam!installer
  pve_token_secret: 00000000-0000-0000-0000-000000000000
  # pve_user: root@pam
  # pve_password: change-me
  #
  # Tokens that already exist on the cluster (their secret is shown once, on creation):
  # platform_token_secret: ...
  # images_token_secret: ...
  # capi_token_secret: ...   (mode=split)
  # csi_token_secret: ...    (mode=split)
  # truenas_api_key: ...     # object_store.mode=truenas-app
