# Copy this directory to inventory/<site> and edit it.
all:
  children:
    # The Linux host(s) that run the management k3s (mgmt.placement: ssh). Never a Proxmox node.
    # With placement: pve-vm leave this empty; the installer creates the VMs and fills the group.
    mgmt:
      hosts:
        mgmt1:
          ansible_host: 192.0.2.10
          ansible_user: debian
          # ansible_ssh_common_args: -o ProxyJump=root@bastion.example.com
    # Optional: root ssh to the Proxmox nodes. Only the fio benchmark and add-node need it.
    pve:
      hosts: {}
        # pve1: {ansible_host: 192.0.2.11, ansible_user: root}
