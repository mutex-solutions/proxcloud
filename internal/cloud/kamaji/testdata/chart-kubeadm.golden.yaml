# Source: proxmox-kamaji-cluster/templates/control-plane-kubeadm.yaml
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: pc-platform-cp
spec:
  replicas: 1
  version: "v1.35.10"
  machineTemplate:
    spec:
      infrastructureRef: {apiGroup: infrastructure.cluster.x-k8s.io, kind: ProxmoxMachineTemplate, name: pc-platform-cp-pve1-88f58870}
  kubeadmConfigSpec:
    clusterConfiguration:
      apiServer:
        certSANs: ["192.0.2.10","platform.example.com"]
        extraArgs:
          - {name: enable-admission-plugins, value: "NodeRestriction,PodNodeSelector,PodTolerationRestriction"}
    files:
      - path: /etc/kubernetes/manifests/kube-vip.yaml
        owner: root:root
        content: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: kube-vip
            namespace: kube-system
          spec:
            containers:
            - args: ["manager"]
              env:
              - {name: cp_enable, value: "true"}
              - {name: vip_interface, value: ""}
              - {name: address, value: "192.0.2.10"}
              - {name: port, value: "6443"}
              - {name: vip_arp, value: "true"}
              - {name: vip_leaderelection, value: "true"}
              - {name: vip_leaseduration, value: "15"}
              - {name: vip_renewdeadline, value: "10"}
              - {name: vip_retryperiod, value: "2"}
              image: ghcr.io/kube-vip/kube-vip:v0.8.9
              imagePullPolicy: IfNotPresent
              name: kube-vip
              securityContext:
                capabilities:
                  add: [NET_ADMIN, NET_RAW]
              volumeMounts:
              - {mountPath: /etc/kubernetes/admin.conf, name: kubeconfig}
            hostAliases:
            - {hostnames: [localhost, kubernetes], ip: 127.0.0.1}
            hostNetwork: true
            volumes:
            - name: kubeconfig
              hostPath: {path: /etc/kubernetes/admin.conf, type: FileOrCreate}
      - path: /etc/kube-vip-prepare.sh
        owner: root:root
        permissions: "0700"
        content: |
          #!/bin/bash
          set -e
          # kubeadm init has no admin.conf with rights yet: kube-vip uses super-admin.conf until then.
          if [[ -f /run/kubeadm/kubeadm.yaml ]]; then
            sed -i 's#path: /etc/kubernetes/admin.conf#path: /etc/kubernetes/super-admin.conf#' /etc/kubernetes/manifests/kube-vip.yaml
          fi
    preKubeadmCommands: [/etc/kube-vip-prepare.sh]
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs: [{"name":"provider-id","value":"proxmox://'{{ ds.meta_data.instance_id }}'"},{"name":"node-labels","value":"topology.kubernetes.io/region=az1,topology.kubernetes.io/zone=pve1"}]
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs: [{"name":"provider-id","value":"proxmox://'{{ ds.meta_data.instance_id }}'"},{"name":"node-labels","value":"topology.kubernetes.io/region=az1,topology.kubernetes.io/zone=pve1"}]
