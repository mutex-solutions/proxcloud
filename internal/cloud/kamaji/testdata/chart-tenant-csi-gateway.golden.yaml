# Source: proxmox-kamaji-cluster/templates/csi-controller.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pc-c-abcd1234-csi-controller
  labels:
    app.kubernetes.io/name: proxmox-csi-controller
    proxcloud.io/cluster-id: pc-c-abcd1234
spec:
  replicas: 1
  # One controller at a time: the sidecars elect a leader in the tenant anyway, Recreate just skips the overlap.
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: proxmox-csi-controller
      proxcloud.io/cluster-id: pc-c-abcd1234
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proxmox-csi-controller
        proxcloud.io/cluster-id: pc-c-abcd1234
    spec:
      # Nothing here talks to the services cluster's own API.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532}
      containers:
        - name: proxmox-csi-controller
          image: "ghcr.io/sergelogvinov/proxmox-csi-controller:v0.22.0"
          args: ["-v=4", "--csi-address=unix:///csi/csi.sock", "--cloud-config=/etc/proxmox/config.yaml", "--kubeconfig=/etc/tenant/kubeconfig"]
          securityContext: {"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]},"readOnlyRootFilesystem":true,"seccompProfile":{"type":"RuntimeDefault"}}
          resources: {requests: {cpu: 10m, memory: 32Mi}}
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
            - {name: cloud-config, mountPath: /etc/proxmox, readOnly: true}
            - {name: tenant, mountPath: /etc/tenant, readOnly: true}
        - name: csi-attacher
          image: "registry.k8s.io/sig-storage/csi-attacher:v4.13.0"
          args: ["-v=2", "--csi-address=unix:///csi/csi.sock", "--timeout=3m", "--default-fstype=ext4",
                 "--leader-election", "--leader-election-namespace=csi-proxmox", "--kubeconfig=/etc/tenant/kubeconfig"]
          securityContext: {"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]},"readOnlyRootFilesystem":true,"seccompProfile":{"type":"RuntimeDefault"}}
          resources: {requests: {cpu: 10m, memory: 32Mi}}
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
            - {name: tenant, mountPath: /etc/tenant, readOnly: true}
        - name: csi-provisioner
          image: "registry.k8s.io/sig-storage/csi-provisioner:v6.4.0"
          # The CSIDriver says storageCapacity, so the scheduler wants capacity objects: they go to the tenant's
          # csi-proxmox, owned by nothing there (this pod is not in the tenant).
          args: ["-v=2", "--csi-address=unix:///csi/csi.sock", "--timeout=3m", "--default-fstype=ext4",
                 "--enable-capacity", "--capacity-ownerref-level=-1",
                 "--leader-election", "--leader-election-namespace=csi-proxmox", "--kubeconfig=/etc/tenant/kubeconfig"]
          env:
            - {name: NAMESPACE, value: csi-proxmox}
          securityContext: {"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]},"readOnlyRootFilesystem":true,"seccompProfile":{"type":"RuntimeDefault"}}
          resources: {requests: {cpu: 10m, memory: 32Mi}}
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
            - {name: tenant, mountPath: /etc/tenant, readOnly: true}
        - name: csi-resizer
          image: "registry.k8s.io/sig-storage/csi-resizer:v2.3.0"
          args: ["-v=2", "--csi-address=unix:///csi/csi.sock", "--timeout=3m", "--handle-volume-inuse-error=false",
                 "--leader-election", "--leader-election-namespace=csi-proxmox", "--kubeconfig=/etc/tenant/kubeconfig"]
          securityContext: {"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]},"readOnlyRootFilesystem":true,"seccompProfile":{"type":"RuntimeDefault"}}
          resources: {requests: {cpu: 10m, memory: 32Mi}}
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
            - {name: tenant, mountPath: /etc/tenant, readOnly: true}
      volumes:
        - {name: socket-dir, emptyDir: {}}
        - name: cloud-config
          secret:
            secretName: pc-c-abcd1234-csi-gateway
            items: [{key: config.yaml, path: config.yaml}, {key: ca.crt, path: ca.crt}]
        - name: tenant
          secret:
            secretName: pc-c-abcd1234-kamaji-cp-admin-kubeconfig
            # The control plane's in-cluster address; admin.conf names the LoadBalancer, which the API allowlist guards.
            items: [{key: admin.svc, path: kubeconfig}]
