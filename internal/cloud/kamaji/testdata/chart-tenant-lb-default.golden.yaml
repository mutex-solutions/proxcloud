# Source: proxmox-kamaji-cluster/templates/lb-controller.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pc-c-abcd1234-lb-controller
  labels:
    app.kubernetes.io/name: proxcloud-lb-controller
    proxcloud.io/cluster-id: pc-c-abcd1234
spec:
  replicas: 1
  # One controller at a time: two would PUT the same state, Recreate skips the overlap.
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: proxcloud-lb-controller
      proxcloud.io/cluster-id: pc-c-abcd1234
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proxcloud-lb-controller
        proxcloud.io/cluster-id: pc-c-abcd1234
    spec:
      # Nothing here talks to the services cluster's own API.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532}
      containers:
        - name: lb-controller
          image: "ghcr.io/mutex-solutions/proxcloud-api:v0.11.0"
          command: ["/usr/local/bin/lb-controller"]
          args: ["--gateway-url=https://192.0.2.7:8444", "--default=true",
                 "--kubeconfig=/etc/tenant/kubeconfig", "--gateway-dir=/etc/lb-gateway", "--watch=true"]
          securityContext: {"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]},"readOnlyRootFilesystem":true,"seccompProfile":{"type":"RuntimeDefault"}}
          resources: {requests: {cpu: 10m, memory: 32Mi}}
          volumeMounts:
            - {name: gateway, mountPath: /etc/lb-gateway, readOnly: true}
            - {name: tenant, mountPath: /etc/tenant, readOnly: true}
      volumes:
        - name: gateway
          secret:
            secretName: pc-c-abcd1234-lb-gateway
            items: [{key: token, path: token}, {key: ca.crt, path: ca.crt}]
        - name: tenant
          secret:
            secretName: pc-c-abcd1234-kamaji-cp-admin-kubeconfig
            # The control plane's in-cluster address; admin.conf names the LoadBalancer, which the API allowlist guards.
            items: [{key: admin.svc, path: kubeconfig}]
