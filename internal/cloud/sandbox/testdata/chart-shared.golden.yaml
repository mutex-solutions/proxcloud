apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-setup
  namespace: sandbox-system
spec:
  selector:
    matchLabels: {app: node-setup}
  updateStrategy:
    rollingUpdate: {maxUnavailable: 1}
  template:
    metadata:
      labels: {app: node-setup}
    spec:
