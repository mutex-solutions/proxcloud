global
  log /dev/log local0
  chroot /var/lib/haproxy
  user haproxy
  group haproxy
  maxconn 20000
  stats socket /run/haproxy/admin.sock mode 660 level admin
  server-state-file /var/lib/haproxy/server-state

defaults
  log global
  timeout connect 2s
  retries 3
  option redispatch 1
  load-server-state-from-file global
  timeout client 1h
  timeout server 1h
  default-server inter 3s fall 2 rise 2

frontend l203.0.113.10_80
  bind 203.0.113.10:80
  mode tcp
  default_backend p-s0-0

frontend l203.0.113.10_443
  bind 203.0.113.10:443
  mode tcp
  default_backend p-s0-1

frontend l203.0.113.11_80
  bind 203.0.113.11:80
  mode tcp
  default_backend p-s1-0

backend p-s0-0
  mode tcp
  balance roundrobin
  server n10.0.0.250p30080 10.0.0.250:30080 check weight 1
  server n10.0.0.249p30080 10.0.0.249:30080 check weight 1

backend p-s0-1
  mode tcp
  balance roundrobin
  server n10.0.0.250p30443 10.0.0.250:30443 check weight 1
  server n10.0.0.249p30443 10.0.0.249:30443 check weight 1

backend p-s1-0
  mode tcp
  balance roundrobin
  option httpchk GET /
  server n10.0.0.250p31080 10.0.0.250:31080 check port 32000 weight 1 send-proxy-v2
  server n10.0.0.249p31080 10.0.0.249:31080 check port 32000 weight 1 send-proxy-v2
