global
  log /dev/log local0
  chroot /var/lib/haproxy
  user haproxy
  group haproxy
  maxconn 20000
  stats socket /run/haproxy/admin.sock mode 660 level admin
  server-state-file /var/lib/haproxy/server-state

defaults
  log global
  timeout connect 2s
  retries 3
  option redispatch 1
  load-server-state-from-file global
  timeout client 1h
  timeout server 1h
  default-server inter 3s fall 2 rise 2

frontend l203.0.113.10_80
  bind 203.0.113.10:80
  mode tcp
  default_backend p-s1a2b3c4d-30080
  maxconn 1000
  timeout client 50000ms

frontend l203.0.113.11_80
  bind 203.0.113.11:80
  mode http
  default_backend p-s9f8e7d6c-30080
  option forwardfor

backend p-s1a2b3c4d-30080
  mode tcp
  balance leastconn
  option httpchk GET /healthz
  timeout check 3s
  default-server inter 5s fall 3 rise 1
  timeout connect 5000ms
  timeout server 50000ms
  stick-table type ip size 100k expire 10800s
  stick on src
  server n10.0.0.250p30080 10.0.0.250:30080 check port 32000 weight 1 send-proxy
  server n10.0.0.249p30080 10.0.0.249:30080 check port 32000 weight 1 send-proxy

backend p-s9f8e7d6c-30080
  mode http
  balance roundrobin
  load-server-state-from-file none
  server n10.0.0.250p30080 10.0.0.250:30080 weight 1
  server n10.0.0.249p30080 10.0.0.249:30080 weight 1
