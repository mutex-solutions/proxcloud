global_defs {
  router_id proxcloud-lb
  vrrp_version 3
  enable_script_security
  script_user root
}

vrrp_script proxcloud_haproxy {
  script "/usr/local/sbin/proxcloud-lb-check"
  interval 1
  fall 2
  rise 2
}

vrrp_instance lb {
  state BACKUP
  interface ens18
  virtual_router_id 42
  priority 100
  advert_int 1
  nopreempt
  unicast_src_ip 10.0.0.5
  unicast_peer {
    10.0.0.6
  }
  check_unicast_src
  garp_master_refresh 5
  track_interface {
    ens19
  }
  track_script {
    proxcloud_haproxy
  }
  virtual_ipaddress {
    192.0.2.1/32 dev lo
  }
  notify /usr/local/sbin/proxcloud-lb-notify
}
