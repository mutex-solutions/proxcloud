instance lvs
global_defs {
  router_id proxcloud-lvs
  lvs_flush_on_stop
}

virtual_server 203.0.113.10 53 {
  protocol UDP
  lvs_method NAT
  lvs_sched wrr
  alpha
  warmup 0
  delay_loop 10
  retry 1
  delay_before_retry 2
  real_server 10.0.0.11 53 {
    weight 1
    uthreshold 1000
    UDP_CHECK {
      connect_timeout 3
      payload aa0001000001000000000000000001000100
      require_reply
    }
  }
  real_server 10.0.0.12 53 {
    weight 256
    uthreshold 1000
    UDP_CHECK {
      connect_timeout 3
      payload aa0001000001000000000000000001000100
      require_reply
    }
  }
}

virtual_server 203.0.113.10 5000 {
  protocol UDP
  lvs_method NAT
  lvs_sched lc
  alpha
  warmup 0
  delay_loop 5
  retry 2
  delay_before_retry 2
  real_server 10.0.0.11 5000 {
    weight 1
    UDP_CHECK {
      connect_timeout 5
    }
    PING_CHECK {
      connect_timeout 2
      retry 2
      delay_before_retry 1
    }
  }
}

virtual_server 203.0.113.10 5060 {
  protocol UDP
  lvs_method NAT
  lvs_sched sh
  alpha
  warmup 0
  delay_loop 5
  retry 1
  delay_before_retry 2
  persistence_timeout 360
  real_server 10.0.0.14 5060 {
    weight 2
    TCP_CHECK {
      connect_timeout 5
      connect_port 5061
    }
  }
}

virtual_server 203.0.113.10 6000 {
  protocol UDP
  lvs_method NAT
  lvs_sched wrr
  alpha
  warmup 0
  delay_loop 5
  retry 2
  delay_before_retry 2
  persistence_timeout 10800
  real_server 10.0.0.15 514 {
    weight 1
    HTTP_GET {
      url {
        path /healthz
        status_code 200
      }
      connect_timeout 5
      connect_port 8080
    }
  }
}

virtual_server 203.0.113.10 7000 {
  protocol UDP
  lvs_method NAT
  lvs_sched wrr
  delay_loop 5
  retry 2
  delay_before_retry 2
  real_server 10.0.0.16 7000 {
    weight 1
  }
}
