instance lvs
global_defs {
  router_id proxcloud-lvs
  lvs_flush_on_stop
}

virtual_server 203.0.113.10 5000 {
  protocol UDP
  lvs_method NAT
  lvs_sched wrr
  alpha
  warmup 0
  delay_loop 5
  retry 2
  delay_before_retry 2
  real_server 10.0.0.11 5000 {
    weight 1
    UDP_CHECK {
      connect_timeout 5
    }
    PING_CHECK {
      connect_timeout 2
      retry 2
      delay_before_retry 1
    }
  }
  real_server 10.0.0.12 5000 {
    weight 1
    UDP_CHECK {
      connect_timeout 5
    }
    PING_CHECK {
      connect_timeout 2
      retry 2
      delay_before_retry 1
    }
  }
}
