instance lvs
global_defs {
  router_id proxcloud-lvs
  lvs_flush_on_stop
}

virtual_server 203.0.113.10 53 {
  protocol UDP
  lvs_method NAT
  lvs_sched wrr
  alpha
  delay_loop 5
  retry 2
  delay_before_retry 2
  persistence_timeout 600
  real_server 10.0.0.249 30053 {
    weight 1
    HTTP_GET {
      url {
        path /
        status_code 200
      }
      connect_timeout 5
      connect_port 32000
    }
  }
}

virtual_server 203.0.113.11 27015 {
  protocol UDP
  lvs_method NAT
  lvs_sched sh
  alpha
  delay_loop 10
  retry 1
  delay_before_retry 2
  real_server 10.0.0.250 31015 {
    weight 1
    uthreshold 1000
    UDP_CHECK {
      connect_timeout 4
    }
    PING_CHECK {
      connect_timeout 2
      retry 2
      delay_before_retry 1
    }
  }
  real_server 10.0.0.249 31015 {
    weight 1
    uthreshold 1000
    UDP_CHECK {
      connect_timeout 4
    }
    PING_CHECK {
      connect_timeout 2
      retry 2
      delay_before_retry 1
    }
  }
}
