global
  log /dev/log local0
  chroot /var/lib/haproxy
  user haproxy
  group haproxy
  maxconn 20000
  stats socket /run/haproxy/admin.sock mode 660 level admin
  server-state-file /var/lib/haproxy/server-state

defaults
  log global
  timeout connect 2s
  retries 3
  option redispatch 1
  load-server-state-from-file global
  timeout client 60s
  timeout server 60s
  default-server inter 3s fall 2 rise 2

frontend l80
  bind 203.0.113.10:80
  bind 203.0.113.11:80
  mode http
  default_backend p-web
  option forwardfor
  maxconn 500
  timeout client 30000ms

frontend l443
  bind 203.0.113.10:443
  bind 203.0.113.11:443
  mode tcp
  default_backend p-tls
  timeout client 3600000ms

frontend l5432
  bind 203.0.113.10:5432
  bind 203.0.113.11:5432
  mode tcp
  default_backend p-db
  maxconn 100

frontend l6379
  bind 203.0.113.10:6379
  bind 203.0.113.11:6379
  mode tcp
  default_backend p-cache

frontend l8080
  bind 203.0.113.10:8080
  bind 203.0.113.11:8080
  mode http
  default_backend p-plain
  option forwardfor

backend p-web
  mode http
  balance roundrobin
  option httpchk GET /healthz
  timeout check 2s
  default-server inter 5s fall 4 rise 3
  timeout connect 1000ms
  timeout server 30000ms
  stick-table type ip size 100k expire 600s
  stick on src
  server m101p8443 10.0.0.11:8443 check check-ssl verify none weight 1
  server m102p8443 10.0.0.12:8443 check check-ssl verify none weight 1

backend p-tls
  mode tcp
  balance source
  option ssl-hello-chk
  default-server inter 3s fall 3 rise 2
  timeout server 3600000ms
  server m101p443 10.0.0.11:443 check weight 1 send-proxy

backend p-db
  mode tcp
  balance leastconn
  default-server inter 10s fall 2 rise 2
  stick-table type ip size 100k expire 10800s
  stick on src
  server m104p5432 10.0.0.14:5432 check port 8008 weight 1 send-proxy-v2

backend p-cache
  mode tcp
  balance roundrobin
  load-server-state-from-file none
  server m105p6379 10.0.0.15:6379 weight 1

backend p-plain
  mode http
  balance roundrobin
  server m106p8080 10.0.0.16:8080 check weight 1
