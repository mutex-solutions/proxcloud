global
  log /dev/log local0
  chroot /var/lib/haproxy
  user haproxy
  group haproxy
  maxconn 20000
  stats socket /run/haproxy/admin.sock mode 660 level admin
  server-state-file /var/lib/haproxy/server-state

defaults
  log global
  timeout connect 2s
  retries 3
  option redispatch 1
  load-server-state-from-file global
  timeout client 60s
  timeout server 60s
  default-server inter 3s fall 2 rise 2

frontend l80
  bind :80
  mode http
  default_backend p-web
  option forwardfor

frontend l5432
  bind :5432
  mode tcp
  default_backend p-db

backend p-web
  mode http
  balance roundrobin
  server m101p8080 10.0.0.11:8080 check weight 1
  server m102p8080 10.0.0.12:8080 check weight 3

backend p-db
  mode tcp
  balance leastconn
  server m104p5432 10.0.0.14:5432 check weight 1
