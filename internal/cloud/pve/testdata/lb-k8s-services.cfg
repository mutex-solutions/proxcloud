global
  log /dev/log local0
  chroot /var/lib/haproxy
  user haproxy
  group haproxy
  maxconn 20000
  stats socket /run/haproxy/admin.sock mode 660 level admin
  server-state-file /var/lib/haproxy/server-state

defaults
  log global
  timeout connect 2s
  retries 3
  option redispatch 1
  load-server-state-from-file global
  timeout client 1h
  timeout server 1h
  default-server inter 3s fall 2 rise 2

frontend l203.0.113.10_53
  bind 203.0.113.10:53
  mode tcp
  default_backend p-sdd75a9d6-30053

frontend l203.0.113.12_80
  bind 203.0.113.12:80
  mode http
  default_backend p-s4b5e57f6-30080
  option forwardfor
  maxconn 2000
  timeout client 50000ms

frontend l203.0.113.13_25
  bind 203.0.113.13:25
  mode tcp
  default_backend p-s00d8d3f1-30025

backend p-sdd75a9d6-30053
  mode tcp
  balance roundrobin
  option httpchk GET /
  stick-table type ip size 100k expire 600s
  stick on src
  server n10.0.0.249p30053 10.0.0.249:30053 check port 32000 weight 1

backend p-s4b5e57f6-30080
  mode http
  balance leastconn
  timeout check 3s
  default-server inter 5s fall 3 rise 1
  timeout connect 5000ms
  timeout server 50000ms
  server n10.0.0.250p30080 10.0.0.250:30080 check weight 1
  server n10.0.0.249p30080 10.0.0.249:30080 check weight 1

backend p-s00d8d3f1-30025
  mode tcp
  balance roundrobin
  load-server-state-from-file none
  server n10.0.0.250p30025 10.0.0.250:30025 weight 1 send-proxy
  server n10.0.0.249p30025 10.0.0.249:30025 weight 1 send-proxy
