global_defs {
  router_id proxcloud-lb
  vrrp_version 3
  enable_script_security
  script_user root
}

vrrp_script proxcloud_haproxy {
  script "/usr/local/sbin/proxcloud-lb-check"
  interval 1
  fall 2
  rise 2
}

vrrp_instance lb {
  state BACKUP
  interface ens18
  virtual_router_id 42
  priority 100
  advert_int 1
  nopreempt
  unicast_src_ip 10.0.0.5
  unicast_peer {
    10.0.0.6
  }
  check_unicast_src
  garp_master_refresh 5
  track_interface {
    ens19
  }
  track_script {
    proxcloud_haproxy
  }
  virtual_ipaddress {
    203.0.113.10/24 dev ens19
  }
  virtual_ipaddress_excluded {
    203.0.113.11/24 dev ens19
  }
  virtual_rules {
    from 203.0.113.10/32 table 100 preference 100
    from 203.0.113.11/32 table 100 preference 100
  }
  virtual_routes {
    203.0.113.0/24 dev ens19 scope link table 100
    default via 203.0.113.1 dev ens19 table 100
  }
  notify /usr/local/sbin/proxcloud-lb-notify
}
