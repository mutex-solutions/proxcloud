global
  log /dev/log local0
  chroot /var/lib/haproxy
  user haproxy
  group haproxy
  maxconn 20000
  stats socket /run/haproxy/admin.sock mode 660 level admin
  server-state-file /var/lib/haproxy/server-state
  ssl-default-bind-options ssl-min-ver TLSv1.2
  ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
  ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305

defaults
  log global
  timeout connect 2s
  retries 3
  option redispatch 1
  load-server-state-from-file global
  timeout client 1h
  timeout server 1h
  default-server inter 3s fall 2 rise 2

frontend l203.0.113.10_80
  bind 203.0.113.10:80
  mode http
  default_backend p-s8d9001d3-30080
  option forwardfor

frontend l203.0.113.10_443
  bind 203.0.113.10:443 ssl crt /etc/haproxy/certs/a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1.pem crt /etc/haproxy/certs/b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2.pem alpn h2,http/1.1
  mode http
  default_backend p-s8d9001d3-30443
  option forwardfor
  http-request set-header X-Forwarded-Proto https

frontend l203.0.113.11_8883
  bind 203.0.113.11:8883 ssl crt /etc/haproxy/certs/b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2.pem
  mode tcp
  default_backend p-s046adb88-31883

backend p-s8d9001d3-30080
  mode http
  balance roundrobin
  server n10.0.0.250p30080 10.0.0.250:30080 check weight 1
  server n10.0.0.249p30080 10.0.0.249:30080 check weight 1

backend p-s8d9001d3-30443
  mode http
  balance roundrobin
  server n10.0.0.250p30443 10.0.0.250:30443 check weight 1
  server n10.0.0.249p30443 10.0.0.249:30443 check weight 1

backend p-s046adb88-31883
  mode tcp
  balance roundrobin
  server n10.0.0.250p31883 10.0.0.250:31883 check weight 1 send-proxy-v2
  server n10.0.0.249p31883 10.0.0.249:31883 check weight 1 send-proxy-v2
