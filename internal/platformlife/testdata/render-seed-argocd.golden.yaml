  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      labels:
        app.kubernetes.io/managed-by: proxcloud-platform
        proxcloud.io/bom-release: 0.11.1
        proxcloud.io/component: argocd
        proxcloud.io/platform-installation: pi-0123abcd
      name: pc-platform-argocd
      namespace: argocd
    spec:
      destination:
        namespace: argocd
        server: https://192.0.2.10:6443
      project: proxcloud-platform
      source:
        chart: argo-cd
        helm:
          releaseName: argocd
          valuesObject:
            applicationSet:
              replicas: 0
            configs:
              cm:
                resource.customizations.health.addons.cluster.x-k8s.io_ClusterResourceSet: |
                  hs = {}
                  hs.status = "Progressing"
                  hs.message = "Waiting for ResourcesApplied"
                  if obj.status ~= nil and obj.status.conditions ~= nil then
                    for _, c in ipairs(obj.status.conditions) do
                      if c.type == "ResourcesApplied" and c.status == "True" then
                        hs.status = "Healthy"
                        hs.message = "ResourcesApplied"
                      end
                    end
                  end
                  return hs
                resource.customizations.health.addons.cluster.x-k8s.io_HelmChartProxy: |
                  hs = {}
                  hs.status = "Progressing"
                  hs.message = "Waiting for Ready"
                  if obj.status ~= nil and obj.status.conditions ~= nil then
                    for _, c in ipairs(obj.status.conditions) do
                      if c.type == "Ready" and c.status == "True" then
                        hs.status = "Healthy"
                        hs.message = "Ready"
                      end
                    end
                  end
                  return hs
                resource.customizations.health.cluster.x-k8s.io_Cluster: |
                  hs = {}
                  if obj.status ~= nil then
                    if obj.status.failureReason ~= nil or obj.status.failureMessage ~= nil then
                      hs.status = "Degraded"
                      hs.message = tostring(obj.status.failureMessage or obj.status.failureReason)
                      return hs
                    end
                    local phase = obj.status.phase
                    if phase == "Provisioned" then
                      hs.status = "Healthy"
                      hs.message = "Cluster provisioned"
                      return hs
                    end
                    if phase == "Failed" then
                      hs.status = "Degraded"
                      hs.message = "Cluster failed"
                      return hs
                    end
                    if phase ~= nil then
                      hs.status = "Progressing"
                      hs.message = "Cluster " .. tostring(phase)
                      return hs
                    end
                  end
                  hs.status = "Progressing"
                  hs.message = "Waiting for Cluster status"
                  return hs
                resource.customizations.health.cluster.x-k8s.io_MachineDeployment: |
                  hs = {}
                  if obj.status ~= nil and obj.status.phase ~= nil then
                    local phase = obj.status.phase
                    if phase == "Failed" then
                      hs.status = "Degraded"
                      hs.message = "MachineDeployment failed"
                      return hs
                    end
                    if phase == "Running" then
                      local desired = obj.spec ~= nil and obj.spec.replicas or nil
                      local ready = obj.status.readyReplicas or 0
                      if desired == nil or ready >= desired then
                        hs.status = "Healthy"
                        hs.message = tostring(ready) .. " ready"
                        return hs
                      end
                      hs.status = "Progressing"
                      hs.message = tostring(ready) .. "/" .. tostring(desired) .. " ready"
                      return hs
                    end
                    -- ScalingUp / ScalingDown / Unknown
                    hs.status = "Progressing"
                    hs.message = "MachineDeployment " .. tostring(phase)
                    return hs
                  end
                  hs.status = "Progressing"
                  hs.message = "Waiting for MachineDeployment status"
                  return hs
                resource.customizations.health.k8s.mariadb.com_MariaDB: |
                  hs = {}
                  if obj.status ~= nil and obj.status.conditions ~= nil then
                    for _, c in ipairs(obj.status.conditions) do
                      if c.type == "Ready" then
                        if c.status == "True" then
                          hs.status = "Healthy"
                          hs.message = c.message or "MariaDB ready"
                          return hs
                        end
                        hs.status = "Progressing"
                        hs.message = c.message or ("MariaDB " .. tostring(c.reason))
                        return hs
                      end
                    end
                  end
                  hs.status = "Progressing"
                  hs.message = "Waiting for MariaDB status"
                  return hs
                resource.customizations.health.kafka.strimzi.io_Kafka: |
                  hs = {}
                  if obj.status ~= nil then
                    if obj.status.observedGeneration ~= nil and obj.metadata ~= nil and obj.metadata.generation ~= nil and obj.status.observedGeneration < obj.metadata.generation then
                      hs.status = "Progressing"
                      hs.message = "Waiting for Strimzi to observe generation " .. tostring(obj.metadata.generation)
                      return hs
                    end
                    if obj.status.conditions ~= nil then
                      for _, c in ipairs(obj.status.conditions) do
                        if c.type == "NotReady" and c.status == "True" then
                          hs.status = "Degraded"
                          hs.message = tostring(c.reason or "NotReady") .. ": " .. tostring(c.message or "")
                          return hs
                        end
                        if c.type == "Ready" and c.status == "True" then
                          hs.status = "Healthy"
                          hs.message = "Kafka ready"
                          return hs
                        end
                      end
                    end
                  end
                  hs.status = "Progressing"
                  hs.message = "Waiting for Kafka status"
                  return hs
                resource.customizations.health.kamaji.clastix.io_TenantControlPlane: |
                  hs = {}
                  if obj.status ~= nil and obj.status.kubernetesResources ~= nil and obj.status.kubernetesResources.version ~= nil then
                    local s = obj.status.kubernetesResources.version.status
                    local v = obj.status.kubernetesResources.version.current or ""
                    if s == "Ready" then
                      hs.status = "Healthy"
                      hs.message = "TenantControlPlane ready " .. v
                      return hs
                    end
                    if s == "NotReady" then
                      hs.status = "Degraded"
                      hs.message = "TenantControlPlane not ready"
                      return hs
                    end
                    -- Provisioning / Upgrading / Migrating / CertificateRotating / anything transitional
                    hs.status = "Progressing"
                    hs.message = "TenantControlPlane " .. tostring(s)
                    return hs
                  end
                  hs.status = "Progressing"
                  hs.message = "Waiting for TenantControlPlane status"
                  return hs
                resource.customizations.health.opensearch.opster.io_OpenSearchCluster: |
                  hs = {}
                  if obj.status ~= nil and obj.status.health ~= nil and obj.status.health ~= "" then
                    local health = obj.status.health
                    if health == "green" then
                      hs.status = "Healthy"
                      hs.message = "OpenSearch cluster green"
                      return hs
                    end
                    if health == "yellow" then
                      hs.status = "Progressing"
                      hs.message = "OpenSearch cluster yellow (shard allocation in progress)"
                      return hs
                    end
                    if health == "red" then
                      hs.status = "Degraded"
                      hs.message = "OpenSearch cluster red"
                      return hs
                    end
                    hs.status = "Progressing"
                    hs.message = "OpenSearch cluster health " .. tostring(health)
                    return hs
                  end
                  hs.status = "Progressing"
                  hs.message = "Waiting for OpenSearchCluster status"
                  return hs
                resource.customizations.health.postgresql.cnpg.io_Cluster: |
                  hs = {}
                  -- NO string library: ArgoCD's Lua sandbox does not expose it, and calling string.lower here
                  -- crashed the check — every CNPG database then reported health Unknown, which is how a
                  -- database with no pods still looked fine. Match the operator's phase values exactly.
                  local healthy = "Cluster in healthy state"
                  local broken = {
                    ["Cluster in unrecoverable state"] = true,
                    ["Cluster upgrade failed"] = true,
                    ["Failing over"] = false,
                  }
                  if obj.status ~= nil then
                    local phase = obj.status.phase
                    if phase ~= nil and broken[phase] then
                      hs.status = "Degraded"
                      hs.message = phase
                      return hs
                    end
                    local desired = nil
                    if obj.spec ~= nil then
                      desired = obj.spec.instances
                    end
                    local ready = obj.status.readyInstances or 0
                    if desired ~= nil and ready >= desired and phase == healthy then
                      hs.status = "Healthy"
                      hs.message = tostring(ready) .. " ready"
                      return hs
                    end
                    hs.status = "Progressing"
                    hs.message = tostring(ready) .. "/" .. tostring(desired) .. " ready — " .. tostring(phase)
                    return hs
                  end
                  hs.status = "Progressing"
                  hs.message = "Waiting for Cluster status"
                  return hs
                resource.customizations.health.ps.percona.com_PerconaServerMySQL: |
                  hs = {}
                  if obj.status ~= nil and obj.status.state ~= nil then
                    local state = obj.status.state
                    if state == "ready" then
                      hs.status = "Healthy"
                      hs.message = "PerconaServerMySQL ready"
                      return hs
                    end
                    if state == "error" then
                      hs.status = "Degraded"
                      hs.message = "PerconaServerMySQL error"
                      return hs
                    end
                    hs.status = "Progressing"
                    hs.message = "PerconaServerMySQL " .. tostring(state)
                    return hs
                  end
                  hs.status = "Progressing"
                  hs.message = "Waiting for PerconaServerMySQL status"
                  return hs
              params:
                server.insecure: true
            dex:
              enabled: false
            notifications:
              enabled: false
        repoURL: ghcr.io/mutex-solutions/charts-mirror
        targetRevision: 10.14.0
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          annotations:
            scheduler.alpha.kubernetes.io/node-selector: node-restriction.kubernetes.io/proxcloud-node-group=system
        retry:
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
          limit: 10
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
