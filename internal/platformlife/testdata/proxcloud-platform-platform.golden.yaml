apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: proxcloud-mgmt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: proxcloud-mgmt
subjects:
  - kind: ServiceAccount
    name: proxcloud
    namespace: proxcloud-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: proxcloud-applications
  namespace: argocd
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - create
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: proxcloud-applications
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: proxcloud-applications
subjects:
  - kind: ServiceAccount
    name: proxcloud
    namespace: proxcloud-system
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/managed-by: proxcloud
  name: proxcloud-system
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    argocd.argoproj.io/secret-type: repository
  name: proxcloud-charts-creds
  namespace: argocd
stringData:
  enableOCI: "true"
  name: proxcloud-charts
  type: helm
  url: ghcr.io/mutex-solutions/charts
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    kubernetes.io/service-account.name: proxcloud
  name: proxcloud-token
  namespace: proxcloud-system
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: proxcloud
  namespace: proxcloud-system
