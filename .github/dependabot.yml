# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Go modules (backend)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # Customer console (React SPA)
  - package-ecosystem: "npm"
    directory: "/web/client"
    schedule:
      interval: "weekly"
    groups:
      # react and react-dom must carry the same version: a mismatch blanks the SPA at load.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]

  # Operator console (React SPA)
  - package-ecosystem: "npm"
    directory: "/web/admin"
    schedule:
      interval: "weekly"
    groups:
      # react and react-dom must carry the same version: a mismatch blanks the SPA at load.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]

  # Docker Compose install: PostgreSQL alone. It is pinned to a minor release and to its digest so that an upgrade
  # does not restart the database unasked: a rebuild of the tag arrives as a pull request here, with the README's two
  # mentions to move by hand (the test names them). A new major needs a dump and restore. Traefik, Keycloak and its config CLI
  # move by hand, together with the chart (deploy/tests/test_compose_production.py compares them).
  - package-ecosystem: "docker-compose"
    directory: "/deploy/compose"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "postgres"
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # The guest images of the real-guest load balancer tests: each base is pinned by digest, and this moves the
  # digest when the distribution publishes its image again (the packages on top follow the mirror every week,
  # test.yml).
  - package-ecosystem: "docker"
    directory: "/test/integration/images"
    schedule:
      interval: "weekly"
    # The digest of the pinned release only: another Ubuntu release is another appliance image, moved by hand.
    ignore:
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
