name: security-scan

# Inventory and gate the exact PR head (not GitHub's synthetic merge commit).
# Builds are disposable, local-only hosted-runner images: no login, push, PVE,
# VM build, deployment, secrets, or persistent/self-hosted runner access.
# Covers lockfiles, six product finals, eleven non-GPU template outputs and
# thirteen deduplicated upstream bases (registry blobs only, no base execution).
# GPU/CUDA remains SOURCE_ONLY/HOLD; raw bases are not final package evidence.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TRIVY_VERSION: '0.76.2'
  TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
  TRIVY_NO_PROGRESS: 'true'
  TRIVY_DISABLE_VEX_NOTICE: 'true'

jobs:
  scan:
    name: scan-${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - image: filesystem
            dockerfile: ''
            context: .
            app: ''
          - image: api
            dockerfile: deploy/Dockerfile
            context: .
            app: ''
          - image: web-client
            dockerfile: web/Dockerfile
            context: web
            app: client
          - image: web-admin
            dockerfile: web/Dockerfile
            context: web
            app: admin
          - image: sandbox-proxy
            dockerfile: deploy/sandbox-proxy.Dockerfile
            context: .
            app: ''
          - image: sandbox-runtime
            dockerfile: deploy/sandbox-runtime.Dockerfile
            context: .
            app: ''
          - image: sandbox-import
            dockerfile: deploy/sandbox-import.Dockerfile
            context: .
            app: ''
    defaults:
      run:
        shell: bash
    env:
      IMAGE_NAME: ${{ matrix.image }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      BUILD_CONTEXT: ${{ matrix.context }}
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record source and test report gate
        run: |
          set -euo pipefail
          mkdir -p result tools
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          # Expand the runner variable in the shell, not workflow expression context.
          printf 'TRIVY_CACHE_DIR=%s/security-scan-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf '%s\n' "$SOURCE_SHA" > result/source-sha.txt
          printf '%s\n' "$TRIVY_SHA256" > result/trivy-sha256.txt
          python3 -m unittest discover -s .github/scripts/tests -p test_scan_report.py -v
          python3 -m unittest discover -s .github/scripts/tests -p test_api_runtime_contract.py -v

      - name: Download and verify official Trivy release before extracting binary
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --proto-redir '=https' \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output tools/trivy.tar.gz
          test "$(stat -c %s tools/trivy.tar.gz)" = 52714130
          printf '%s  %s\n' "$TRIVY_SHA256" tools/trivy.tar.gz | sha256sum --check --strict
          tar xzf tools/trivy.tar.gz -C tools trivy
          tools/trivy --version > result/trivy-version.txt

      - name: Download fresh vulnerability database
        run: |
          set -euo pipefail
          tools/trivy image --config '' --ignorefile '' --disable-telemetry \
            --skip-version-check --download-db-only
          cp "$TRIVY_CACHE_DIR/db/metadata.json" result/db-metadata.json
          python3 .github/scripts/check_scan_report.py --db-metadata result/db-metadata.json

      - name: Scan source lockfiles including development dependencies
        if: matrix.image == 'filesystem'
        run: |
          set -euo pipefail
          tools/trivy fs --config '' --ignorefile '' --disable-telemetry \
            --skip-version-check --ignore-unfixed=false --scanners vuln --include-dev-deps \
            --skip-dirs .git,.claude,tools,result --skip-db-update \
            --severity HIGH,CRITICAL --exit-code 0 --format json \
            --output result/scan.json .

      - name: Build exact recipe output locally without publishing
        if: matrix.image != 'filesystem'
        run: |
          set -euo pipefail
          args=()
          if [ -n "$APP" ]; then args+=(--build-arg "APP=$APP"); fi
          docker build --pull --platform linux/amd64 --load \
            --file "$DOCKERFILE" --tag "security-scan:${SOURCE_SHA}" \
            "${args[@]}" "$BUILD_CONTEXT" 2>&1 | tee result/build.log
          docker image inspect "security-scan:${SOURCE_SHA}" \
            --format '{{.Id}}' > result/image-id.txt

      - name: Smoke API runtime contract without starting the application
        if: matrix.image == 'api'
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint /bin/sh \
            "security-scan:${SOURCE_SHA}" -ec '
              test "$(id -u)" = 10001
              test "$(id -g)" = 0
              command -v bash
              test -r /etc/ssl/certs/ca-certificates.crt
              psql --version | grep -E "PostgreSQL\) 18\."
              /usr/local/bin/proxcloud-api admin-key create -help
            '

      - name: Smoke runtime donor installer privately and twice
        if: matrix.image == 'sandbox-runtime'
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /scratch:size=128m,mode=1777 \
            --entrypoint /bin/sh "security-scan:${SOURCE_SHA}" -ec '
              export DEST=/scratch/bin
              /install.sh
              /install.sh
              for f in envd sandbox-init sandbox-netguard prepull-runtime; do
                test "$(stat -c %a "$DEST/$f")" = 755
                cmp "/proxcloud-sandbox/bin/$f" "$DEST/$f"
              done
            '

      - name: Scan actual local image including unfixed vulnerabilities
        if: matrix.image != 'filesystem'
        run: |
          set -euo pipefail
          tools/trivy image --config '' --ignorefile '' --disable-telemetry \
            --skip-version-check --ignore-unfixed=false --exit-on-eol 1 \
            --image-src docker --platform linux/amd64 \
            --scanners vuln --skip-db-update --severity HIGH,CRITICAL \
            --exit-code 0 --format json --output result/scan.json \
            "security-scan:${SOURCE_SHA}"

      - name: Fail closed on malformed reports, stale DB, or any HIGH/CRITICAL
        run: |
          set -euo pipefail
          args=()
          if [ "$IMAGE_NAME" != filesystem ]; then
            args+=(--expected-image-id "$(<result/image-id.txt)")
          fi
          python3 .github/scripts/check_scan_report.py \
            --db-metadata result/db-metadata.json "${args[@]}" result/scan.json

      - name: Preserve reports and provenance even when scan or gate fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-${{ matrix.image }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 3

  template-images:
    name: template-images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record source and test template scanner
        run: |
          set -euo pipefail
          mkdir -p result tools
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'TRIVY_CACHE_DIR=%s/security-scan-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf '%s\n' "$SOURCE_SHA" > result/source-sha.txt
          printf '%s\n' "$TRIVY_SHA256" > result/trivy-sha256.txt
          python3 -m unittest discover -s .github/scripts/tests -p test_template_scan.py -v

      - name: Set up Docker Buildx for local template dependencies
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Download and verify official Trivy release before extracting binary
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --proto-redir '=https' \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output tools/trivy.tar.gz
          test "$(stat -c %s tools/trivy.tar.gz)" = 52714130
          printf '%s  %s\n' "$TRIVY_SHA256" tools/trivy.tar.gz | sha256sum --check --strict
          tar xzf tools/trivy.tar.gz -C tools trivy
          tools/trivy --version > result/trivy-version.txt

      - name: Download fresh vulnerability database
        run: |
          set -euo pipefail
          tools/trivy image --config '' --ignorefile '' --disable-telemetry \
            --skip-version-check --download-db-only
          cp "$TRIVY_CACHE_DIR/db/metadata.json" result/db-metadata.json
          python3 .github/scripts/check_scan_report.py --db-metadata result/db-metadata.json

      - name: Build eleven non-GPU templates once and scan each emitted local image
        run: |
          set -euo pipefail
          # Fixed name/ref allowlist, PUSH=0, SHA tag; never build the GPU target.
          # The helper scans stdout refs immediately while build stderr is logged.
          python3 .github/scripts/scan_template_images.py

      - name: Preserve template reports and provenance even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-template-images-${{ github.event.pull_request.head.sha || github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 3

  base-images:
    name: base-images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record source and test fixed base registry scanner
        run: |
          set -euo pipefail
          mkdir -p result tools
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'TRIVY_CACHE_DIR=%s/security-scan-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf '%s\n' "$SOURCE_SHA" > result/source-sha.txt
          printf '%s\n' "$TRIVY_SHA256" > result/trivy-sha256.txt
          python3 -m unittest discover -s .github/scripts/tests -p test_base_scan.py -v

      - name: Set up Buildx for registry manifest inspection only
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Download and verify official Trivy release before extracting binary
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --proto-redir '=https' \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output tools/trivy.tar.gz
          test "$(stat -c %s tools/trivy.tar.gz)" = 52714130
          printf '%s  %s\n' "$TRIVY_SHA256" tools/trivy.tar.gz | sha256sum --check --strict
          tar xzf tools/trivy.tar.gz -C tools trivy
          tools/trivy --version > result/trivy-version.txt

      - name: Download fresh vulnerability database
        run: |
          set -euo pipefail
          tools/trivy image --config '' --ignorefile '' --disable-telemetry \
            --skip-version-check --download-db-only
          cp "$TRIVY_CACHE_DIR/db/metadata.json" result/db-metadata.json
          python3 .github/scripts/check_scan_report.py --db-metadata result/db-metadata.json

      - name: Resolve and scan thirteen upstream linux amd64 bases without execution
        run: |
          set -euo pipefail
          # Fixed source allowlist; immutable platform refs, no pull/run/build/login/push.
          # Raw base HIGH/CRITICAL (even unfixed) block; no final-image attribution.
          python3 .github/scripts/scan_base_images.py

      - name: Preserve base reports and provenance even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-base-images-${{ github.event.pull_request.head.sha || github.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 3

  security-gate:
    name: security-gate
    if: always()
    needs: [scan, template-images, base-images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every scan leg to succeed
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
          TEMPLATE_RESULT: ${{ needs.template-images.result }}
          BASE_RESULT: ${{ needs.base-images.result }}
        run: |
          set -euo pipefail
          if [ "$SCAN_RESULT" != success ] || [ "$TEMPLATE_RESULT" != success ] || [ "$BASE_RESULT" != success ]; then
            echo 'Security gate blocked: a scan failed, was cancelled, or was skipped.'
            exit 1
          fi
          echo 'Filesystem, six product finals, eleven non-GPU templates and thirteen upstream base scans passed.'

  render-comment:
    name: security-summary
    if: always() && github.event_name == 'pull_request'
    needs: [scan, template-images, base-images, security-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      body: ${{ steps.render.outputs.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate report artifact names and archive size budgets
        id: artifacts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid source SHA');
            const targets = ['filesystem', 'api', 'web-client', 'web-admin', 'sandbox-proxy', 'sandbox-runtime', 'sandbox-import', 'template-images', 'base-images'];
            const expected = new Set(targets.map(n => `security-${n}-${sha}`));
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.runId, per_page: 100
            });
            const selected = artifacts.filter(a => expected.has(a.name) && !a.expired);
            if (selected.length > 9 || new Set(selected.map(a => a.name)).size !== selected.length) throw new Error('Duplicate report artifacts');
            if (selected.some(a => a.size_in_bytes > 128 * 1024 * 1024) || selected.reduce((n, a) => n + a.size_in_bytes, 0) > 512 * 1024 * 1024) throw new Error('Report archive byte budget');
            core.setOutput('ids', selected.map(a => String(a.id)).join(','));
            core.setOutput('count', String(selected.length));
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.artifacts.outputs.count != '0'
        with:
          artifact-ids: ${{ steps.artifacts.outputs.ids }}
          path: scan-reports
          merge-multiple: false
      - name: Render bounded CVE tables as data with a read-only token
        id: render
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
          TEMPLATE_RESULT: ${{ needs.template-images.result }}
          BASE_RESULT: ${{ needs.base-images.result }}
          GATE_RESULT: ${{ needs.security-gate.result }}
        run: |
          set -euo pipefail
          mkdir -p scan-reports
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 -m unittest discover -s .github/scripts/tests -p test_security_comment.py -v
          python3 .github/scripts/render_security_comment.py \
            --reports-dir scan-reports --source-sha "$SOURCE_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --scan-result "$SCAN_RESULT" --template-result "$TEMPLATE_RESULT" \
            --gate-result "$GATE_RESULT" --base-result "$BASE_RESULT" --output "$RUNNER_TEMP/security-comment.md"
          python3 - <<'PYCODE'
          from pathlib import Path
          import os, secrets
          body = Path(os.environ['RUNNER_TEMP'], 'security-comment.md').read_text()
          assert body.startswith('<!-- proxcloud-security-scan-v1 -->') and len(body) <= 55000
          token = 'security_' + secrets.token_hex(24)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('body<<' + token + '\n' + body + '\n' + token + '\n')
          PYCODE

  comment:
    name: security-comment
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [scan, template-images, base-images, security-gate, render-comment]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    # No checkout or execution of PR files in this write-token job. Reports remain
    # downloadable data; this initial summary does not parse artifact archives.
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
          TEMPLATE_RESULT: ${{ needs.template-images.result }}
          BASE_RESULT: ${{ needs.base-images.result }}
          GATE_RESULT: ${{ needs.security-gate.result }}
          REPORT_BODY: ${{ needs.render-comment.outputs.body }}
        with:
          script: |
            const marker = '<!-- proxcloud-security-scan-v1 -->';
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid source SHA');
            const pr = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.data.state !== 'open' || pr.data.head.sha !== sha) {
              core.info('Not commenting: PR closed or this run belongs to an older head.');
              return;
            }
            const states = new Set(['success', 'failure', 'cancelled', 'skipped']);
            const scan = process.env.SCAN_RESULT;
            const gate = process.env.GATE_RESULT;
            const templates = process.env.TEMPLATE_RESULT;
            const bases = process.env.BASE_RESULT;
            if (!states.has(scan) || !states.has(templates) || !states.has(bases) || !states.has(gate)) throw new Error('Unknown scan/template/base/gate state');
            const names = ['filesystem', 'api', 'web-client', 'web-admin', 'sandbox-proxy', 'sandbox-runtime', 'sandbox-import', 'template-images', 'base-images'];
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: context.runId, per_page: 100
            });
            const present = new Set(artifacts.filter(a => !a.expired).map(a => a.name));
            const coverage = names.map(n => `- ${n}: ${present.has(`security-${n}-${sha}`) ? 'report artifact present' : '**report artifact missing**'}`).join('\n');
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const status = gate === 'success' ? 'PASS' : 'BLOCKED / INCOMPLETE';
            const fallback = [marker, `## Security scan: ${status}`, '',
              `Source commit: \`${sha}\``,
              `Scan matrix result: **${scan}**; template-images result: **${templates}**; base-images result: **${bases}**; required gate: **${gate}**.`,  '',
              'Policy: any HIGH or CRITICAL vulnerability (including unfixed) fails the gate. Scanner errors, stale DB, malformed or missing reports also fail.', '',
              `[Open this run and its report artifacts](${url})`, '', coverage, '',
              'Coverage jobs: source lockfiles, six product final images, eleven locally built non-GPU template outputs and thirteen upstream bases (including builder/donor/external Python inputs), registry blobs only. Raw base findings are not final installed-package evidence. GPU/CUDA remains SOURCE_ONLY/HOLD. When detailed rendering is unavailable, base details remain in the base-images artifact.',
              'Counts, package versions and advisory details are in the JSON reports. This comment reports overall job status; it does not invent counts or claim zero vulnerabilities outside that coverage.'
            ].join('\n');
            const decorated = process.env.REPORT_BODY || '';
            const body = decorated.startsWith(marker) && decorated.length <= 55000 ? decorated : fallback + '\n\n⚠️ Detailed summary unavailable; the gate remains authoritative. See reports above.';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100
            });
            const matches = comments.filter(c => c.user?.login === 'github-actions[bot]' && c.user?.type === 'Bot' && c.body?.startsWith(marker));
            matches.sort((a, b) => b.id - a.id);
            const current = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (current.data.state !== 'open' || current.data.head.sha !== sha) {
              core.info('Not writing: PR head changed while summary was prepared.');
              return;
            }
            if (matches.length) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: matches[0].id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }
