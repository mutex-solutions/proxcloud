name: vm-artifacts

# Reusable publisher. It is called ONLY by vm-artifact-export.yml, from the run whose `export` job produced
# the bundle: there is no manual dispatch and no other trigger, so no hand-fed run id, name or hash exists.
# It accepts exactly one producer (images/vm_publish_stage.py): the `export` job of THIS run,
# concluded success, in this repository, on main, at this very commit, for exactly what was dispatched.
# Hosted runner: no PVE access. It is passed no secret and sets no workflow-wide environment; keep it so.
on:
  workflow_call:
    inputs:
      artifact_name:
        description: Exact bundle artifact name the export job of this run uploaded
        type: string
        required: true
      expected_manifest_sha256:
        description: manifest.json SHA256 the export job recorded (64 lowercase hex, no prefix)
        type: string
        required: true
      expected_disk_sha256:
        description: disk.qcow2 SHA256 the export job recorded (64 lowercase hex, no prefix)
        type: string
        required: true
      variant:
        description: The dispatched variant (os or kubernetes)
        type: string
        required: true
      os:
        description: The dispatched OS
        type: string
        required: true
      kubernetes_version:
        description: The dispatched Kubernetes version (none for a native export)
        type: string
        required: true
      evidence_sha256:
        description: sha256 of the evidence record the export job reported; only required to be present before anything is pushed
        type: string
        required: true
    outputs:
      package:
        description: The GHCR package the bundle was pushed to
        value: ${{ jobs.publish.outputs.package }}
      digest:
        description: The OCI digest of the pushed artifact (sha256:<64 hex>)
        value: ${{ jobs.publish.outputs.digest }}

permissions: {}

concurrency:
  group: vm-artifacts-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'mutex-solutions/proxcloud' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      package: ${{ steps.push.outputs.package }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      # The producer is this run: its id and attempt are GitHub's, never an input.
      EXPORT_RUN_ID: ${{ github.run_id }}
      EXPORT_RUN_ATTEMPT: ${{ github.run_attempt }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
      EXPECTED_DISK_SHA256: ${{ inputs.expected_disk_sha256 }}
      PUBLISHER_SHA: ${{ github.sha }}
      PUBLISHER_REPOSITORY: ${{ github.repository }}
      # In a called workflow this is the CALLER: it must be the export workflow on main.
      PUBLISHER_WORKFLOW_REF: ${{ github.workflow_ref }}
      EXPORT_VARIANT: ${{ inputs.variant }}
      EXPORT_OS: ${{ inputs.os }}
      EXPORT_KUBERNETES_VERSION: ${{ inputs.kubernetes_version }}
      EVIDENCE_SHA256: ${{ inputs.evidence_sha256 }}
    steps:
      - name: Reject a wrong caller or malformed inputs before checkout or API access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, os, re
          def match(pattern, value):
              return re.fullmatch(pattern, value, flags=re.ASCII) is not None
          # GitHub drops a job output that contains a value masked in the job that set it (a short secret that
          # happens to occur in a hash or in the name). Nothing was published; dispatch a new export.
          if not all(os.environ[key] for key in ('ARTIFACT_NAME', 'EXPECTED_MANIFEST_SHA256', 'EXPECTED_DISK_SHA256', 'EVIDENCE_SHA256')):
              raise SystemExit('Publication refused: an output of the export job is empty (GitHub drops an output that contains a masked value)')
          valid = os.environ['PUBLISHER_REPOSITORY'] == 'mutex-solutions/proxcloud'
          valid &= os.environ['PUBLISHER_WORKFLOW_REF'] == 'mutex-solutions/proxcloud/.github/workflows/vm-artifact-export.yml@refs/heads/main'
          valid &= match(r'[1-9][0-9]{0,19}', os.environ['EXPORT_RUN_ID']) and match(r'[1-9][0-9]{0,3}', os.environ['EXPORT_RUN_ATTEMPT'])
          valid &= match(r'[0-9a-f]{40}', os.environ['PUBLISHER_SHA'])
          valid &= all(match(r'[0-9a-f]{64}', os.environ[key]) for key in ('EXPECTED_MANIFEST_SHA256', 'EXPECTED_DISK_SHA256', 'EVIDENCE_SHA256'))
          valid &= os.environ['EXPORT_VARIANT'] in ('os', 'kubernetes') and match(r'ubuntu-2[46]04', os.environ['EXPORT_OS'])
          valid &= match(r'none|[0-9]{1,2}\.[0-9]{1,3}\.[0-9]{1,3}', os.environ['EXPORT_KUBERNETES_VERSION'])
          found = re.fullmatch(r'(?:vm-export-(?:ubuntu-2404|ubuntu-2604|debian-12|debian-13)|vm-k8s-export-ubuntu-2604)-([0-9]{14})-([0-9a-f]{12})', os.environ['ARTIFACT_NAME'], flags=re.ASCII)
          try:
              valid &= found is not None
              if found:
                  datetime.datetime.strptime(found[1], '%Y%m%d%H%M%S')
          except ValueError:
              valid = False
          if not valid:
              raise SystemExit('Publication refused: invalid caller or inputs')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mutex-solutions/proxcloud
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            images/vm_artifact.py
            images/vm_publish_stage.py
          sparse-checkout-cone-mode: false
      - name: Authorize the successful export job of this run as the only producer
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 images/vm_publish_stage.py check-inputs
          metadata="${RUNNER_TEMP:?}/vm-artifact-metadata"
          mkdir --mode=700 "$metadata"
          # Never accept a user URL, workflow name/ID, repository, branch or API host.
          api='https://api.github.com/repos/mutex-solutions/proxcloud/actions'
          opts=(--fail --silent --show-error --proto '=https' --connect-timeout 20 --max-time 60 --max-filesize 1048576
                --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json'
                --header 'X-GitHub-Api-Version: 2022-11-28')
          curl "${opts[@]}" "$api/workflows/vm-artifact-export.yml" --output "$metadata/workflow.json"
          curl "${opts[@]}" "$api/runs/$EXPORT_RUN_ID" --output "$metadata/run.json"
          # The run is still in progress (this job is part of it): what must have concluded success is the
          # export JOB of this attempt. One page holds every job of the run; the helper refuses otherwise.
          curl "${opts[@]}" "$api/runs/$EXPORT_RUN_ID/attempts/$EXPORT_RUN_ATTEMPT/jobs?per_page=100" --output "$metadata/jobs.json"
          # Asked for the exact (already validated) name: exactly one such artifact may exist in the run.
          curl "${opts[@]}" "$api/runs/$EXPORT_RUN_ID/artifacts?per_page=100&name=$ARTIFACT_NAME" --output "$metadata/artifacts.json"
          python3 images/vm_publish_stage.py authorize --metadata-dir "$metadata" >> "$GITHUB_OUTPUT"
      - name: Download bounded archive and verify pinned three-file payload
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.authority.outputs.artifact_id }}
          MAX_ARCHIVE_BYTES: ${{ steps.authority.outputs.max_archive_bytes }}
        shell: bash
        run: |
          set -euo pipefail
          # curl strips Authorization on cross-host redirect; NEVER use --location-trusted.
          # Only the fixed GitHub API route can redirect to its signed HTTPS blob URL.
          curl --fail --silent --show-error --location --max-redirs 3 --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 900 --max-filesize "$MAX_ARCHIVE_BYTES" \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/mutex-solutions/proxcloud/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "${RUNNER_TEMP:?}/vm-artifact.zip"
          # No gh run download, download-artifact extraction, unzip, qemu or guest execution.
          python3 images/vm_publish_stage.py unpack --archive "$RUNNER_TEMP/vm-artifact.zip" \
            --staging-dir "$RUNNER_TEMP/vm-publish-payload" > "$RUNNER_TEMP/vm-publication-plan.json"
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1; official pin reviewed separately
        with:
          version: 1.3.0
      - name: Authenticate for this publication only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Refuse tag replacement, push exact payload and record OCI digest
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, subprocess, sys, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          sys.path.insert(0, str(Path(os.environ['GITHUB_WORKSPACE']) / 'images'))
          import vm_publish_stage as stage
          selected = stage.inputs(*(os.environ[key] for key in stage.ENVIRONMENT))
          payload = str(Path(os.environ['RUNNER_TEMP']) / 'vm-publish-payload')
          plan = stage.publication_plan(payload, selected)  # Rehash immediately before publishing.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise ValueError('Unexpected registry redirect')
          client = urllib.request.build_opener(NoRedirect())
          def request(url, headers):
              try:
                  response = client.open(urllib.request.Request(url, headers=headers), timeout=60)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  body = response.read(65537)
                  stage.require(len(body) <= 65536)
                  return response.status, body
          package = plan['package'].removeprefix('ghcr.io/')
          tag = plan['reference'].split(':', 1)[1]
          basic = base64.b64encode((os.environ['GITHUB_ACTOR'] + ':' + os.environ['GH_TOKEN']).encode()).decode()
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': 'repository:' + package + ':pull,push'})
          status, raw = request('https://ghcr.io/token?' + query, {'Authorization': 'Basic ' + basic})
          stage.require(status == 200)
          token = json.loads(raw)['token']
          stage.require(type(token) is str and 0 < len(token) <= 16384 and '\n' not in token and '\r' not in token)
          status, raw = request('https://ghcr.io/v2/' + package + '/manifests/' + tag, {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'})
          stage.absent_tag(status, raw)  # Existing tag, 401/403, timeout and other failures all stop.
          # Relative payload filenames are source constants; cwd is the verified extraction,
          # NEVER the checkout root. Disk/manifest content is not code, argv or shell input.
          exported = str(Path(os.environ['RUNNER_TEMP']) / 'vm-pushed-manifest.json')
          subprocess.run(stage.push_argv(plan, exported), cwd=payload, check=True, timeout=900, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          # The digest of the manifest THIS push sent, never what the tag resolves to afterwards: another
          # writer moving the tag meanwhile cannot change what gets attested.
          digest = stage.pushed_digest(exported, plan)
          reference = plan['package'] + '@' + digest
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('package=' + plan['package'] + '\ndigest=' + digest + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## VM artifact pushed; attestation and anonymous verification follow in this run\n\n')
              summary.write('OCI reference: `' + reference + '`\n\n')
              summary.write('Manifest SHA256: `' + plan['expected_manifest_sha256'] + '`\n\nDisk SHA256: `' + plan['expected_disk_sha256'] + '`\n\n')
              summary.write('A successful authenticated push is not the release: the `attest` and `verify` jobs of this run must pass. The bytes may already be publicly readable (do not count on a new package being private), and they carry no attestation until `attest` has passed. No latest tag, deployment or provider-pin update.\n')
          print('Pushed the exact three-file VM artifact. OCI digest recorded as a job output and in the job summary.')
          PY
      - name: Remove registry login
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if command -v oras >/dev/null 2>&1; then oras logout ghcr.io; fi
