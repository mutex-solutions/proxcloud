name: docker

# Publishes the ProxCloud images (api, web, admin, sandbox-proxy, sandbox-runtime) to GitHub Container Registry (ghcr.io):
#   push to main   -> tag `dev-<short-sha>` (only when image sources changed; a
#                     docs/README/CHANGELOG/chart-only push is skipped)
#   push a git tag -> that tag name (e.g. v1.2.3) — always builds
#   pull request   -> build only, no push — only the images whose sources the pull request
#                     changes (.github/scripts/ci_changes.py; docs/ci-release.md, "What runs when")
#   manual run     -> build + push from any branch (Actions ▸ docker ▸ Run workflow):
#                     tag `dev-<short-sha>`, or `dev-<image_tag>` if a suffix is given.
#                     Use it to deploy a PR branch to the test environment.
#
# On a `v*` tag, once every image is built the `release` job creates the
# matching GitHub Release (the chart is published in parallel by helm.yml). Its
# notes are the CHANGELOG.md section for that version (if present) followed by
# GitHub's auto-generated commit list. Stable vX.Y.Z releases become latest;
# vX.Y.Z-rc.N releases are explicitly prerelease/non-latest. Other tags fail closed.
#
# On a `v*` tag the `bom-verify` job first runs .github/scripts/bom_verify.py --release: no image is built or
# pushed, and no GitHub Release is created, when the platform BOM is still `-dev`, holds a `pending` digest or a
# `0.0.0+` version, or pins a digest the registry no longer serves. The previous BOMs the images embed
# (deploy/platform/previous/) are compared the same way.
#
# Auth is the built-in GITHUB_TOKEN (packages: write / contents: write) — no
# external secrets.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  # Manual: build + PUSH an on-demand image from any branch (e.g. a PR branch) so it can be
  # deployed to the test environment. Tag defaults to `dev-<short-sha>` like a push to main;
  # set `image_tag` to give the build a memorable name (e.g. `test-metrics`) — it is prefixed
  # with `dev-` so test builds never collide with `v*` release tags.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional tag suffix (published as dev-<suffix>); blank → dev-<short-sha>"
        required: false
        default: ""

jobs:
  # Gate: on a push to main, only rebuild when image-relevant sources changed — a
  # docs / README / CHANGELOG / chart-only push skips the build (output `build`, ignored for
  # tags, PRs and manual runs). Fail-safe: builds when the diff can't be computed.
  # Output `images` is the build matrix: every image, except on a pull request, where it holds
  # the images whose sources the pull request changes (all of them when in doubt).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
      images: ${{ steps.classify.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: python3 .github/scripts/ci_changes.py detect | tee -a "$GITHUB_OUTPUT"
      - id: filter
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"   # new branch / force-push / unknown base → build to be safe
            exit 0
          fi
          if git diff --name-only "$base" "$GITHUB_SHA" | grep -qE '^(cmd/|internal/|pkg/|web/|deploy/seed/|deploy/platform/|deploy/embed\.go$|deploy/(mgmt|dbaas)-cluster/argocd-health\.yaml$|deploy/templates/images\.yaml$|deploy/Dockerfile$|deploy/sandbox-proxy\.Dockerfile$|deploy/sandbox-runtime\.Dockerfile$|go\.mod$|go\.sum$|\.github/workflows/docker\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  # Release gate of the platform BOM (docs/ci-release.md). The job runs on every event so that `build` can need it
  # (a skipped job would skip `build` too); off a tag it only runs the script's offline unit tests. Anonymous pulls,
  # no login, no secret.
  bom-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Unit tests (no network)
        run: python3 -m unittest discover -s .github/scripts/tests -p test_bom_verify.py -v
      - name: Release gate - the BOM is pinned and every pin matches the registries
        if: github.ref_type == 'tag'
        run: python3 .github/scripts/bom_verify.py --release
      - name: Release gate - every pin of the previous BOMs is still served
        if: github.ref_type == 'tag'
        run: |
          for bom in deploy/platform/previous/*.yaml; do
            echo "== $bom"
            python3 .github/scripts/bom_verify.py --release --bom "$bom"
          done

  build:
    needs: [changes, bom-verify]
    # Tags (release) and manual runs always build every image; a push to main builds only when the
    # gate saw image-relevant changes; a pull request builds the images it can affect (none: skipped).
    if: (github.ref_type == 'tag' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.build == 'true') && needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # image, dockerfile, context, build-args per image: IMAGES in .github/scripts/ci_changes.py.
        # proxcloud-sandbox-proxy runs in the sandbox cluster, whose nodes reach the internet and not the
        # mgmt registry: always from here. proxcloud-sandbox-runtime is envd + sandbox-init, installed on
        # every sandbox node by node-setup's init container (SB5).
        include: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: meta
        env:
          MANUAL_TAG: ${{ github.event.inputs.image_tag }}   # kept out of the script text (no ${{ }} splice)
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Validate before any image build/push; read the tag from the environment.
            python3 .github/scripts/release_policy.py >> "$GITHUB_OUTPUT"
          elif [ -n "${MANUAL_TAG}" ]; then
            # Sanitize the operator-supplied suffix: a Docker tag component is [A-Za-z0-9._-];
            # rejecting anything else also blocks newlines (which would inject extra
            # $GITHUB_OUTPUT lines). Fail fast with a clear message rather than a cryptic
            # build error. Always dev-prefixed so it can't shadow a v* release.
            if ! printf '%s' "${MANUAL_TAG}" | grep -qE '^[A-Za-z0-9._-]+$'; then
              echo "::error::image_tag must match [A-Za-z0-9._-]+ (got: '${MANUAL_TAG}')"
              exit 1
            fi
            echo "tag=dev-${MANUAL_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          build-args: ${{ matrix.build-args }}
          # The BuildKit layer cache, in the repository's Actions cache (10 GB, least recently used evicted
          # first). Three rules, measured in #516 (docs/ci-release.md, "The build cache of the product images"):
          # - One scope per image. The legs of this matrix shared the default scope, and a scope holds the
          #   entry of its last writer, so a leg mostly found the layers of another image.
          # - Only a run on main writes. Every run reads main's entries, which keeps them in use; what a
          #   pull request or a tag writes can be read by that pull request or that tag alone, and those
          #   writes (0.5 GB a run for the three Go images) filled the 10 GB and evicted every entry within
          #   hours, main's with them.
          #   An empty cache-to writes nothing; a pull request from a fork or from Dependabot builds the same.
          # - mode=max (every stage's layers) only for proxcloud-sandbox-runtime, whose envd stage (a clone
          #   and a build of a pinned commit, 46 seconds) no source of ours changes. The four others write
          #   mode=min (the layers of the final image): what mode=max adds for them is the Go module and npm
          #   downloads (137 to 201 MB each), which take as long to fetch from the cache as to download
          #   again, and the compile, which every source change rebuilds. A build whose sources did not
          #   change is taken from the cache whole in both modes.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode={0},scope={1}', matrix.image == 'proxcloud-sandbox-runtime' && 'max' || 'min', matrix.image) || '' }}

  # ---- tag v*: create the GitHub Release once every image is built -----------
  # Runs only for a tag push and only after every `build` matrix leg succeeds,
  # so a release never appears before its images exist.
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@v7

      - name: Validate app release tag and compute policy
        id: policy
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python3 .github/scripts/release_policy.py >> "$GITHUB_OUTPUT"

      - name: Assemble release notes
        env:
          RELEASE_VERSION: ${{ steps.policy.outputs.version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          notes="docs/releases/v${version}.md"
          # The release notes written for people (docs/ci-release.md, "Release notes") are
          # the body when the tag has them. A Release body keeps every newline as a line
          # break, which is why the hard-wrapped CHANGELOG.md section is only the fallback.
          if [ -f "$notes" ]; then
            if ! grep -q '[^[:space:]]' "$notes"; then
              echo "::error file=$notes::the release notes file is empty"
              exit 1
            fi
            # GitHub refuses a body over 125000 characters, and --generate-notes adds to it.
            chars="$(LC_ALL=C.UTF-8 wc -m < "$notes")"
            if [ "$chars" -gt 120000 ]; then
              echo "::error file=$notes::$chars characters; a Release body takes at most 120000 here"
              exit 1
            fi
            cp "$notes" /tmp/notes.md
            echo "using $notes as the release body"
            exit 0
          fi
          # Pull the "## [<version>] …" section out of CHANGELOG.md (empty if absent).
          # Literal index() matching avoids awk's bracket-regex escaping pitfalls; the
          # section ends at the next "## " header or the trailing "[link]:" definitions.
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { flag=1; next }
            flag && (index($0, "## ") == 1 || index($0, "[") == 1) { flag=0 }
            flag { print }
          ' CHANGELOG.md > /tmp/notes.md || true
          if [ -s /tmp/notes.md ]; then
            # A stable release is meant to have the file: test_release_notes.py fails without it.
            echo "::warning::no $notes: the hard-wrapped CHANGELOG.md section for $version is the release body"
          else
            echo "no $notes and no CHANGELOG.md section for $version: notes will be auto-generated only"
            : > /tmp/notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.policy.outputs.tag }}
          RELEASE_FLAGS: ${{ steps.policy.outputs.flags }}
        run: |
          set -euo pipefail
          # Policy output contains only fixed flags. Read into an array, never eval.
          # rc.N => --prerelease --latest=false; stable => --latest.
          read -r -a release_flags <<< "$RELEASE_FLAGS"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists — nothing to do."
            exit 0
          fi
          # The body (if any) is pre-pended to GitHub's auto-generated
          # commit/PR notes (--generate-notes).
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes-file /tmp/notes.md \
            --generate-notes \
            --verify-tag \
            "${release_flags[@]}"
