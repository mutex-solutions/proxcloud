name: openssh-backport

# Experimental build evidence only: no installation, registry publication, runtime
# selection, vulnerability ignore/VEX, or merge-clearance claim.
on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/security/openssh/**'
      - 'images/tests/test_openssh_backport_source.py'
      - '.github/workflows/openssh-backport.yml'

permissions:
  contents: read

concurrency:
  group: openssh-backport-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-client:
    name: experimental-openssh-client
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      DEBIAN_BASE: debian:trixie-slim@sha256:7378260c0a098d27ac206225db5e7d92b8c7c84ea7afccc86eeb513756bbd392
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check exact source and source-only guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p result
          printf '%s\n' "$SOURCE_SHA" > result/source-sha.txt
          printf '%s\n' "$DEBIAN_BASE" > result/debian-base.txt
          sh -n deploy/security/openssh/build-backport.sh
          python3 -m unittest discover -s images/tests -p test_openssh_backport_source.py -v
      - uses: docker/setup-buildx-action@v4
      - name: Build authenticated Debian client package without installing it
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --pull \
            --build-arg "DEBIAN_BASE=$DEBIAN_BASE" --target artifacts \
            --output type=local,dest=result/ssh-backport \
            --file deploy/security/openssh/Dockerfile deploy/security/openssh \
            2>&1 | tee result/build.log
          test -s result/ssh-backport/backport-manifest.json
      - name: Preserve experimental build evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experimental-openssh-client-${{ github.event.pull_request.head.sha }}
          path: result/
          if-no-files-found: error
          retention-days: 3
