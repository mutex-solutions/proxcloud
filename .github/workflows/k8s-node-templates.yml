name: k8s-node-templates

# Builds the Kubernetes node templates on a self-hosted runner inside the Proxmox network:
# images/k8s-node-template.sh = kubernetes-sigs/image-builder, then one copy per PVE node.
#
# NEVER add pull_request, pull_request_target or any fork-reachable trigger here: a PR would run its code
# on a machine inside the Proxmox network, holding the image token.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Kubernetes version, e.g. 1.35.10"
        required: true

permissions:
  contents: read

concurrency:
  group: vm-templates
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, proxcloud-pve]
    if: github.repository == 'mutex-solutions/proxcloud'
    timeout-minutes: 240
    # All cluster settings are repository Actions secrets; see .github/pve-actions.env.example.
    env:
      K8S_VERSION: ${{ inputs.version }}
      PVE_URL: ${{ secrets.PVE_URL }}
      PVE_TOKEN_ID: ${{ secrets.PVE_TOKEN_ID }}
      PVE_TOKEN_SECRET: ${{ secrets.PVE_TOKEN_SECRET }}
      PVE_NODES: ${{ secrets.PVE_NODES }}
      PVE_TEMPLATE_STORAGE: ${{ secrets.PVE_TEMPLATE_STORAGE }}
      PVE_ISO_STORAGE: ${{ secrets.PVE_ISO_STORAGE }}
      PVE_BRIDGE: ${{ secrets.PVE_BRIDGE }}
      PVE_BUILD_VLAN: ${{ secrets.PVE_BUILD_VLAN || '0' }}
      # Leave BUILD_DHCP_RANGE unset when the build bridge already has DHCP.
      DHCP_RANGE: ${{ secrets.BUILD_DHCP_RANGE }}
      DHCP_GATEWAY: ${{ secrets.BUILD_GATEWAY }}
    steps:
      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in PVE_URL PVE_TOKEN_ID PVE_TOKEN_SECRET PVE_NODES PVE_TEMPLATE_STORAGE PVE_BRIDGE; do
            value="${!key:-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::Missing required Actions secret: $key"
              missing=1
            fi
          done
          if [[ -n "$DHCP_RANGE" && -z "${DHCP_GATEWAY//[[:space:]]/}" ]]; then
            echo "::error::Missing required Actions secret: BUILD_GATEWAY"
            missing=1
          fi
          if [[ -z "${K8S_VERSION//[[:space:]]/}" ]]; then
            echo "::error::Missing required workflow input: version"
            missing=1
          fi
          if [[ ! "$PVE_BUILD_VLAN" =~ ^(0|[1-9][0-9]{0,3})$ ]] || (( PVE_BUILD_VLAN > 4094 )); then
            echo "::error::PVE_BUILD_VLAN must be 0 (untagged) or an integer from 1 to 4094"
            missing=1
          fi
          if (( missing )); then exit 1; fi
          # Mask each node separately: the full space-separated secret may not match logs.
          for node in $PVE_NODES; do
            echo "::add-mask::$node"
          done
      - uses: actions/checkout@v7
      - name: Build
        run: images/k8s-node-template.sh
