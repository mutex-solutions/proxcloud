name: vm-templates

# Builds the OS templates on a self-hosted runner inside the Proxmox network: images/build.py = vendor
# image -> Packer -> smoke test -> tags -> prune. Publishing is the tag; the portal discovers it.
#
# NEVER add pull_request, pull_request_target or any fork-reachable trigger here: a PR would run its code
# on a machine inside the Proxmox network, holding the image token.
on:
  workflow_dispatch:
    inputs:
      os:
        description: "One OS canary; all explicitly builds four (legacy blank keeps the old two)"
        type: choice
        options: [debian-13, debian-12, ubuntu-2404, ubuntu-2604, all]
        required: false
        default: debian-13
  schedule:
    - cron: "17 3 * * 1" # weekly, for vendor security updates
  push:
    branches: [main]
    paths:
      - "images/packer/**"
      - "images/build.py"

permissions:
  contents: read

concurrency:
  group: vm-templates
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, proxcloud-pve]
    # A fork's push cannot reach this event set, but the repository check keeps the runner off forks of forks.
    if: github.repository == 'mutex-solutions/proxcloud'
    timeout-minutes: 240
    # All cluster settings are repository Actions secrets; see .github/pve-actions.env.example.
    env:
      PVE_URL: ${{ secrets.PVE_URL }}
      PVE_TOKEN_ID: ${{ secrets.PVE_TOKEN_ID }}
      PVE_TOKEN_SECRET: ${{ secrets.PVE_TOKEN_SECRET }}
      PVE_NODES: ${{ secrets.PVE_NODES }}
      PVE_TEMPLATE_STORAGE: ${{ secrets.PVE_TEMPLATE_STORAGE }}
      PVE_IMPORT_STORAGE: ${{ secrets.PVE_IMPORT_STORAGE }}
      PVE_BRIDGE: ${{ secrets.PVE_BRIDGE }}
      PVE_BUILD_VLAN: ${{ secrets.PVE_BUILD_VLAN || '0' }}
      BUILD_IP: ${{ secrets.BUILD_IP }}
      BUILD_GATEWAY: ${{ secrets.BUILD_GATEWAY }}
      BUILD_NAMESERVER: ${{ secrets.BUILD_NAMESERVER }}
    steps:
      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in PVE_URL PVE_TOKEN_ID PVE_TOKEN_SECRET PVE_NODES PVE_TEMPLATE_STORAGE PVE_IMPORT_STORAGE PVE_BRIDGE BUILD_IP BUILD_GATEWAY; do
            value="${!key:-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::Missing required Actions secret: $key"
              missing=1
            fi
          done
          if [[ ! "$PVE_BUILD_VLAN" =~ ^(0|[1-9][0-9]{0,3})$ ]] || (( PVE_BUILD_VLAN > 4094 )); then
            echo "::error::PVE_BUILD_VLAN must be 0 (untagged) or an integer from 1 to 4094"
            missing=1
          fi
          if (( missing )); then exit 1; fi
          # GitHub masks a multi-node secret as one value, not necessarily each node.
          for node in $PVE_NODES; do
            echo "::add-mask::$node"
          done
          echo "::add-mask::${BUILD_IP%%/*}"
      - uses: actions/checkout@v7
      - name: Require full source checkout
        shell: bash
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" sparse-checkout disable
          test "$(git -C "$GITHUB_WORKSPACE" config --bool --get core.sparseCheckout)" = false
          test -f "$GITHUB_WORKSPACE/images/build.py" && test -f "$GITHUB_WORKSPACE/images/packer/template.pkr.hcl"
      - name: Build
        # PVE_NODES is space-separated: one on shared VM disks, all of them on local disks.
        # BUILD_IP is a dedicated free CIDR; optional BUILD_NAMESERVER falls back to BUILD_GATEWAY.
        env:
          OS_CHOICE: ${{ inputs.os }}
        shell: bash
        run: |
          set -euo pipefail
          # Schedule/push and old blank dispatches keep the original two, not four.
          case "$OS_CHOICE" in
            '') OS_LIST='debian-13 ubuntu-2404' ;;
            all) OS_LIST='debian-13 debian-12 ubuntu-2404 ubuntu-2604' ;;
            debian-13|debian-12|ubuntu-2404|ubuntu-2604) OS_LIST="$OS_CHOICE" ;;
            *) echo '::error::Unsupported OS choice'; exit 1 ;;
          esac
          for os in $OS_LIST; do
            for node in $PVE_NODES; do
              python3 images/build.py build --os "$os" --node "$node" --storage "$PVE_TEMPLATE_STORAGE" \
                --import-storage "$PVE_IMPORT_STORAGE" --bridge "$PVE_BRIDGE" --vlan "$PVE_BUILD_VLAN" --build-ip "$BUILD_IP" \
                --build-gateway "$BUILD_GATEWAY" --nameserver "$BUILD_NAMESERVER" | tee -a manifest.jsonl
            done
          done
      - name: Sanitize public manifest
        shell: bash
        run: |
          set -euo pipefail
          # Artifact contents are not secret-masked. Never publish node/VMID/prune details.
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("manifest.jsonl")
          rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          path.write_text("".join(json.dumps({key: row[key] for key in ("os", "built", "version") if key in row}) + "\n" for row in rows))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: templates-${{ github.run_id }}
          path: manifest.jsonl
