name: test

# Go unit tests + the build-tagged integration tests (testcontainers spins
# up a throwaway PostgreSQL; ubuntu-latest runners ship Docker). Runs on push to main
# and on PRs so a regression gates before the image/chart release tags are cut.
# A push to main runs every job. A pull request runs the jobs its changed files can affect
# (job `changes`, .github/scripts/ci_changes.py; docs/ci-release.md, "What runs when").
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Which jobs this event runs. If this job fails, every job below runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go_test: ${{ steps.classify.outputs.go_test }}
      installer: ${{ steps.classify.outputs.installer }}
      spa_smoke: ${{ steps.classify.outputs.spa_smoke }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: python3 .github/scripts/ci_changes.py detect | tee -a "$GITHUB_OUTPUT"

  go-test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go_test == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true
      # The Helm the chart goldens are made with (goldenHelm in internal/cloud/kamaji/chart_golden_test.go).
      - uses: azure/setup-helm@v5
        with:
          version: v3.21.4
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      # The published charts the platform tests render (internal/platformlife/chartcache_test.go): files named by
      # their sha256, hashed against the BOM's digest at every use, so a restored file is trusted no more than a
      # pulled one. The key is the BOMs; a changed BOM restores the newest cache and pulls only what it added.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/proxcloud-test-charts
          key: proxcloud-test-charts-${{ hashFiles('deploy/platform/**/*.yaml') }}
          restore-keys: proxcloud-test-charts-
      - name: Unit tests (including required offline chart renders)
        env:
          CI: "1"
          PROXCLOUD_TEST_CHART_CACHE: ${{ runner.temp }}/proxcloud-test-charts
        run: go test ./...
      # Standard library only. Helm renders the realm and seed files from the chart; the Compose
      # plugin of the runner renders the model and its shellcheck reads the script (all three are
      # required under CI). No container is started.
      - name: Docker Compose production install (chart equality, script dry run)
        env:
          CI: "1"
        run: python3 deploy/tests/test_compose_production.py -v
      - name: Sandbox prepull admission policy (CEL, k8s.io/apiserver, its own module)
        run: |
          python3 -m venv /tmp/iv && /tmp/iv/bin/pip install -q -r installer/requirements.txt
          /tmp/iv/bin/python installer/tests/render_prepull_policy.py /tmp/prepull-policy.yaml
          cd test/policy && POLICY_YAML=/tmp/prepull-policy.yaml go test ./...
      # The UDP load balancer test (TestLBApplianceUDP) needs the kernel's IPVS. With the module loaded here the test
      # must run: it fails instead of skipping. On a runner without the module the run carries a warning, and the lab
      # drill is the gate for UDP listeners.
      - name: Kernel IPVS for the UDP load balancer test
        run: |
          if sudo modprobe ip_vs; then
            echo "LB_UDP_REQUIRE_IPVS=1" >> "$GITHUB_ENV"
          else
            echo "::warning title=UDP load balancer test skipped::this runner's kernel has no IPVS (ip_vs): TestLBApplianceUDP does not run, the lab drill is the gate for UDP listeners"
          fi
      # The guests of the real-guest load balancer tests (test/integration/lb_guest_test.go): the two distribution
      # images with the tests' packages in them, built once per run and named to the tests below, so that no test
      # installs from a distribution mirror while it runs. Two tests stay on the plain image, because the product's
      # own install is what they show: TestLBApplianceServesWhatIsRecorded and TestLBSingleApplianceInstalls.
      # Nothing is pushed: the images are loaded into this runner's Docker and the layers are kept in the Actions
      # cache. REFRESH is the ISO week and part of the package layer's cache key, so the first run of a week
      # installs the distribution's current packages again and a later run takes the layer from the cache.
      # Only a push to main writes the cache: every run reads that one entry, which keeps it in use, and a pull
      # request adds nothing of its own to the repository's 10 GB, of which GitHub evicts the least recently used
      # first. A run that finds no layer (the cache evicted, the first days of a week before main moved, a pull
      # request that changes the Dockerfiles) installs from the mirror, about 70 seconds for both images. The
      # package step tries three times; its failure says "mirror", and then no test has run.
      - uses: docker/setup-buildx-action@v4
      - name: Week of the appliance test images
        id: lb-images
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Appliance test image (Debian 13)
        id: lb-image-debian
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: test/integration/images
          file: test/integration/images/debian-trixie.Dockerfile
          build-args: REFRESH=${{ steps.lb-images.outputs.week }}
          tags: proxcloud-lb-test:debian-trixie
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=lb-test-debian-trixie
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=lb-test-debian-trixie' || '' }}
      - name: Appliance test image (Ubuntu 26.04)
        id: lb-image-ubuntu
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: test/integration/images
          file: test/integration/images/ubuntu-26.04.Dockerfile
          build-args: REFRESH=${{ steps.lb-images.outputs.week }}
          tags: proxcloud-lb-test:ubuntu-26.04
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=lb-test-ubuntu-26.04
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=lb-test-ubuntu-26.04' || '' }}
      - name: Appliance test images not built
        if: ${{ failure() && (steps.lb-image-debian.outcome == 'failure' || steps.lb-image-ubuntu.outcome == 'failure') }}
        run: echo "::error title=Appliance test images not built::The guest images of the load balancer tests did not build, and no integration test has run. A build log that says 'mirror' means the distribution's package mirror did not answer in three tries, which is the mirror and not a test. Run the job again."
      # The versions the tests run against, in every run (a build from the cache prints nothing).
      - name: What the appliance test images hold
        run: |
          for image in proxcloud-lb-test:debian-trixie proxcloud-lb-test:ubuntu-26.04; do
            echo "== $image"
            docker run --rm "$image" cat /etc/proxcloud-lb-test-image
          done
      # 60 minutes: the real-guest load balancer tests are most of it, and TestLBApplianceUDPStopStart alone loops
      # 120 stops and starts of the UDP service in each of two guests (about 10 minutes, the guests side by side).
      - name: Integration tests (testcontainers PostgreSQL)
        env:
          LB_TEST_IMAGE_DEBIAN: proxcloud-lb-test:debian-trixie
          LB_TEST_IMAGE_UBUNTU: proxcloud-lb-test:ubuntu-26.04
        run: |
          go test -tags=integration -timeout 60m ./test/integration/... ./cmd/api/...
          go test -tags=integration ./internal/platform/project -run '^(TestBuildArchiveSurvivesCleanupAndRestart|TestPVESubnetRefreshFollowsTheLiveZone|TestPVEServerRefreshKeepsTheRowIdentity|TestLBPairApplyOrderAndStatus|TestLBCertificatesReachThePair|TestLBClusterStateConverges|TestLBControllerEnable)$'
          go test -tags=integration ./internal/platform/project -run '^TestFunction'

  # tsc and vite build stay green on a bundle that renders a white page, so open the real build.
  spa-smoke:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.spa_smoke != '[]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.spa_smoke || '["client","admin"]') }}
    defaults:
      run:
        working-directory: web/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: web/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
      # No --with-deps: the runner image already has the libraries, and apt fetched the fonts at 20 kB/s.
      - run: npx playwright install --only-shell chromium
      - run: npm run test:smoke

  # Fails on any old-brand string in file contents or file names. The pattern uses
  # character classes so this file never matches itself.
  installer:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.installer == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3
        with:
          version: "1.16.2"
      - name: Validate Packer expressions and plugin configuration (no VM build)
        # packer init asks the GitHub API for the plugin's tags. Unauthenticated, that shares the
        # hosted runner's address-wide limit and fails often; the job token raises the limit.
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        run: bash images/packer/validate.sh
      - name: Check the installer
        working-directory: installer
        run: |
          make test
          .venv/bin/python ../web/tests/test_runtime_baseline.py
          .venv/bin/python ../.github/scripts/tests/test_release_policy.py
          .venv/bin/python ../.github/scripts/tests/test_release_notes.py
          .venv/bin/python ../.github/scripts/tests/test_ci_changes.py
          .venv/bin/python ../deploy/tests/test_clusterctl_image.py
          .venv/bin/python ../deploy/tests/test_sandbox_node_setup.py
          ANSIBLE_CONFIG=ansible.cfg .venv/bin/ansible-playbook -i inventory/example/hosts.yml -e pc_site_dir=/tmp/site -e pc_node=x --syntax-check \
            playbooks/site.yml playbooks/46-rustfs-upgrade.yml playbooks/70-add-node.yml playbooks/71-remove-node.yml
      - name: Check the image pipeline never runs on PR or fork events
        run: |
          python3 -m py_compile images/build.py
          python3 -m unittest discover -s images/tests -v
          ! grep -nE '^\s*(pull_request|pull_request_target|issue_comment|workflow_run):' .github/workflows/vm-templates.yml .github/workflows/k8s-node-templates.yml

  # Reads every tracked file of the repository, documentation included: always runs (about 10 seconds).
  # It searches with git grep, which the runner has: no package is installed, so no package mirror can fail it.
  rebrand-gate:
    runs-on: ubuntu-latest
    env:
      REBRAND_PATTERN: 's[t]ratos|m[e]nlo|o[s]ie|a[c]vile|kamaji-s[y]sadmin'
    steps:
      - uses: actions/checkout@v7
      - name: Check for old-brand strings
        run: |
          if git grep -I -i -n -E "$REBRAND_PATTERN"; then
            echo "::error::old-brand strings found"; exit 1
          fi
          if git ls-files | grep -iE "$REBRAND_PATTERN"; then
            echo "::error::old-brand file names found"; exit 1
          fi
      # Names from the previous cloud backend (the backend is Proxmox VE). Terms match at a
      # word start, so camelCase leftovers are caught too; a few short terms also need a word
      # end to skip ordinary English words. The env-key alternative is case-sensitive.
      # Exclusions: the C4 changelog (history may name the old backend), countries.json
      # (place names that collide with the terms) and vendored upstream manifests (the
      # Kubernetes pod schema names other platforms' in-tree volume plugins).
      - name: Check for previous-backend terms
        env:
          LEGACY_BACKEND_PATTERN: '\b(o[p]enstack|k[e]ystone|n[o]va\b|n[e]utron|g[l]ance|c[i]nder|s[w]ift|o[c]tavia|h[e]at\b|g[n]occhi|c[e]ilometer|b[a]rbican|m[a]nila|m[a]gnum|d[e]signate\b|k[o]lla|v[h]i\b|g[o]phercloud)|(?-i:\bO[S]_(AUTH_URL|REGION_NAME|USERNAME|PASSWORD|USER_DOMAIN_NAME|PROJECT_NAME|PROJECT_DOMAIN_NAME|APPLICATION_CREDENTIAL))'
        run: |
          if git grep -I -i -n -P -e "$LEGACY_BACKEND_PATTERN" -- . \
               ':!docs/architecture/c4/CHANGELOG.md' ':!internal/platform/billing/countries.json' \
               ':!deploy/sandbox-cluster/agent-sandbox' ':!deploy/charts/proxcloud-sandbox/files/agent-sandbox'; then
            echo "::error::previous-backend terms found"; exit 1
          fi
          if git ls-files | grep -i -P -e "$LEGACY_BACKEND_PATTERN"; then
            echo "::error::previous-backend file names found"; exit 1
          fi
