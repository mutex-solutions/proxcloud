# RBAC for the portal's service account on the sandbox cluster (the `sandbox` provider's kubeconfig).
#
# What the portal does here (internal/cloud/sandbox):
#   - project namespaces sb-<projectId>: create (server-side apply) with label proxcloud.io/tenant=true,
#     a ResourceQuota and a LimitRange in them, delete when the project goes
#   - Sandbox CRs (agents.x-k8s.io) and the warm-pool extensions: full CRUD
#   - read pod status (node, phase), exec and logs: the data plane goes through the API server
#   - one CiliumNetworkPolicy per sandbox (its egress), owned by the Sandbox CR
#   - nodes: read, for the GPU capacity answer at create
#
# Cluster-wide by necessity: RBAC cannot wildcard namespaces and the sb-* namespaces are created on
# demand (the same trade-off as deploy/dbaas-cluster/rbac.yaml). It includes pods/exec, so this token
# can run commands in ANY pod of this cluster. Accepted because the cluster is single-purpose: keep
# only platform components without credentials to other systems on it (node-setup, agent-sandbox).
# No secrets: the token cannot read any Secret.
---
apiVersion: v1
kind: Namespace
metadata:
  name: proxcloud-system
  labels:
    app.kubernetes.io/managed-by: proxcloud
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: proxcloud
  namespace: proxcloud-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: proxcloud-sandbox
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Exec over WebSocket is an HTTP GET upgrade: the API server authorizes it as `get` on pods/exec and
  # (Kubernetes >= 1.30, AuthorizePodWebsocketUpgradeCreatePermission) also as `create`. kubectl's SPDY
  # POST needs only `create`, so a kubectl-based check passes with `create` alone while the portal's
  # WebSocket exec gets 403. `kubectl auth can-i create pods/exec` answers no even when it works: ask
  # with `--subresource=exec`.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims", "sandboxtemplates", "sandboxwarmpools"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: proxcloud-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: proxcloud-sandbox
subjects:
  - kind: ServiceAccount
    name: proxcloud
    namespace: proxcloud-system
---
apiVersion: v1
kind: Secret
metadata:
  name: proxcloud-token
  namespace: proxcloud-system
  annotations:
    kubernetes.io/service-account.name: proxcloud
type: kubernetes.io/service-account-token
---
# The proxmox provider's sync job (secret.sandboxKubeconfig): it reads the Nodes to pin each worker's address in its
# VM firewall, and takes the proxcloud.io/unsecured taint off once the firewall is in place (docs/managed-sandbox.md
# §2). Nodes only: no pods, no exec, no Secret.
#
# The NodeRestriction release gate (docs/managed-sandbox.md §3) runs two dry-run Node creates as the node
# `proxcloud-noderestriction-probe`: impersonating that one user and the system:nodes group is all it may impersonate.
# That identity can do what any node can (the Node authorizer): read nodes, services and endpoints, and register a Node
# of that name. The policy at the end of this file refuses it every write that is not a dry run, so a leaked firewall
# token cannot register that Node, take tenant pods onto it or ask for a node certificate. Needs Kubernetes 1.30+.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: proxcloud-firewall
  namespace: proxcloud-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: proxcloud-firewall
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
    resourceNames: ["system:node:proxcloud-noderestriction-probe"]
  - apiGroups: [""]
    resources: ["groups"]
    verbs: ["impersonate"]
    resourceNames: ["system:nodes"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: proxcloud-firewall
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: proxcloud-firewall
subjects:
  - kind: ServiceAccount
    name: proxcloud-firewall
    namespace: proxcloud-system
---
apiVersion: v1
kind: Secret
metadata:
  name: proxcloud-firewall-token
  namespace: proxcloud-system
  annotations:
    kubernetes.io/service-account.name: proxcloud-firewall
type: kubernetes.io/service-account-token
---
# The NodeRestriction probe identity may only dry-run (see the firewall service account above): every create, update,
# delete or connect it sends without dryRun is refused. The probe's own dry runs pass here and are then judged by
# NodeRestriction, which is what the gate reads.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: proxcloud-noderestriction-probe-dry-run-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE", "CONNECT"]
        resources: ["*/*"]
  matchConditions:
    - name: probe-identity
      expression: request.userInfo.username == "system:node:proxcloud-noderestriction-probe"
  validations:
    - expression: has(request.dryRun) && request.dryRun
      message: the proxcloud NodeRestriction probe identity may only dry-run
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: proxcloud-noderestriction-probe-dry-run-only
spec:
  policyName: proxcloud-noderestriction-probe-dry-run-only
  validationActions: ["Deny"]
