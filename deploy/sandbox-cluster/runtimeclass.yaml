# gvisor: every tenant sandbox runs here (runsc, installed by node-setup.yaml). The portal sets
# runtimeClassName itself (internal/cloud/sandbox). The node image already ships the `gvisor` handler
# name in containerd's config imports; node-setup writes the handler's runsc options.
# The `nvidia` class for the GPU device plugin comes with GPU nodes (SB9).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata: {name: gvisor}
handler: gvisor
