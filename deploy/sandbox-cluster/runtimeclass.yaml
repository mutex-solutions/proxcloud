# gvisor: every tenant sandbox runs here (runsc, installed by node-setup.yaml). The portal sets
# runtimeClassName itself (internal/cloud/sandbox). The node image ships only the conf.d import in
# containerd's config; node-setup writes the `gvisor` handler there (conf.d/10-gvisor.toml) and its runsc options.
# The `nvidia` class for the GPU device plugin comes with GPU nodes (SB9).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata: {name: gvisor}
handler: gvisor
