{{- /*
Chart-managed api Secret. Skipped entirely when api.existingSecret is set
(that Secret must then carry: db-url, encryption-key, and sso-client-secret
when auth.sso.enabled). db-read-url is optional, for history/metrics only.
Individual primary keys are skipped when externalPostgresql.existingSecret takes over.
No broker credentials are required or rendered.
*/ -}}
{{- if not .Values.api.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "proxcloud.fullname" . }}-api
  labels:
    {{- include "proxcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
stringData:
  {{- if not .Values.externalPostgresql.existingSecret }}
  db-url: {{ include "proxcloud.dbURL" . | quote }}
  {{- end }}
  {{- if and .Values.cnpg.statusReadReplica (not .Values.externalPostgresql.readExistingSecret) }}
  db-read-url: {{ include "proxcloud.dbReadURL" . | quote }}
  {{- end }}
  {{- if .Values.auth.sso.enabled }}
  sso-client-secret: {{ .Values.auth.sso.clientSecret | required "auth.sso.clientSecret is required when auth.sso.enabled (or use api.existingSecret)" | quote }}
  {{- end }}
  encryption-key: {{ .Values.api.encryptionKey | required "api.encryptionKey is required — set a strong random value (openssl rand -hex 32) or use api.existingSecret; for dev use -f deploy/charts/proxcloud/values-dev.yaml" | quote }}
{{- end }}
