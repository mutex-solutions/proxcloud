apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "proxcloud.fullname" . }}-api
  labels:
    {{- include "proxcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "proxcloud.selector" (dict "ctx" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "proxcloud.selector" (dict "ctx" $ "component" "api") | nindent 8 }}
      annotations:
        checksum/api-secret: {{ include (print $.Template.BasePath "/api/secret.yaml") . | sha256sum }}
        checksum/api-config: {{ include (print $.Template.BasePath "/api/configmap.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # The image runs as uid 10001 (see deploy/Dockerfile).
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
            - name: mgmt
              containerPort: {{ .Values.api.managementPort }}
            {{- if .Values.api.csiGateway.enabled }}
            - name: csi-gateway
              containerPort: {{ .Values.api.csiGateway.port }}
            {{- end }}
          env:
            {{- if .Values.api.csiGateway.enabled }}
            - name: PROXCLOUD_CSI_GATEWAY_ADDR
              value: {{ printf ":%v" .Values.api.csiGateway.port | quote }}
            - name: PROXCLOUD_CSI_GATEWAY_TLS_CERT
              value: /etc/proxcloud/csi-gateway/tls.crt
            - name: PROXCLOUD_CSI_GATEWAY_TLS_KEY
              value: /etc/proxcloud/csi-gateway/tls.key
            - name: PROXCLOUD_CSI_GATEWAY_URL
              value: {{ .Values.api.csiGateway.url | quote }}
            - name: PROXCLOUD_CSI_GATEWAY_CA_FILE
              value: /etc/proxcloud/csi-gateway/ca.crt
            {{- end }}
            {{- include "proxcloud.dbURLEnv" . | nindent 12 }}
            {{- include "proxcloud.dbReadURLEnv" . | nindent 12 }}
            - name: PROXCLOUD_ENCRYPTION_DEFAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "proxcloud.apiSecretName" . }}
                  key: encryption-key
            {{- if .Values.auth.sso.enabled }}
            - name: PROXCLOUD_SSO_KC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "proxcloud.apiSecretName" . }}
                  key: sso-client-secret
            {{- with .Values.auth.sso.reservedDomains }}
            - name: PROXCLOUD_SSO_RESERVED_DOMAINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.auth.sso.allowInternalIdp }}
            - name: PROXCLOUD_SSO_ALLOW_INTERNAL_IDP
              value: "true"
            {{- end }}
            {{- end }}
            {{- with .Values.api.selfUrls.base }}
            - name: PROXCLOUD_SELF_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.selfUrls.api }}
            - name: PROXCLOUD_SELF_API_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.selfUrls.ui }}
            - name: PROXCLOUD_SELF_UI_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.selfUrls.admin }}
            - name: PROXCLOUD_SELF_ADMIN_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.defaultRegion }}
            - name: PROXCLOUD_DEFAULT_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.corsAllowedOrigins }}
            - name: PROXCLOUD_CORS_ALLOWED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.auth.main.issuer }}
            - name: AUTH_MAIN_OAUTH2_ISSUER_URI
              value: {{ .Values.auth.main.issuer | quote }}
            - name: AUTH_MAIN_OAUTH2_CLIENT_ID
              value: {{ .Values.auth.main.clientId | quote }}
            {{- with .Values.auth.main.discoveryUri }}
            - name: AUTH_MAIN_OAUTH2_DISCOVERY_URI
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.auth.admin.issuer }}
            - name: AUTH_ADMIN_OAUTH2_ISSUER_URI
              value: {{ .Values.auth.admin.issuer | quote }}
            - name: AUTH_ADMIN_OAUTH2_CLIENT_ID
              value: {{ .Values.auth.admin.clientId | quote }}
            {{- with .Values.auth.admin.discoveryUri }}
            - name: AUTH_ADMIN_OAUTH2_DISCOVERY_URI
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.auth.adminApi.issuer }}
            - name: AUTH_ADMIN_API_OAUTH2_ISSUER_URI
              value: {{ .Values.auth.adminApi.issuer | quote }}
            - name: AUTH_ADMIN_API_OAUTH2_CLIENT_ID
              value: {{ .Values.auth.adminApi.clientId | quote }}
            {{- with .Values.auth.adminApi.discoveryUri }}
            - name: AUTH_ADMIN_API_OAUTH2_DISCOVERY_URI
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.api.jobs.schedulerEnabled }}
            - name: PROXCLOUD_JOBS_SCHEDULER_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.api.jobs.debugTriggers }}
            - name: PROXCLOUD_JOBS_DEBUG_TRIGGERS
              value: "true"
            {{- end }}
            # Workers always run; scheduler/debug gates do not pause the existing queue.
            - name: PROXCLOUD_JOBS_WORKER_CONCURRENCY
              value: {{ .Values.api.jobs.workerConcurrency | quote }}
            - name: PROXCLOUD_JOBS_POLL_INTERVAL
              value: {{ .Values.api.jobs.pollInterval | quote }}
            - name: PROXCLOUD_JOBS_LEASE_DURATION
              value: {{ .Values.api.jobs.leaseDuration | quote }}
            {{- if .Values.api.billing }}
            {{- if .Values.api.billing.provider }}
            - name: PROXCLOUD_BILLING_PROVIDER
              value: {{ .Values.api.billing.provider | quote }}
            {{- end }}
            {{- if .Values.api.billing.url }}
            - name: PROXCLOUD_BILLING_URL
              value: {{ .Values.api.billing.url | quote }}
            {{- end }}
            {{- if .Values.api.billing.token }}
            - name: PROXCLOUD_BILLING_TOKEN
              value: {{ .Values.api.billing.token | quote }}
            {{- end }}
            {{- if .Values.api.billing.timeout }}
            - name: PROXCLOUD_BILLING_TIMEOUT
              value: {{ .Values.api.billing.timeout | quote }}
            {{- end }}
            {{- if .Values.api.billing.callbackToken }}
            - name: PROXCLOUD_BILLING_CALLBACK_TOKEN
              value: {{ .Values.api.billing.callbackToken | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.api.mail.smtp.host }}
            - name: PROXCLOUD_MAIL_SMTP_HOST
              value: {{ .Values.api.mail.smtp.host | quote }}
            - name: PROXCLOUD_MAIL_SMTP_PORT
              value: {{ .Values.api.mail.smtp.port | quote }}
            - name: PROXCLOUD_MAIL_FROM
              value: {{ .Values.api.mail.from | quote }}
            {{- if .Values.api.mail.smtp.username }}
            - name: PROXCLOUD_MAIL_SMTP_USERNAME
              value: {{ .Values.api.mail.smtp.username | quote }}
            {{- end }}
            {{- if .Values.api.mail.smtp.existingSecret }}
            - name: PROXCLOUD_MAIL_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.mail.smtp.existingSecret | quote }}
                  key: {{ .Values.api.mail.smtp.passwordKey | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.api.mail.businessName }}
            - name: PROXCLOUD_MAIL_BUSINESS_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: mgmt
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: mgmt
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.api.applicationYml .Values.api.extraVolumeMounts .Values.api.csiGateway.enabled }}
          volumeMounts:
            {{- if .Values.api.csiGateway.enabled }}
            - name: csi-gateway-tls
              mountPath: /etc/proxcloud/csi-gateway
              readOnly: true
            {{- end }}
            {{- if .Values.api.applicationYml }}
            - name: app-config
              mountPath: /opt/proxcloud/api/application.yml
              subPath: application.yml
              readOnly: true
            {{- end }}
            {{- with .Values.api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.api.applicationYml .Values.api.extraVolumes .Values.api.csiGateway.enabled }}
      volumes:
        {{- if .Values.api.csiGateway.enabled }}
        # cert-manager renews it in place; the listener reads the files again on a handshake a minute after the last.
        - name: csi-gateway-tls
          secret:
            secretName: {{ include "proxcloud.fullname" . }}-csi-gateway-tls
        {{- end }}
        {{- if .Values.api.applicationYml }}
        - name: app-config
          configMap:
            name: {{ include "proxcloud.fullname" . }}-api-config
        {{- end }}
        {{- with .Values.api.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
