{{- /*
The Keycloak admin password keycloak-config-cli logs in with, from keycloakConfigCli.adminPassword. Skipped when
keycloakConfigCli.existingSecret names a Secret of your own. A plain resource, not a hook, so the bundled Keycloak can
take its bootstrap admin password from the same Secret (values-quickstart.yaml does).
*/ -}}
{{- if and .Values.keycloakConfigCli.enabled (not .Values.keycloakConfigCli.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "proxcloud.kcAdminSecretName" . }}
  labels:
    {{- include "proxcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
type: Opaque
stringData:
  {{ .Values.keycloakConfigCli.passwordKey }}: {{ .Values.keycloakConfigCli.adminPassword | required "keycloakConfigCli.adminPassword (or existingSecret) is required when keycloakConfigCli.enabled" | quote }}
{{- end }}
