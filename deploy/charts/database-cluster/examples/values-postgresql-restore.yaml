---
# =============================================================================
# PostgreSQL RESTORE example — a NEW database bootstrapped from another one's
# object-store folder (restore.sourceId), recovered to a point in time. Backups
# are wired on the new database too, so it archives to its own folder from day
# one. The creds Secret is written by the create path BEFORE the Application.
#   helm template test deploy/charts/database-cluster -f examples/values-postgresql-restore.yaml
# =============================================================================
engine: postgresql
engineVersion: "17"
instances: 3
resources:
  cpu: "2"
  memoryGi: 4
storage:
  sizeGi: 50
  storageClassName: fast
network:
  addressPool: dbaas-services
  allowedCidrs:
    - 192.0.2.0/24
proxcloud:
  projectId: 665f1a2b3c4d5e6f77889900
  resourceId: pc-d-7a8b9c0d
  displayName: orders-db-recovered
backup:
  enabled: true
  schedule: "0 2 * * 0"
  retentionDays: 30
  s3:
    endpoint: http://s3.example.com:9000
    bucket: dbaas-backups
    prefix: backups
    pathStyle: true
    credsSecret: pc-d-7a8b9c0d-backup-s3
restore:
  sourceId: pc-d-1a2b3c4d
  targetTime: "2026-11-01T09:30:00Z"
  credsSecret: pc-d-7a8b9c0d-backup-s3
  s3:
    endpoint: http://s3.example.com:9000
    bucket: dbaas-backups
    prefix: backups
    pathStyle: true
