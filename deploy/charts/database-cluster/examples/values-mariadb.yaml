---
# =============================================================================
# MariaDB example — 3 replicas with operator-managed replication plus the
# chart-owned HAProxy pair the LB targets.
#   helm template test deploy/charts/database-cluster -f examples/values-mariadb.yaml
# =============================================================================
engine: mariadb
engineVersion: "11.4"
instances: 3
resources:
  cpu: "2"
  memoryGi: 4
storage:
  sizeGi: 40
  storageClassName: fast
network:
  addressPool: dbaas-services
  allowedCidrs:
    - 192.0.2.0/24
proxcloud:
  projectId: 665f1a2b3c4d5e6f77889900
  resourceId: pc-d-3c4d5e6f
  displayName: legacy-mariadb
monitoring:
  enabled: false
# Customer-managed access — underscore names pin the '_' -> '-' object-name
# mapping across Database/User/Grant CRs and the password Secret reference.
databases:
  - name: shop_orders
users:
  - name: shop_writer
    databases: [shop_orders]
mariadb:
  parameters:
    max_connections: "300"
  haproxy:
    replicas: 2
    image: docker.io/library/haproxy:3.0-alpine
    cpu: "250m"
    memoryGi: 1
restartedAt: "2026-08-03T00:00:00Z"
# Object-store backup (BuildValues emits this at CREATE whenever the provider has an
# object store). Plain http endpoint on purpose: a lab RustFS needs no TLS.
backup:
  enabled: true
  schedule: "0 2 * * 0"
  retentionDays: 30
  runAt: "20261101-020000"
  s3:
    endpoint: http://s3.example.com:9000
    bucket: dbaas-backups
    prefix: backups
    region: us-east-1
    pathStyle: true
    credsSecret: pc-d-3c4d5e6f-backup-s3
