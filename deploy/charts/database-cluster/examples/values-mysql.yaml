---
# =============================================================================
# MySQL example — Percona Server 8.4, group replication, 3 nodes (the only HA
# size the catalog offers; 1 renders the operator's unsafe-size override).
#   helm template test deploy/charts/database-cluster -f examples/values-mysql.yaml
# =============================================================================
engine: mysql
engineVersion: "8.4"
instances: 3
resources:
  cpu: "4"
  memoryGi: 8
storage:
  sizeGi: 100
  storageClassName: fast
network:
  addressPool: dbaas-services
  allowedCidrs:
    - 192.0.2.0/24
    - 192.0.2.0/24
proxcloud:
  projectId: 665f1a2b3c4d5e6f77889900
  resourceId: pc-d-2b3c4d5e
  displayName: shop-mysql
monitoring:
  enabled: false
mysql:
  parameters:
    max_connections: "500"
  haproxy:
    cpu: "500m"
    memoryGi: 1
restartedAt: ""
# Object-store backup (BuildValues emits this at CREATE whenever the provider has an
# object store). Plain http endpoint on purpose: a lab RustFS needs no TLS.
backup:
  enabled: true
  schedule: "0 2 * * 0"
  retentionDays: 30
  incrementalSchedule: "0 2 * * 1,2,3,4,5,6"
  keepBackups: 4
  runAt: "20261101-020000"
  s3:
    endpoint: http://s3.example.com:9000
    bucket: dbaas-backups
    prefix: backups
    region: us-east-1
    pathStyle: true
    credsSecret: pc-d-2b3c4d5e-backup-s3
