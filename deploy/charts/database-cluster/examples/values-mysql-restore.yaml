---
# =============================================================================
# MySQL RESTORE example — the new cluster comes up empty and a
# PerconaServerMySQLRestore (wave 1) then lays the named backup down. Backups
# are wired on the new database too, so it archives to its own folder from day
# one. The creds Secret is written by the create path BEFORE the Application.
#   helm template test deploy/charts/database-cluster -f examples/values-mysql-restore.yaml
# =============================================================================
engine: mysql
engineVersion: "8.4"
instances: 3
resources:
  cpu: "2"
  memoryGi: 4
storage:
  sizeGi: 50
  storageClassName: fast
network:
  addressPool: dbaas-services
  allowedCidrs:
    - 192.0.2.0/24
proxcloud:
  projectId: 665f1a2b3c4d5e6f77889900
  resourceId: std-8b9c0d1e
  displayName: shop-mysql-recovered
backup:
  enabled: true
  schedule: "0 2 * * 0"
  retentionDays: 30
  s3:
    endpoint: http://s3.example.com:9000
    bucket: dbaas-backups
    prefix: backups
    pathStyle: true
    credsSecret: std-8b9c0d1e-backup-s3
restore:
  sourceId: std-2b3c4d5e
  backupName: std-2b3c4d5e-scheduled-20261101
  targetTime: "2026-11-01T09:30:00Z"
  credsSecret: std-8b9c0d1e-backup-s3
  s3:
    endpoint: http://s3.example.com:9000
    bucket: dbaas-backups
    prefix: backups
    pathStyle: true
mysql:
  haproxy:
    cpu: "500m"
    memoryGi: 1
