---
# =============================================================================
# MariaDB RESTORE example — bootstrapFrom the source's PhysicalBackup folder;
# with pitr the source's archived binlogs are replayed up to targetTime. Backups
# are wired on the new database too, so it archives to its own folder from day
# one. The creds Secret is written by the create path BEFORE the Application.
#   helm template test deploy/charts/database-cluster -f examples/values-mariadb-restore.yaml
# =============================================================================
engine: mariadb
engineVersion: "11.4"
instances: 3
resources:
  cpu: "2"
  memoryGi: 4
storage:
  sizeGi: 50
  storageClassName: fast
network:
  addressPool: dbaas-services
  allowedCidrs:
    - 192.0.2.0/24
proxcloud:
  projectId: 665f1a2b3c4d5e6f77889900
  resourceId: pc-d-9c0d1e2f
  displayName: legacy-mariadb-recovered
backup:
  enabled: true
  schedule: "0 2 * * 0"
  retentionDays: 30
  s3:
    endpoint: http://s3.example.com:9000
    bucket: dbaas-backups
    prefix: backups
    pathStyle: true
    credsSecret: pc-d-9c0d1e2f-backup-s3
restore:
  sourceId: pc-d-3c4d5e6f
  targetTime: "2026-11-01T09:30:00Z"
  pitr: true
  credsSecret: pc-d-9c0d1e2f-backup-s3
  s3:
    endpoint: http://s3.example.com:9000
    bucket: dbaas-backups
    prefix: backups
    pathStyle: true
