---
# =============================================================================
# Valkey example — BETA engine: the CRD in templates/valkey/valkey.yaml is
# unverified (see its header) and the engine ships behind the provider beta
# flag. This example exists so CI keeps the template rendering while it waits.
#   helm template test deploy/charts/database-cluster -f examples/values-valkey.yaml
# =============================================================================
engine: valkey
engineVersion: "9.0"
instances: 3
resources:
  cpu: "1"
  memoryGi: 2
storage:
  sizeGi: 10
  storageClassName: fast
network:
  addressPool: dbaas-services
  allowedCidrs:
    - 192.0.2.0/24
proxcloud:
  projectId: 665f1a2b3c4d5e6f77889900
  resourceId: pc-d-4d5e6f70
  displayName: session-cache
monitoring:
  enabled: false
valkey:
  parameters: {}
restartedAt: ""
# Customer-declared ACL users (MANAGE_ACCESS) — rendered onto the
# ValkeyCluster's spec.users next to `default`; the underscore name pins the
# '_' -> '-' Secret-name mapping.
users:
  - name: cache_writer
