---
# =============================================================================
# Valkey example — BETA engine: the CRD in templates/valkey/valkey.yaml is
# unverified (see its header) and the engine ships behind the provider beta
# flag. This example exists so CI keeps the template rendering while it waits.
#   helm template test deploy/charts/database-cluster -f examples/values-valkey.yaml
# =============================================================================
engine: valkey
engineVersion: "8.1"
instances: 3
resources:
  cpu: "1"
  memoryGi: 2
storage:
  sizeGi: 10
  storageClassName: proxmox-csi
network:
  allowedCidrs:
    - 10.30.0.0/16
proxcloud:
  projectId: 665f1a2b3c4d5e6f77889900
  resourceId: std-4d5e6f70
  displayName: session-cache
monitoring:
  enabled: false
valkey:
  parameters: {}
restartedAt: ""
