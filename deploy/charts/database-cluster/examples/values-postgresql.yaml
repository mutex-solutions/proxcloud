---
# =============================================================================
# PostgreSQL example — the shape internal/cloud/dbaas/values.go BuildValues
# emits for an HA PostgreSQL 17. Rendered by CI (bare chart defaults fail by
# design — engine is required).
#   helm template test deploy/charts/database-cluster -f examples/values-postgresql.yaml
# =============================================================================
engine: postgresql
engineVersion: "17"
instances: 3
resources:
  cpu: "2"
  memoryGi: 4
storage:
  sizeGi: 50
  storageClassName: proxmox-csi
network:
  allowedCidrs:
    - 10.20.0.0/24
proxcloud:
  projectId: 665f1a2b3c4d5e6f77889900
  resourceId: std-1a2b3c4d
  displayName: orders-db
monitoring:
  enabled: true
postgresql:
  parameters:
    max_connections: "200"
    shared_buffers: 1GB
  superuserAccess: false
restartedAt: ""
# Exercises templates/autoscale/vpa.yaml in CI — the other examples leave the
# block absent (renders nothing), matching a real pre-opt-in values document.
autoscale:
  enabled: true
  maxCpu: 4
  maxMemoryGi: 8
  maxStorageGi: 100
