---
# =============================================================================
# PostgreSQL example — the shape internal/cloud/dbaas/values.go BuildValues
# emits for an HA PostgreSQL 17. Rendered by CI (bare chart defaults fail by
# design — engine is required).
#   helm template test deploy/charts/database-cluster -f examples/values-postgresql.yaml
# =============================================================================
engine: postgresql
engineVersion: "17"
instances: 3
resources:
  cpu: "2"
  memoryGi: 4
storage:
  sizeGi: 50
  storageClassName: fast
network:
  addressPool: dbaas-services
  allowedCidrs:
    - 192.0.2.0/24
proxcloud:
  projectId: 665f1a2b3c4d5e6f77889900
  resourceId: pc-d-1a2b3c4d
  displayName: orders-db
monitoring:
  enabled: true
# Customer-managed access (MANAGE_ACCESS). Underscore names on purpose: they are
# legal SQL identifiers, and CI pins that every derived k8s object name maps
# '_' -> '-' (Secret <id>-u-keycloak-stag, Database CR <id>-db-keycloak-stag).
databases:
  - name: keycloak_stag
    owner: keycloak_stag
users:
  - name: keycloak_stag
    databases: [keycloak_stag]
  - name: analytics_ro
    databases: [keycloak_stag]
    inRoles: [keycloak_stag]
postgresql:
  parameters:
    max_connections: "200"
    shared_buffers: 1GB
  # Left at the chart default (true = the customer gets the real `postgres` role).
  # Set false to hand out CNPG's scoped `app` role instead.
restartedAt: ""
# Exercises templates/autoscale/vpa.yaml in CI — the other examples leave the
# block absent (renders nothing), matching a real pre-opt-in values document.
autoscale:
  enabled: true
  maxCpu: 4
  maxMemoryGi: 8
  maxStorageGi: 100
# Object-store backup (BuildValues emits this at CREATE whenever the provider has an
# object store). Plain http endpoint on purpose: a lab RustFS needs no TLS.
backup:
  enabled: true
  schedule: "0 2 * * 0"
  retentionDays: 30
  runAt: "20261101-020000"
  s3:
    endpoint: http://s3.example.com:9000
    bucket: dbaas-backups
    prefix: backups
    region: us-east-1
    pathStyle: true
    credsSecret: pc-d-1a2b3c4d-backup-s3
