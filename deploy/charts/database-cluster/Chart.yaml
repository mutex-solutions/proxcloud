apiVersion: v2
appVersion: "0.1.0"
description: >-
  Helm chart for a single ProxCloud-managed database cluster on the ops-built
  DBaaS Kubernetes cluster. One chart, seven engines: values.engine selects
  which operator CR is rendered (CloudNativePG Cluster, Percona
  PerconaServerMySQL, mariadb-operator MariaDB + a chart-owned HAProxy,
  valkey-operator Valkey, FerretDB = CNPG backend + frontend Deployment,
  opensearch-k8s-operator OpenSearchCluster, or Strimzi Kafka + KafkaNodePool
  + KafkaUser). Every engine additionally gets a LoadBalancer Service whose
  address MetalLB assigns from the provider's address pool (EXCEPT kafka,
  where Strimzi creates the bootstrap + per-broker LBs itself) and a
  NetworkPolicy. Object-store backups, restore into a new database,
  customer-managed databases/users and runtime parameters are all rendered
  from the same values document.
name: database-cluster
type: application
# THE VALUES CONTRACT IS OWNED JOINTLY WITH internal/cloud/dbaas/values.go.
# ProxCloud never templates this chart itself: BuildValues produces the values
# document and writes it into an ArgoCD Application (spec.source.helm.valuesObject)
# pointing at the published chart. TestBuildValues pins every key this chart
# reads — change a key here and you MUST change BuildValues (and its test) in
# the same PR, then release a new chart version and move the provider pin
# (config.argocd.chartVersion). Secrets NEVER travel through values: the
# Application CR is readable by anyone with argocd access.
#
# engineVersion→image maps live in templates/_helpers.tpl and are ops-updatable
# per chart release (bump images -> bump version -> re-pin).
#
# 0.5.0 adds, on top of 0.4.0:
#   * network.addressPool: the MetalLB pool annotation on EVERY tenant-facing LB
#     Service (<id>-lb, <id>-ro-lb, <id>-dash-lb, the Strimzi bootstrap + brokers).
#     The tenant-network wiring (networkId / subnetId / memberSubnetId) is gone.
#   * scheduling.zoneKey (default topology.kubernetes.io/zone): with instances > 1
#     the replicas of every engine spread across it as a HARD anti-affinity.
#   * object-store backup (CNPG barman-cloud plugin ObjectStore, Percona storages,
#     mariadb PhysicalBackup + PITR) and restore into a NEW database (CNPG recovery,
#     mariadb bootstrapFrom, mysql PerconaServerMySQLRestore).
#   * customer-managed databases/users (postgresql, mariadb, opensearch, valkey),
#     opensearch roles + ISM retention policies and a BYO Dashboards certificate.
#   * the postgresql read-only LB (<id>-ro-lb) and the shared-proxy read port (3307)
#     for mysql / mariadb.
#   * postgresql runs with enableSuperuserAccess (the connection panel serves
#     <id>-superuser) and mariadb's `app` user is granted ALL PRIVILEGES.
#   * scheduling.nodeSelector / tolerations for a dedicated database node pool.
#   * valkey is 9.x only (valkey-operator v0.4 writes a 9.0+ directive into every
#     config); valkey and opensearch pod selectors use the labels the operators
#     actually stamp (valkey.io/cluster, opensearch.org/*); the valkey ACL users get
#     explicit permissions; the mysql CR carries a backup image; every object name
#     derived from a customer identifier maps '_' to '-'.
version: 0.5.0
