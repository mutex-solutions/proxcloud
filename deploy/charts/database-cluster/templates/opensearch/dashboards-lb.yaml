{{- if and (eq .Values.engine "opensearch") .Values.opensearch.dashboards.enabled }}
{{/*
Optional SECOND chart-owned LB <id>-dash-lb: the Dashboards UI on 5601, same
LoadBalancer wiring (and the same allowedCidrs source filter) as the main
<id>-lb in service-lb.yaml. TCP passthrough — Dashboards serves its own
operator-generated TLS (spec.dashboards.tls in opensearchcluster.yaml).

TODO-verify(drill): the SELECTOR. The operator labels the Dashboards
Deployment pods; best-known pair below is the cluster label plus the
dashboards deployment label (opensearch.cluster.dashboards). If the drill
shows dashboards pods do NOT carry opster.io/opensearch-cluster, drop that
line and select on the dashboards label alone — and re-check the
NetworkPolicy podSelector caveat in templates/networkpolicy.yaml.
*/}}
{{- $name := include "database-cluster.name" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-dash-lb
  labels:
    {{- include "database-cluster.labels" . | nindent 4 }}
  annotations:
    {{- include "database-cluster.annotations" . | nindent 4 }}
    {{- with .Values.network.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: LoadBalancer
  {{- with .Values.network.allowedCidrs }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: dashboards
      port: 5601
      targetPort: 5601
      protocol: TCP
  selector:
    opster.io/opensearch-cluster: {{ $name }}
    opensearch.cluster.dashboards: {{ $name }}
{{- end }}
