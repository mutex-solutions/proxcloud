apiVersion: v2
name: proxmox-kamaji-cluster
description: One tenant Kubernetes cluster on Proxmox VE. A Kamaji hosted control plane, CAPMOX worker VMs, Cilium, proxmox-csi, MetalLB and, from 0.1.17, the product load balancer's controller, from 0.1.18 a node group's own pool, address range and DNS servers and the sandbox chart for the platform's sandbox cluster. With controlPlane.kind kubeadm, the platform cluster of managed services instead.
