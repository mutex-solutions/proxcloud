{{- /*
kubeadm mode (controlPlane.kind kubeadm): the platform's own workload cluster of managed services, never a tenant's. Its
control plane is one CAPMOX VM or three, as installer stage 50 builds the services cluster with one
(installer/playbooks/templates/services-cluster.yml.j2, which internal/cloud/kamaji/chart_kubeadm_test.go compares with
this file): kube-vip as a static pod holds controlPlane.kubeadm.endpoint, the ProxmoxCluster's endpoint (cluster.yaml).

controlPlane.kubeadm.replicas is 1 or 3 (from chart 0.1.14; before, always 1). The machine template is pinned to one
PVE node (a clone to local storage stays on its template's node, and CAPMOX v0.9.2 has one template for the whole
control plane), so three replicas share that node and its store: they survive the loss of one control plane VM and a
rollout without an API gap, not the loss of the node or of its disk. The template's name carries a hash of its spec, as
in node-groups.yaml, so a changed flavor or image rolls the control plane instead of failing on an immutable template;
the replica count is not in it, so going from 1 to 3 adds two machines and replaces none. A rollout makes one machine
more before it removes one (Cluster API's maxSurge 1), so the node needs memory for replicas + 1: CAPMOX refuses a
clone that does not fit by its count of configured memory, and never tries that machine again.

kube-vip keeps the address by a lease it renews on the API server (vip_leaseduration, vip_renewdeadline and
vip_retryperiod, in seconds; kube-vip v0.8.9 pkg/kubevip/config_envvar.go, defaults 15, 10 and 2). When one renewal
does not finish within the renew deadline it takes the address off the interface and exits ("lost leadership,
restarting kube-vip", pkg/cluster/clusterLeaderElection.go), and every client of the API loses its connection. With one
control plane machine nobody else can take the lease, so the values are 60, 40 and 5: client-go tries the renewal again
for 40 seconds (controlPlane.kubeadm.vipLease holds the three values; changing one rolls the control plane). With three
machines another one can take the lease, and a holder that dies without releasing it leaves the address unheld for up
to the lease duration: which values suit three members on one store was not measured, so the defaults stay those of
one. kube-vip's client cuts every request at 10 seconds (pkg/k8s/client.go, defaultTimeout), so the address is
kept when one try in those 40 seconds gets through in under 10 (a lab measured one write of 19.5: the next try can pass),
not through an etcd whose every write takes longer. The same machine takes its own lease again at once
after a restart; another machine (a rollout) waits up to 60 seconds for a holder that did not release it.

That wait is why machineTemplate.spec.deletion.nodeDeletionTimeoutSeconds is set (nodeDeletionTimeoutSeconds, from
chart 0.1.16; KubeadmControlPlane v1beta2, Cluster API v1.14.4 api/controlplane/kubeadm/v1beta2/
kubeadm_control_plane_types.go:521 and 562). Cluster API deletes a Machine's Node last, after the drain and after the
VM is gone, tries for 10 seconds at a time and gives up for good once the Machine has been in deletion for longer than
the timeout (core/reconcilers/machine/machine_controller.go:660-677; the Machine's default is 10). With one control
plane machine the VM that is stopped held the address, so the API answers again only when the new machine has taken
the lease: a lab measured 65 seconds without the API from the removal of the old etcd member, and 2 minutes 47 seconds
from the start of the deletion (the drain counts). The Node of the old machine then stays in the cluster, NotReady,
with no Machine. 1800 seconds cover a drain of half an hour, which is as long as an upgrade run waits for a machine
before it fails; it is not 0 (no limit) because a Machine of a cluster whose API never answers again would then never
be removed. The value is copied to the Machines in place, also to one already in deletion, and is not part of the
rollout decision (controlplane/kubeadm/reconcilers/kubeadmcontrolplane/kubeadmcontrolplane_controller.go:876-892,
controlplane/kubeadm/pkg/filters.go:122-178): no machine is replaced for it. The lease is not shortened instead: a
changed lease value is in the kube-vip static pod, so it replaces every control plane machine, and a short lease drops
the address of a single control plane whenever its etcd is slow for longer than the renew deadline, which the 60, 40
and 5 are there to ride out.

The kubelet's node-ip is the machine's own address, which only the machine knows (CAPMOX's cloud-init metadata has the
instance id and the hostname, no address): the prepare script writes it over __NODE_IP__ in kubeadm's configuration
before kubeadm runs. Without it the node registers the kube-vip address as its InternalIP.

The API server enables PodNodeSelector and PodTolerationRestriction next to kubeadm's NodeRestriction (the flag replaces
kubeadm's own value): a namespace's scheduler.alpha.kubernetes.io/node-selector and defaultTolerations then place every
pod in it, whatever chart created the pod.
*/ -}}
{{- if include "pkc.kubeadm" . }}
{{- $cp := .Values.controlPlane.kubeadm }}
{{- $net := .Values.proxmox.network }}
{{- $endpoint := required "controlPlane.kubeadm.endpoint is required with controlPlane.kind kubeadm" $cp.endpoint }}
{{- $kv := splitList "=" (required "controlPlane.kubeadm.machineImageId is required" $cp.machineImageId) }}
{{- if ne (len $kv) 2 }}
{{- fail (printf "controlPlane.kubeadm.machineImageId %q is not <node>=<vmid> (one node)" $cp.machineImageId) }}
{{- end }}
{{- if not $cp.machineTags }}
{{- fail "controlPlane.kubeadm.machineTags is required" }}
{{- end }}
{{- $replicas := int ($cp.replicas | default 1) }}
{{- if not (has $replicas (list 1 3)) }}
{{- fail (printf "controlPlane.kubeadm.replicas %d is not 1 or 3" $replicas) }}
{{- end }}
{{- $lease := $cp.vipLease | default dict }}
{{- $node := index $kv 0 }}
{{- $machine := dict "sourceNode" $node "templateID" (int (index $kv 1)) "allowedNodes" (list $node) "storage" .Values.proxmox.storage "format" "raw" "full" true "pool" .Values.proxmox.pool "checks" (dict "skipCloudInitStatus" true) "tags" $cp.machineTags "numSockets" 1 "numCores" (int $cp.machineCores) "memoryMiB" (int $cp.machineMemoryMiB) "disks" (dict "bootVolume" (dict "disk" "scsi0" "sizeGb" (int $cp.machineRootVolume.diskSize))) }}
{{- $device := dict "name" "net0" "bridge" $net.bridge "model" "virtio" }}
{{- if $net.mtu }}{{- $_ := set $device "linkMtu" (int $net.mtu) }}{{- $_ := set $device "mtu" 1 }}{{- end }}
{{- if $net.vlan }}{{- $_ := set $device "vlan" (int $net.vlan) }}{{- end }}
{{- $_ := set $machine "network" (dict "networkDevices" (list $device)) }}
{{- $mtName := printf "%s-cp-%s-%s" .Release.Name $node (toJson $machine | sha256sum | trunc 8) }}
{{- $kubelet := list (dict "name" "provider-id" "value" "proxmox://'{{ ds.meta_data.instance_id }}'") (dict "name" "node-ip" "value" "__NODE_IP__") (dict "name" "node-labels" "value" (printf "topology.kubernetes.io/region=%s,topology.kubernetes.io/zone=%s" .Values.proxmox.region $node)) }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: {{ $mtName }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  template:
    spec: {{ toJson $machine }}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: {{ .Release.Name }}-cp
spec:
  replicas: {{ $replicas }}
  version: {{ printf "v%s" (.Values.kubernetesVersion | trimPrefix "v") | quote }}
  machineTemplate:
    spec:
      infrastructureRef: {apiGroup: infrastructure.cluster.x-k8s.io, kind: ProxmoxMachineTemplate, name: {{ $mtName }}}
      {{- if ge (int .Values.nodeDeletionTimeoutSeconds) 0 }}
      deletion: {nodeDeletionTimeoutSeconds: {{ int .Values.nodeDeletionTimeoutSeconds }}}
      {{- end }}
  kubeadmConfigSpec:
    clusterConfiguration:
      apiServer:
        certSANs: {{ toJson (prepend ($cp.certSANs | default list) $endpoint) }}
        extraArgs:
          - {name: enable-admission-plugins, value: "NodeRestriction,PodNodeSelector,PodTolerationRestriction"}
    files:
      - path: /etc/kubernetes/manifests/kube-vip.yaml
        owner: root:root
        content: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: kube-vip
            namespace: kube-system
          spec:
            containers:
            - args: ["manager"]
              env:
              - {name: cp_enable, value: "true"}
              - {name: vip_interface, value: ""}
              - {name: address, value: "{{ $endpoint }}"}
              - {name: port, value: "6443"}
              - {name: vip_arp, value: "true"}
              - {name: vip_leaderelection, value: "true"}
              - {name: vip_leaseduration, value: {{ $lease.duration | default 60 | toString | quote }}}
              - {name: vip_renewdeadline, value: {{ $lease.renewDeadline | default 40 | toString | quote }}}
              - {name: vip_retryperiod, value: {{ $lease.retryPeriod | default 5 | toString | quote }}}
              image: {{ required "controlPlane.kubeadm.kubeVipImage is required" $cp.kubeVipImage }}
              imagePullPolicy: IfNotPresent
              name: kube-vip
              securityContext:
                capabilities:
                  add: [NET_ADMIN, NET_RAW]
              volumeMounts:
              - {mountPath: /etc/kubernetes/admin.conf, name: kubeconfig}
            hostAliases:
            - {hostnames: [localhost, kubernetes], ip: 127.0.0.1}
            hostNetwork: true
            volumes:
            - name: kubeconfig
              hostPath: {path: /etc/kubernetes/admin.conf, type: FileOrCreate}
      - path: /etc/kube-vip-prepare.sh
        owner: root:root
        permissions: "0700"
        content: |
          #!/bin/bash
          set -e
          # kubeadm init has no admin.conf with rights yet: kube-vip uses super-admin.conf until then.
          if [[ -f /run/kubeadm/kubeadm.yaml ]]; then
            sed -i 's#path: /etc/kubernetes/admin.conf#path: /etc/kubernetes/super-admin.conf#' /etc/kubernetes/manifests/kube-vip.yaml
          fi
          # The kubelet gets the machine's own address as its node-ip. Without one it registers the first address of
          # the interface, and kube-vip puts the API address on that interface. Cloud-init's metadata has no address,
          # so it is read here, before kube-vip runs, and written over the placeholder in kubeadm's configuration.
          ip=$(ip -4 -o route get 1.0.0.0 | sed -n 's/.* src \([0-9.]*\).*/\1/p')
          [[ -n "$ip" ]]
          for f in /run/kubeadm/kubeadm.yaml /run/kubeadm/kubeadm-join-config.yaml; do
            if [[ -f $f ]]; then sed -i "s/__NODE_IP__/$ip/" "$f"; fi
          done
    preKubeadmCommands: [/etc/kube-vip-prepare.sh]
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs: {{ toJson $kubelet }}
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs: {{ toJson $kubelet }}
{{- end }}
