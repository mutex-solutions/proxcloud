{{- /*
One MachineDeployment per node group and PVE node. PVE clones to local storage only on the template's own
node, so a group is pinned: each entry of machineImageId (<node>=<vmid>) gets its own machine template, and
machineCount is split evenly across the entries, the first ones taking the remainder. The zone label comes
from the same pin, which is why no cloud controller manager is needed for topology.

machinePlacement (<node>: <replicas>, from chart 0.1.13) replaces the even split for a group that carries it: the
portal decides it by the free memory, CPU and storage of each node and keeps it stable, so a re-render never moves
a running worker. A node it does not name gets 0. A map whose sum is not machineCount, or that names a node without
an image, fails the render instead of deleting workers. Without the key the split is the even one, unchanged.

Machine and bootstrap templates are immutable in CAPI: their names carry a hash of their spec, so a changed
flavor or image rolls the nodes instead of silently applying to new machines only.

machineLabels go on the Machines, and CAPI copies those under node-restriction.kubernetes.io/ (also node-role.kubernetes.io/,
node.cluster.x-k8s.io/) onto the Node from the management side. A kubelet cannot set or change those under NodeRestriction,
unlike nodeLabels (its own --node-labels), so a workload may trust them to pick a node group.

skipCloudInitStatus: CAPMOX reads cloud-init's status with agent exec, which PVE 9 only allows with
VM.GuestAgent.Unrestricted, root in every guest of the pool. The Node joining is the real signal anyway.

machineHealthCheck (from chart 0.1.14): with the check skipped a failed kubeadm join is invisible to Cluster API and
kubeadm runs once, so a worker that did not join stays for ever. nodeStartupTimeoutSeconds above 0 renders one
MachineHealthCheck per node group (over all its MachineDeployments) that replaces a Machine without a Node after
that time, while at most maxUnhealthy of the group are unhealthy. The guard is capped at machineCount - 1: when every
machine of a group is unhealthy the cause is the site's (image, route to the endpoint), a new clone fails the same
way, and nothing is replaced. So a group of one gets no MachineHealthCheck. values.yaml states what the guard does
not do. ArgoCD is told to leave the object out of the Application's health: its own health is "as many healthy as
expected", which is false while any machine is still starting.

kubernetesVersions (<node>: <version>, from chart 0.1.15) gives the MachineDeployment of that node another Kubernetes
version than the cluster's, and deleteFirstOn (a list of nodes, from chart 0.1.15) makes the MachineDeployments of
those nodes replace a machine by deleting it first (maxSurge 0, maxUnavailable 1) where the node has no room for one
more. Both are for the platform cluster, whose upgrade run moves one MachineDeployment at a time; both are read for the
MachineDeployment only and are in no machine or bootstrap template, so neither changes a template's name. Without
them the render is that of 0.1.14: the cluster's version, and Cluster API's own rollout (one more machine first, none
unavailable).

nodeDeletionTimeoutSeconds (from chart 0.1.16) is template.spec.deletion.nodeDeletionTimeoutSeconds of every
MachineDeployment (MachineDeployment v1beta2, Cluster API v1.14.4 api/core/v1beta2/machine_types.go:490 and 531): how
long Cluster API keeps trying to delete the Node of a Machine it removes, counted from the start of the Machine's
deletion, the drain included; its own default is 10 seconds, after which the Node stays in the cluster with no Machine.
control-plane-kubeadm.yaml has the reason for the value. Cluster API copies it to the MachineSets and the Machines in
place and leaves it out of the rollout decision (core/reconcilers/machineset/machineset_controller.go:654-673,
core/reconcilers/machinedeployment/mdutil/util.go:416-442), and it is in no machine or bootstrap template: no machine
is replaced for it. A negative value renders nothing, which is the render of 0.1.15.

pool, addresses and dnsServers (from chart 0.1.18) give one node group a Proxmox pool, an address range and DNS servers
of its own: the platform's sandbox group, whose VMs the sync fences by their pool and whose range is a sandbox network
of the isolation rules. pool replaces proxmox.pool in the group's machine template. addresses renders an
InClusterIPPool <release>-<group> (the network's prefix and gateway) and points net0 at it with defaultIPv4 false, so a
machine takes one address from the group's range and none from the cluster's (CAPMOX v0.9.2 claims the cluster pool
only for a device with defaultIPv4, and defaults it to true only when no device sets it). dnsServers goes on net0 and
replaces the cluster's for that group. Each key is part of the group's machine template: setting it replaces the
group's machines. A group without them renders what 0.1.17 rendered, template names included.
*/ -}}
{{- $root := . }}
{{- $net := .Values.proxmox.network }}
{{- $mhc := .Values.machineHealthCheck | default dict }}
{{- $startup := $mhc.nodeStartupTimeoutSeconds | default 0 }}
{{- if not (regexMatch "^[0-9]+$" (toString $startup)) }}
{{- fail (printf "machineHealthCheck.nodeStartupTimeoutSeconds %q: a whole number of seconds, 0 for no health check" (toString $startup)) }}
{{- end }}
{{- if and (gt (int $startup) 0) (not (regexMatch "^[1-9][0-9]*$" (toString $mhc.maxUnhealthy))) }}
{{- fail (printf "machineHealthCheck.maxUnhealthy %q: a whole number, 1 or more (a percentage is rounded down to 0 for a small group)" (toString $mhc.maxUnhealthy)) }}
{{- end }}
{{- range $ng := .Values.nodeGroups }}
{{- if not (regexMatch "^[a-z][a-z0-9-]+[a-z0-9]$" $ng.name) }}
{{- fail (printf "node group name %q: lower-case letters, digits and dashes, 3+ characters" $ng.name) }}
{{- end }}
{{- if $ng.autoscale }}
{{- fail (printf "node group %q: autoscale is not supported by this chart" $ng.name) }}
{{- end }}
{{- $pins := splitList "," (required (printf "node group %s: machineImageId is required" $ng.name) $ng.machineImageId) }}
{{- $n := len $pins }}
{{- $count := int $ng.machineCount }}
{{- $placement := $ng.machinePlacement | default dict }}
{{- if $placement }}
{{- $pinNodes := list }}
{{- range $pin := $pins }}{{- $pinNodes = append $pinNodes (index (splitList "=" $pin) 0) }}{{- end }}
{{- $sum := 0 }}
{{- range $pnode, $pn := $placement }}
{{- if not (has $pnode $pinNodes) }}
{{- fail (printf "node group %s: machinePlacement names node %q, which machineImageId has no image on" $ng.name $pnode) }}
{{- end }}
{{- if lt (int $pn) 0 }}
{{- fail (printf "node group %s: machinePlacement of node %q is negative" $ng.name $pnode) }}
{{- end }}
{{- $sum = add $sum (int $pn) }}
{{- end }}
{{- if ne (int $sum) $count }}
{{- fail (printf "node group %s: machinePlacement places %d machines, machineCount is %d" $ng.name (int $sum) $count) }}
{{- end }}
{{- end }}
{{- range $i, $pin := $pins }}
{{- $kv := splitList "=" $pin }}
{{- if ne (len $kv) 2 }}
{{- fail (printf "node group %s: machineImageId entry %q is not <node>=<vmid>" $ng.name $pin) }}
{{- end }}
{{- $node := index $kv 0 }}
{{- $vmid := index $kv 1 }}
{{- $replicas := div $count $n }}
{{- if lt $i (mod $count $n) }}{{- $replicas = add1 $replicas }}{{- end }}
{{- if $placement }}{{- $replicas = int (get $placement $node | default 0) }}{{- end }}
{{- $base := printf "%s-%s-%s" $root.Release.Name $ng.name $node }}
{{- $machine := dict "sourceNode" $node "templateID" (int $vmid) "allowedNodes" (list $node) "storage" $root.Values.proxmox.storage "format" "raw" "full" true "pool" ($ng.pool | default $root.Values.proxmox.pool) "checks" (dict "skipCloudInitStatus" true) "tags" $ng.machineTags "numSockets" 1 "numCores" (int $ng.machineCores) "memoryMiB" (int $ng.machineMemoryMiB) "disks" (dict "bootVolume" (dict "disk" "scsi0" "sizeGb" (int $ng.machineRootVolume.diskSize))) }}
{{- $device := dict "name" "net0" "bridge" $net.bridge "model" "virtio" }}
{{- if $net.mtu }}{{- $_ := set $device "linkMtu" (int $net.mtu) }}{{- $_ := set $device "mtu" 1 }}{{- end }}
{{- if $net.vlan }}{{- $_ := set $device "vlan" (int $net.vlan) }}{{- end }}
{{- if $ng.addresses }}
{{- $_ := set $device "defaultIPv4" false }}
{{- $_ := set $device "ipPoolRef" (list (dict "apiGroup" "ipam.cluster.x-k8s.io" "kind" "InClusterIPPool" "name" (printf "%s-%s" $root.Release.Name $ng.name))) }}
{{- end }}
{{- with $ng.dnsServers }}{{- $_ := set $device "dnsServers" . }}{{- end }}
{{- $_ := set $machine "network" (dict "networkDevices" (list $device)) }}
{{- $mtName := printf "%s-%s" $base (toJson $machine | sha256sum | trunc 8) }}
{{- $labels := dict "proxcloud.io/node-group" $ng.name "topology.kubernetes.io/region" $root.Values.proxmox.region "topology.kubernetes.io/zone" $node }}
{{- range $k, $v := $ng.nodeLabels }}{{- $_ := set $labels $k $v }}{{- end }}
{{- $labelArg := list }}
{{- range $k := keys $labels | sortAlpha }}{{- $labelArg = append $labelArg (printf "%s=%s" $k (get $labels $k)) }}{{- end }}
{{- $nodeReg := dict "name" "{{ local_hostname }}" "kubeletExtraArgs" (list (dict "name" "provider-id" "value" "proxmox://'{{ ds.meta_data.instance_id }}'") (dict "name" "node-labels" "value" (join "," $labelArg))) }}
{{- with $ng.taints }}{{- $_ := set $nodeReg "taints" . }}{{- end }}
{{- $bootstrap := dict "joinConfiguration" (dict "nodeRegistration" $nodeReg) }}
{{- $ktName := printf "%s-%s" $base (toJson $bootstrap | sha256sum | trunc 8) }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha2
kind: ProxmoxMachineTemplate
metadata:
  name: {{ $mtName }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  template:
    spec: {{ toJson $machine }}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: {{ $ktName }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  template:
    spec: {{ toJson $bootstrap }}
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: {{ $base }}
  labels:
    cluster.x-k8s.io/cluster-name: {{ $root.Release.Name }}
    proxcloud.io/node-group: {{ $ng.name }}
spec:
  clusterName: {{ $root.Release.Name }}
  replicas: {{ $replicas }}
  {{- if has $node ($ng.deleteFirstOn | default list) }}
  rollout:
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ $root.Release.Name }}
      proxcloud.io/machine-deployment: {{ $base }}
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: {{ $root.Release.Name }}
        proxcloud.io/machine-deployment: {{ $base }}
        proxcloud.io/node-group: {{ $ng.name }}
        {{- range $k, $v := $ng.machineLabels }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
    spec:
      clusterName: {{ $root.Release.Name }}
      {{- if ge (int $root.Values.nodeDeletionTimeoutSeconds) 0 }}
      deletion: {nodeDeletionTimeoutSeconds: {{ int $root.Values.nodeDeletionTimeoutSeconds }}}
      {{- end }}
      version: {{ printf "v%s" (get ($ng.kubernetesVersions | default dict) $node | default $root.Values.kubernetesVersion | toString | trimPrefix "v") | quote }}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: {{ $ktName }}
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: ProxmoxMachineTemplate
        name: {{ $mtName }}
{{- end }}
{{- with $ng.addresses }}
---
apiVersion: ipam.cluster.x-k8s.io/v1alpha2
kind: InClusterIPPool
metadata:
  name: {{ printf "%s-%s" $root.Release.Name $ng.name }}
  labels:
    cluster.x-k8s.io/cluster-name: {{ $root.Release.Name }}
    proxcloud.io/node-group: {{ $ng.name }}
spec:
  addresses: {{ toJson . }}
  prefix: {{ int $net.prefix }}
  gateway: {{ $net.gateway }}
{{- end }}
{{- $guard := 0 }}
{{- if gt (int $startup) 0 }}{{- $guard = min (int $mhc.maxUnhealthy) (sub $count 1) }}{{- end }}
{{- if gt (int $guard) 0 }}
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: {{ printf "%s-%s" $root.Release.Name $ng.name }}
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
  labels:
    cluster.x-k8s.io/cluster-name: {{ $root.Release.Name }}
    proxcloud.io/node-group: {{ $ng.name }}
spec:
  clusterName: {{ $root.Release.Name }}
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ $root.Release.Name }}
      proxcloud.io/node-group: {{ $ng.name }}
  checks:
    nodeStartupTimeoutSeconds: {{ int $startup }}
  remediation:
    triggerIf:
      unhealthyLessThanOrEqualTo: {{ int $guard }}
{{- end }}
{{- end }}
