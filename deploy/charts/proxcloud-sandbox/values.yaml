# Values contract of the sandbox chart. Bare defaults do not render (proxy.address and proxy.domain are required):
# examples/values-shared.yaml and examples/values-separate.yaml do. No secrets here: the chart sits in an ArgoCD
# Application (shared) or a HelmChartProxy (separate). The run writes the Secrets the proxy reads (sandbox-proxy-tls,
# sandbox-proxy-wake) into the release namespace itself.

# -- shared: a node group `sandbox` of the platform cluster pc-platform, next to kamaji-etcd and every tenant's control
# plane. The portal's identity is held to the sb-* namespaces by RBAC (a RoleBinding per namespace, which the portal
# writes) and four admission policies; the firewall identity may change sandbox nodes only; Cilium chains the network
# guard on the sandbox nodes only (CiliumNodeConfig). separate: the platform-owned cluster pc-sandbox, which runs
# sandboxes alone: the installer's cluster-wide identities (deploy/sandbox-cluster/rbac.yaml) and Cilium's chain on
# every node (the cluster chart's sandboxBandwidth). The pod policy and the rest are the same in both.
mode: shared

# Placement: null = the mode's default (templates/_helpers.tpl sbx.placement); a value replaces the default whole.

# -- Node-side DaemonSets (node-setup, telemetry, template prepull): only the nodes that run sandboxes. node-setup
# installs runsc and restarts containerd, so a selector that matches a platform node changes that node. Shared:
# {node-restriction.kubernetes.io/proxcloud-node-group: sandbox}. Separate: {} (every node of the sandbox cluster, as
# the installer; the network guard gate counts every node there).
sandboxNodes:
  nodeSelector: null

# -- System-side pods (sandbox-proxy, the agent-sandbox controller), {nodeSelector, tolerations} as the platform's
# placementValues. Never a sandbox node: the proxy holds the wildcard key, and a kubelet can read the Secrets of the
# pods on its node. Shared: the group system. Separate: node-restriction.kubernetes.io/proxcloud-system=true and the
# toleration of proxcloud.io/sandbox-system (installer template sandbox-cluster.yml.j2).
system:
  nodeSelector: null
  tolerations: null

# -- RuntimeClass of every sandbox pod. scheduling is merged by Kubernetes into every pod that names the class, and a
# pod whose own selector conflicts is refused: so every gVisor pod lands on a sandbox node and nowhere else. ONE
# toleration, proxcloud.io/sandbox: never proxcloud.io/unsecured, which keeps sandboxes off a node whose VM firewall
# is not written yet. Shared: nodeSelector node-restriction.kubernetes.io/proxcloud-node-group=sandbox and that
# toleration. Separate: none (the system group's own taint keeps sandboxes off it), as the installer.
runtimeClass:
  name: gvisor
  scheduling: null

# -- Shared only: the nodes whose Cilium agent chains the network guard (CiliumNodeConfig). A kubelet label, present
# when the agent starts, not the CAPI one, which arrives after it. Shared: proxcloud.io/node-group=sandbox.
cilium:
  nodeSelector: null

# -- The node label the firewall identity may patch (shared only): the CAPI label of the sandbox group.
sandboxNodeLabel: {key: node-restriction.kubernetes.io/proxcloud-node-group, value: sandbox}

runsc:
  # -- gVisor honours setuid, so sudo works in a sandbox (docs/managed-sandbox.md §1.4).
  allowSuid: true

# -- Denied from every sandbox on top of the private, CGNAT and link-local ranges: the platform prefix and the
# MetalLB range of a site whose platform network is not RFC 1918.
guardrail:
  extraDeny: []

# -- Image references pulled by the template prepull DaemonSet on every sandbox node, by digest (deploy/templates/
# images.yaml). Empty = no prepull.
prepull: []

proxy:
  replicas: 2
  # -- The address MetalLB announces for sandbox-proxy (metallb.io/loadBalancerIPs). Required.
  address: ""
  # -- Sandboxes are https://<port>-<id>.<domain>. Required.
  domain: ""
  # -- Where the proxy wakes a paused autoResume sandbox: <portal API>/api/v1/internal/sandboxes. Empty = no wake.
  wakeURL: ""

# -- Serverless functions on the cluster that runs sandboxes: gVisor Deployments fn-<16 hex> in fn-<projectId>
# namespaces, which the portal's sandbox identity writes and scales, served by sandbox-proxy as
# https://<name>-<6 hex>.<proxy.domain>. Off (the default) renders nothing of it: the chart is then what 0.1.0 was but
# for the proxy image. On adds: ClusterRole proxcloud-function-namespace (bound by the portal in each fn-* namespace
# in mode shared, part of its cluster-wide rules in mode separate), the fn- prefix in the namespace and RoleBinding
# policies of mode shared, two rules of the pod policy that hold in fn-* alone (no mounted token, no volume), policy
# proxcloud-function-objects (the identity's Deployments, scales and Secrets in fn-* tenant namespaces only),
# CiliumClusterwideNetworkPolicy function-tenant-egress-internet, and the proxy's function mode with its cluster-wide
# list of Deployments.
functions:
  enabled: false
  # -- Where the proxy wakes a function and reports traffic: <portal API>/api/v1/internal/functions. Required when
  # enabled. Its bearer is PROXCLOUD_FUNCTION_WAKE_TOKEN, a second key of Secret sandbox-proxy-wake, which the run
  # writes; never a value here.
  wakeURL: ""
  # -- PEM of the CA the portal's certificate chains to, when no public one signs it. The chart mounts it into the
  # proxy and points SSL_CERT_FILE at it. Empty = the image's own roots.
  portalCA: ""
  # -- Names the wake token without being it (the run sets a new value when it writes a new token). A pod template
  # annotation of the proxy: the proxy reads the token when it starts, so a new token needs new pods.
  wakeTokenVersion: ""

# -- By digest. runtime: envd, sandbox-init and sandbox-netguard (deploy/sandbox-runtime.Dockerfile), the CI build of
# main d26edd2e, the first whose sandbox-netguard reads a node's CiliumNodeConfig (shared mode needs it: an older one
# never lets node-setup become Ready there); proxy: cmd/sandbox-proxy, the CI build of main fd0afa97, the first build
# after the function mode (FUNCTION_DOMAIN; without it the binary serves sandboxes as before) and the function names
# it shares with the portal were both on main. busybox as deploy/sandbox-cluster/registry.yaml, pause as the
# installer's versions.yml.
images:
  runtime: ghcr.io/mutex-solutions/proxcloud-sandbox-runtime:dev-d26edd2@sha256:cd4173bec686383ac25147f0851f7c1633b1ee8a2e68a3e061eea23f5d6873fb
  proxy: ghcr.io/mutex-solutions/proxcloud-sandbox-proxy:dev-fd0afa9@sha256:e80c082ee158a7d98528ce45927a86c2bffe80bbce082f9ef0aa04db7f3cd0d0
  busybox: docker.io/library/busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
  pause: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
