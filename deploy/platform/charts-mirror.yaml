# The chart mirror manifest (docs/ci-release.md, "Chart mirror"): every third-party chart of platform-bom.yaml, and
# where its bytes come from. .github/scripts/charts_mirror.py fetches each chart exactly as pinned here, and
# .github/workflows/charts-mirror.yml republishes it under oci://ghcr.io/mutex-solutions/charts-mirror on a
# `charts-mirror-v<n>` tag. Nothing is published from a workstation.
#
# One chart per line, in one of three shapes (the script reads this file without a YAML library and fails on any
# other line):
#   https  {name, version, repo: "https://...", digest, licence}
#          digest = the `digest` of that version in the repository's index.yaml = the sha256 of the .tgz. The
#          downloaded archive is hashed and republished unchanged.
#   oci    {name, version, repo: <host>/<path>, digest, licence}
#          digest = the chart's OCI manifest digest. The chart is pulled by that digest and republished unchanged.
#   git    {name, version, git, tag, commit, path, appVersion, licence[, vendorName, vendorVersion, vendorRepo,
#          vendorDigest]}
#          The chart directory `path` of the upstream repository at `tag`, which must still point at `commit`.
#          Upstream publishes this chart only as the moving version 0.0.0+latest, so it is packaged here with
#          `helm package --version <version> --app-version <appVersion>`. vendor*: the one dependency of the chart's
#          Chart.lock, fetched like an https chart and placed in charts/ (a dependency that is not listed fails).
#          LICENSE and NOTICE of the repository root at that commit are copied into the chart, and one paragraph in
#          NOTICE and the annotation charts-mirror/changes in Chart.yaml state the source and what was changed
#          (Apache-2.0 section 4); the repository must have a LICENSE and Chart.yaml an `annotations:` block.
#
# kamaji and kamaji-crds: version = appVersion = the upstream git tag 26.11.2-edge, which is also the image tag
# (clastix/kamaji:26.11.2-edge; the BOM pins it through the chart version and sets no image.tag). It is a valid SemVer version (a pre-release of 26.11.2, as upstream means
# by "edge"), has no "+" (Helm stores "+" as "_" in an OCI tag), and makes the chart's default image the pinned one,
# because the chart falls back to appVersion when image.tag is unset.
#
# .github/scripts/tests/test_charts_mirror.py keeps this file equal to platform-bom.yaml: the same third-party charts
# and versions (and digests, for a chart the BOM takes from upstream; the BOM takes all of them from the mirror, whose
# manifest digests are in the BOM and not here), and nothing the BOM does not use. `licence` must be one that allows redistribution
# (Apache-2.0 or MIT); it is the licence of the upstream repository, read by a person, not by the script.
